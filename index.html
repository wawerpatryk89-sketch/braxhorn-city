<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#080b08">
<meta name="robots" content="noindex,nofollow">
<title>BRAXHORN CITY — Brax / Osiedle Unity 6</title>
<style>
:root{color-scheme:dark;--safeL:max(16px,env(safe-area-inset-left));--safeR:max(16px,env(safe-area-inset-right));}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:#0b110c;color:#eef3e8;overflow:hidden;
 font:14px/1.5 system-ui,-apple-system,Arial,sans-serif;overscroll-behavior:none;
 touch-action:none;-webkit-user-select:none;user-select:none}
#unity-canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#loading{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
 background:#0a0f0b;text-align:center;padding:25px;transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}
#loading img{max-width:min(75vw,350px);max-height:80px;object-fit:contain}
#loading h1{font-size:25px;letter-spacing:.16em;margin:12px 0 4px}
#loading p{font-size:12px;color:#aab9a4;letter-spacing:.03em}
.progress{height:4px;width:min(320px,65vw);margin:22px auto 0;background:#273225;border-radius:3px;overflow:hidden}
#bar{display:block;height:100%;width:0;background:#8bff3a;transition:width .2s}
#status{max-width:460px;margin:auto}
#hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.top{position:absolute;left:var(--safeL);top:max(13px,env(safe-area-inset-top));
 color:#eef1ea;text-shadow:0 1px 5px #000;font-size:12px;letter-spacing:.11em;font-weight:850}
.top span{display:block;font-size:10px;letter-spacing:.10em;color:#b6d4a9;margin-top:1px}
#hint{position:absolute;left:var(--safeL);bottom:max(18px,env(safe-area-inset-bottom));
 font-size:11px;color:#e8f3d6b8;text-shadow:0 1px 5px #000}
#joystick{position:fixed;z-index:4;width:116px;height:116px;border-radius:50%;
 border:1px solid #c7f7b055;background:#111c10b8;pointer-events:none;
 box-shadow:0 0 0 4px #82de4630;transform:translate(-50%,-50%);
 display:none}
#knob{position:absolute;width:48px;height:48px;left:50%;top:50%;border-radius:50%;
 background:#8bff3ac9;border:1px solid #ddffc4;box-shadow:0 0 15px #80fa5070;
 transform:translate(-50%,-50%)}
#joystick.active{display:block}
#warning{position:absolute;right:var(--safeR);top:max(13px,env(safe-area-inset-top));
 max-width:48%;font-size:11px;color:#fff6d4;text-align:right}
#rotate{display:none;position:fixed;inset:0;z-index:10;background:#0a110c;
 align-items:center;justify-content:center;text-align:center;padding:26px}
#rotate b{font-size:40px;display:block}
#rotate p{font-size:14px;color:#bccdb4}
@media(orientation:portrait){#rotate{display:flex}}
@media(max-height:430px){#hint{font-size:10px;bottom:max(10px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="0" aria-label="Braxhorn City Osiedle Unity 6"></canvas>
<div id="loading" role="status" aria-live="polite">
<div><img src="StreamingAssets/Estate/wide_a.webp" alt="BRAXHORN">
<h1>BRAXHORN CITY</h1><p>OSIEDLE · TYLKO BRAX · UNITY 6</p>
<div class="progress"><i id="bar"></i></div><p id="status">Wczytywanie oryginalnej mapy i Braxa…</p>
</div></div>
<div id="hud">
<div class="top">BRAXHORN CITY<span>BRAX · OSIEDLE WIŚNIOWA</span></div>
<div id="warning"></div>
<div id="hint">LEWY KCIUK: CHÓD / BIEG · PRAWY: KAMERA · TYLKO BRA X</div>
</div>
<div id="joystick"><div id="knob"></div></div>
<div id="rotate"><div><b>↻</b><h2>Obróć iPhone poziomo</h2><p>Ruch lewym kciukiem, kamera prawym.</p></div></div>
<script>
(function() {
"use strict";
const canvas=document.getElementById("unity-canvas");
const loading=document.getElementById("loading");
const status=document.getElementById("status");
const bar=document.getElementById("bar");
const joy=document.getElementById("joystick");
const knob=document.getElementById("knob");
const warning=document.getElementById("warning");
let unity=null,worldReady=false,started=false,playing=false;
let joystickFinger=null,lookFinger=null,joyX=0,joyY=0,lookX=0,lookY=0,joyCenterX=0,joyCenterY=0;
const R=55;
function say(t){status.textContent=t;}
function send(method,value){
 if(!unity)return;
 try{unity.SendMessage("ESTATE_PARTIAL_SOURCE_PREVIEW_NOT_ACCEPTED",method,String(value));}
 catch(e){console.error("Original Unity Brax input failed:",e);}
}
function begin(){
 if(!unity||!worldReady||started)return;
 started=true;
 say("Uruchamiam Braxa…");
 send("OnWebAction","hero:brax");
}
window.BrxUnityEstateReady=function(){worldReady=true;begin();};
window.BrxUnityHeroReady=function(){
 playing=true;
 loading.classList.add("done");
 canvas.focus({preventScroll:true});
 console.log("BRAX WALK UNITY READY - original estate source and original Brax selected");
};
const cfg={
 dataUrl:"Build/EstatePartial_NOT_1TO1.data.gz",
 frameworkUrl:"Build/EstatePartial_NOT_1TO1.framework.js.gz",
 codeUrl:"Build/EstatePartial_NOT_1TO1.wasm.gz",
 streamingAssetsUrl:"StreamingAssets",companyName:"BRAXHORN",
 productName:"BRAXHORN CITY - tylko Brax",productVersion:"2026-10-30",
 devicePixelRatio:Math.min(devicePixelRatio||1,1.5),
 showBanner:function(msg,type){console[type==="error"?"error":"warn"](msg);
  if(type==="error") warning.textContent=msg;}
};
const boot=document.createElement("script");
boot.src="Build/EstatePartial_NOT_1TO1.loader.js";
boot.onload=function(){
 createUnityInstance(canvas,cfg,function(p){
  bar.style.width=Math.min(95,Math.round(p*95))+"%";
  if(p>.96)say("Wczytywanie oryginalnego osiedla…");
 }).then(function(instance){
  unity=instance;window.BraxUnityWalk=instance;begin();
 }).catch(function(e){say("Błąd Unity: "+e);console.error(e)});
};
boot.onerror=function(){say("Nie można pobrać Unity 6. Odśwież stronę.")};
document.body.appendChild(boot);
const pointers=new Map();
function updateJoystick(clientX,clientY) {
 let dx=clientX-joyCenterX,dy=clientY-joyCenterY;
 const length=Math.hypot(dx,dy);
 if(length>R){dx*=R/length;dy*=R/length}
 joyX=dx/R;joyY=-dy/R;
 knob.style.transform="translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px))";
 send("OnWebJoystick",joyX.toFixed(4)+","+joyY.toFixed(4)+",1");
}
function release(id) {
 const ptr=pointers.get(id);
 if(!ptr)return;
 if(ptr==="joy"){
  joystickFinger=null;joy.classList.remove("active");
  knob.style.transform="translate(-50%,-50%)";
  send("OnWebJoystick","0,0,0");
 }else if(ptr==="look")lookFinger=null;
 pointers.delete(id);
}
canvas.addEventListener("pointerdown",function(e){
 if(!playing)return;
 const rect=canvas.getBoundingClientRect();
 if(joystickFinger===null && e.clientX<rect.left+rect.width*.46){
  pointers.set(e.pointerId,"joy");joystickFinger=e.pointerId;
  joyCenterX=e.clientX;joyCenterY=e.clientY;
  joy.style.left=joyCenterX+"px";joy.style.top=joyCenterY+"px";joy.classList.add("active");
  updateJoystick(e.clientX,e.clientY);
 }else if(lookFinger===null){
  pointers.set(e.pointerId,"look");lookFinger=e.pointerId;
  lookX=e.clientX;lookY=e.clientY;
 }
 try{canvas.setPointerCapture(e.pointerId)}catch(_){}
 e.preventDefault();
});
canvas.addEventListener("pointermove",function(e){
 const which=pointers.get(e.pointerId);
 if(which==="joy")updateJoystick(e.clientX,e.clientY);
 else if(which==="look"){
  send("OnWebLook",(e.clientX-lookX).toFixed(3)+","+(e.clientY-lookY).toFixed(3));
  lookX=e.clientX;lookY=e.clientY;
 }
 if(which)e.preventDefault();
});
for(const event of ["pointerup","pointercancel","lostpointercapture"])
 canvas.addEventListener(event,function(e){release(e.pointerId)});
window.addEventListener("blur",function(){for(const k of Array.from(pointers.keys()))release(k)});
for(const event of ["gesturestart","gesturechange","dblclick"])
 document.addEventListener(event,function(e){e.preventDefault()},{passive:false});
})();
</script>
</body>
</html>
