<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
window.nodes = async (url, depth = 2) => {
  const isFbx = url.toLowerCase().endsWith('.fbx');
  const root = isFbx ? await new FBXLoader().loadAsync(url) : (await new GLTFLoader().loadAsync(url)).scene;
  root.updateMatrixWorld(true);
  const out = [];
  const walk = (o, d) => {
    if (d > depth) return;
    const b = new THREE.Box3().setFromObject(o); const s = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    let tris = 0; o.traverse(m => { if (m.isMesh) tris += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; });
    out.push('  '.repeat(d) + `${o.type}:${o.name} size=${s.toArray().map(v => v.toFixed(1))} c=${c.toArray().map(v => v.toFixed(1))} tris=${Math.round(tris)} kids=${o.children.length}`);
    if (o.children.length < 100) for (const k of o.children) walk(k, d + 1);
  };
  walk(root, 0);
  return out.slice(0, 90).join('\n');
};
window.ready = true;
</script>
