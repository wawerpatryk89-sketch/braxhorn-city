<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
const loader = new FBXLoader();
// Do not fetch the huge textures during inspection
THREE.DefaultLoadingManager.setURLModifier(u => u);
window.inspect = async (url) => {
  const obj = await loader.loadAsync(url);
  const out = { url, meshes: [], bones: [], anims: [] };
  obj.traverse(o => {
    if (o.isMesh) {
      const g = o.geometry;
      out.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, verts: g.attributes.position.count,
        tris: g.index ? g.index.count / 3 : g.attributes.position.count / 3,
        attrs: Object.keys(g.attributes), groups: g.groups.length,
        mats: (Array.isArray(o.material) ? o.material : [o.material]).map(m => m.name + ':' + (m.map ? 'map' : '-')) });
    }
    if (o.isBone) out.bones.push(o.name);
  });
  const box = new THREE.Box3().setFromObject(obj);
  out.box = [box.min.toArray().map(v=>+v.toFixed(2)), box.max.toArray().map(v=>+v.toFixed(2))];
  out.scale = obj.scale.toArray();
  for (const a of obj.animations) out.anims.push({ name: a.name, dur: +a.duration.toFixed(2), tracks: a.tracks.length, sample: a.tracks.slice(0, 3).map(t => t.name) });
  out.boneCount = out.bones.length;
  out.bones = out.bones.slice(0, 80);
  return out;
};
window.ready = true;
</script>
