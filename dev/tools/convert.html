<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const loader = new FBXLoader();
const S = window.S = { models: {}, clips: {} };

function describe(o, depth = 0, out = []) {
  if (depth > 2) return out;
  out.push(' '.repeat(depth * 2) + `${o.type}:${o.name} pos=${o.position.toArray().map(v => v.toFixed(2))} rot=${o.rotation.toArray().slice(0, 3).map(v => (v * 180 / Math.PI).toFixed(1))} scl=${o.scale.toArray().map(v => v.toFixed(3))}`);
  for (const c of o.children) describe(c, depth + 1, out);
  return out;
}

window.loadModel = async (key, url) => {
  const obj = await loader.loadAsync(url);
  S.models[key] = obj;
  let hips; obj.traverse(o => { if (o.name === 'mixamorigHips') hips = o; });
  obj.updateMatrixWorld(true);
  const hw = new THREE.Vector3(); hips.getWorldPosition(hw);
  return { tree: describe(obj), hipsLocal: hips.position.toArray(), hipsWorld: hw.toArray() };
};

window.loadClip = async (name, url) => {
  const obj = await loader.loadAsync(url);
  const clip = obj.animations[0];
  clip.name = name;
  S.clips[name] = clip;
  (S.animObjs ||= {})[name] = obj;
  const hp = clip.tracks.find(t => t.name === 'mixamorigHips.position');
  const v = hp.values, n = v.length / 3;
  let hipsBone; obj.traverse(o => { if (o.name === 'mixamorigHips') hipsBone = o; });
  return { name, dur: +clip.duration.toFixed(2), frames: hp.times.length, tracks: clip.tracks.length,
    hips0: [v[0], v[1], v[2]].map(x => +x.toFixed(1)), hipsEnd: [v[3 * n - 3], v[3 * n - 2], v[3 * n - 1]].map(x => +x.toFixed(1)),
    hipsMinY: +Math.min(...Array.from({ length: n }, (_, i) => v[3 * i + 1])).toFixed(1),
    hipsRest: hipsBone.position.toArray().map(x => +x.toFixed(1)),
    topTree: describe(obj).slice(0, 3) };
};

// ---------- preview rendering ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(360, 440);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const texLoader = new THREE.TextureLoader();
const texCache = {};
function tex(url, srgb) {
  if (!texCache[url]) { const t = texLoader.load(url); if (srgb) t.colorSpace = THREE.SRGBColorSpace; texCache[url] = t; }
  return texCache[url];
}
window.preview = async (key, clipName, times, yaw = 0) => {
  const src = S.models[key];
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x333333);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.5));
  const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(1, 2, 3); scene.add(dl);
  const grid = new THREE.GridHelper(400, 20); scene.add(grid);
  const mat = new THREE.MeshStandardMaterial({ map: tex(`/tex/${key}_color.jpg`, true), roughness: 0.7 });
  src.traverse(o => { if (o.isMesh) { o.material = mat; o.frustumCulled = false; } });
  scene.add(src);
  src.rotation.y = yaw;
  const cam = new THREE.PerspectiveCamera(40, 360 / 440, 1, 5000);
  cam.position.set(0, 110, 360); cam.lookAt(0, 90, 0);
  const mixer = new THREE.AnimationMixer(src);
  let action = null;
  if (clipName) { action = mixer.clipAction(S.clips[clipName]); action.play(); }
  // wait textures
  await new Promise(r => setTimeout(r, 300));
  const imgs = [];
  for (const t of times) {
    if (action) { mixer.setTime(t); }
    renderer.render(scene, cam);
    imgs.push(renderer.domElement.toDataURL('image/jpeg', 0.8));
  }
  if (action) { action.stop(); mixer.uncacheRoot(src); }
  scene.remove(src);
  return imgs;
};
const BONES_OF_INTEREST = ['mixamorigHips', 'mixamorigHead', 'mixamorigHeadTop_End', 'mixamorigLeftFoot', 'mixamorigRightFoot', 'mixamorigLeftToeBase', 'mixamorigRightToeBase', 'mixamorigLeftHand', 'mixamorigRightHand', 'mixamorigLeftToe_End'];
window.measure = (key, clipName, t) => {
  const src = S.models[key];
  const mixer = new THREE.AnimationMixer(src);
  const a = mixer.clipAction(S.clips[clipName]); a.play(); mixer.setTime(t);
  src.updateMatrixWorld(true);
  const out = {};
  src.traverse(o => {
    if (BONES_OF_INTEREST.includes(o.name)) { const p = new THREE.Vector3(); o.getWorldPosition(p); out[o.name.replace('mixamorig', '')] = p.toArray().map(v => +v.toFixed(1)); }
    if (o.name === 'Armature') { out.armatureWorld = o.matrixWorld.elements.map(v => +v.toFixed(2)); out.armChildren = o.children.map(c => c.name); }
  });
  let hips; src.traverse(o => { if (o.name === 'mixamorigHips') hips = o; });
  out.hipsParent = hips.parent.name + ':' + hips.parent.type;
  out.hipsLocal = hips.position.toArray().map(v => +v.toFixed(1));
  a.stop(); mixer.uncacheRoot(src);
  return out;
};
window.THREE = THREE; window.FBXLoaderClass = FBXLoader; window.GLTFLoaderClass = (await import('three/addons/loaders/GLTFLoader.js')).GLTFLoader;
window.GLTFExporter = GLTFExporter;
const pl = await import('./pipeline.js');
Object.assign(window, pl);
window.ready = true;
</script>
