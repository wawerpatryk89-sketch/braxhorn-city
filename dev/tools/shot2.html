<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setSize(900, 600); R.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(R.domElement);
const ktx2 = new KTX2Loader().setTranscoderPath('/three/examples/jsm/libs/basis/').detectSupport(R);
const L = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
window.THREE = THREE; window.L = L; window.R = R;
// views: [{type:'top'} | {type:'persp', az, el, k} | {type:'side', axis:'x'|'z', dir:1|-1}]
window.shots = async (url, views, opts = {}) => {
  const g = await L.loadAsync(url); const root = g.scene;
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x30363e);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 2.2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(3, 5, 2); scene.add(d);
  scene.add(root); root.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(root), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  // grid every 5 m at the lowest point
  if (opts.grid !== false) { const gr = new THREE.GridHelper(Math.ceil(Math.max(s.x, s.z) / 5) * 5 + 10, Math.ceil(Math.max(s.x, s.z) / 5) + 2, 0xff3355, 0x88ff44); gr.position.set(Math.round(c.x / 5) * 5, b.min.y + 0.02, Math.round(c.z / 5) * 5); scene.add(gr); }
  const out = []; let tris = 0; root.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  for (const v of views) {
    let cam;
    if (v.type === 'top' || v.type === 'side') {
      const half = Math.max(s.x, s.z, s.y) * 0.55 * (v.k || 1);
      cam = new THREE.OrthographicCamera(-half * 1.5, half * 1.5, half, -half, -5000, 5000);
      if (v.type === 'top') { cam.position.set(c.x, b.max.y + 50, c.z); cam.up.set(0, 0, -1); cam.lookAt(c.x, 0, c.z); }
      else { const dir = new THREE.Vector3(v.axis === 'x' ? v.dir : 0, 0, v.axis === 'z' ? v.dir : 0); cam.position.copy(c).addScaledVector(dir, 500); cam.lookAt(c); }
    } else {
      const rad = s.length() / 2; cam = new THREE.PerspectiveCamera(50, 1.5, rad / 300, rad * 30);
      const dir = new THREE.Vector3(Math.sin(v.az) * Math.cos(v.el), Math.sin(v.el), Math.cos(v.az) * Math.cos(v.el));
      const tgt = v.tgt ? new THREE.Vector3(...v.tgt) : c;
      cam.position.copy(tgt).addScaledVector(dir, v.dist || rad * (v.k || 1.4)); cam.lookAt(tgt);
    }
    R.render(scene, cam); out.push(R.domElement.toDataURL('image/jpeg', 0.82));
  }
  return { box: [b.min.toArray(), b.max.toArray()].map(a => a.map(v => +v.toFixed(2))), tris: Math.round(tris), out };
};
window.ready = true;
</script>
