<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Braxhorn City — eksport prawdziwej siłowni do Unity (tylko test)</title>
  <script type="importmap">
    {"imports":{"three":"/dev/three/build/three.module.js","three/addons/":"/dev/three/examples/jsm/"}}
  </script>
  <style>
    body { margin:0; background:#101214; color:#dce5dd; font:14px system-ui,sans-serif; }
    #source { display:block; border:0; width:960px; height:540px; max-width:100%; }
    #status { margin:12px; }
  </style>
</head>
<body>
  <p id="status">Wczytywanie oryginalnej siłowni z Braxhorn City…</p>
  <!-- Same-origin iframe lets the original game construct the actual meshes, textures, and baked light.
       No production files or player models are modified by this tool. -->
  <iframe id="source" src="/public/index.html" title="Oryginalna gra Braxhorn City"></iframe>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const status = document.getElementById('status');
    const frame = document.getElementById('source');
    window.gymReady = false;
    window.gymExportError = null;

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function waitForBakedGym() {
      const deadline = performance.now() + 180000;
      while (performance.now() < deadline) {
        const game = frame.contentWindow && frame.contentWindow.__mg;
        if (game && typeof game.baked === 'function' && game.baked()) return game;
        await sleep(250);
      }
      throw new Error('Nie udało się wczytać oryginalnej siłowni z upieczonym światłem. Eksport przerwany.');
    }

    async function initialize() {
      try {
        await waitForBakedGym();
        window.gymReady = true;
        status.textContent = 'Oryginalna siłownia gotowa do eksportu. To nie jest przebudowany model.';
      } catch (err) {
        window.gymExportError = String(err);
        status.textContent = window.gymExportError;
      }
    }
    initialize();

    function plainCollision(world) {
      const boxes = world.boxes.map((b) => ({
        minX: b.minX, maxX: b.maxX, minZ: b.minZ, maxZ: b.maxZ,
        top: b.top, bottom: b.bottom, tag: b.tag || ''
      }));
      const circles = world.circles.map((c) => ({
        x: c.x, z: c.z, r: c.r, top: c.top, bottom: c.bottom,
        tag: c.tag || '', noStand: !!c.noStand
      }));
      return { boxes, circles };
    }

    // The original game runs inside an iframe, while the exporter lives in the parent.
    // TypedArray constructors belong to their JS realm. GLTFExporter requires typed arrays
    // created in its own realm, even if the element types have identical names.
    const ARRAY_TYPES = {
      Float32Array, Float64Array, Uint8Array, Uint8ClampedArray, Int8Array,
      Uint16Array, Int16Array, Uint32Array, Int32Array
    };
    function localAttribute(attr) {
      const type = attr.array && attr.array.constructor && attr.array.constructor.name;
      const Constructor = ARRAY_TYPES[type] || Float32Array;
      const values = new Constructor(attr.count * attr.itemSize);
      if (attr.isInterleavedBufferAttribute) {
        for (let i = 0; i < attr.count; i++) {
          values[i * attr.itemSize] = attr.getX(i);
          if (attr.itemSize > 1) values[i * attr.itemSize + 1] = attr.getY(i);
          if (attr.itemSize > 2) values[i * attr.itemSize + 2] = attr.getZ(i);
          if (attr.itemSize > 3) values[i * attr.itemSize + 3] = attr.getW(i);
        }
      } else {
        values.set(attr.array);
      }
      return new THREE.BufferAttribute(values, attr.itemSize, !!attr.normalized);
    }
    function localGeometry(original) {
      const geo = new THREE.BufferGeometry();
      for (const [name, attr] of Object.entries(original.attributes)) {
        if (!['position', 'normal', 'uv', 'uv2', 'color', 'tangent'].includes(name)) continue;
        geo.setAttribute(name, localAttribute(attr));
      }
      if (original.index) geo.setIndex(localAttribute(original.index));
      for (const group of original.groups) geo.addGroup(group.start, group.count, group.materialIndex);
      return geo;
    }

    window.exportGym = async () => {
      if (!window.gymReady) throw new Error(window.gymExportError || 'Siłownia nie jest jeszcze gotowa.');
      const game = frame.contentWindow.__mg;
      if (!game.baked()) throw new Error('Brak prawidłowego baked lighting — nie eksportuję zastępczej siłowni.');
      const original = game.scene.getObjectByName('gym');
      if (!original) throw new Error('Oryginalna scena nie ma obiektu gym.');

      // Flatten to world transforms but KEEP original geometry, diffuse/normal textures,
      // materials, UVs and baked vertex colours. Do not synthesize placeholder meshes.
      original.updateMatrixWorld(true);
      const root = new THREE.Group();
      root.name = 'BRAXHORN_CITY_ORIGINAL_GYM';
      const omitted = [];
      let meshes = 0, vertices = 0, triangles = 0;
      original.traverse((node) => {
        if (!node.isMesh || !node.geometry || !node.geometry.attributes.position) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        if (mats.some((m) => !m || m.isShaderMaterial || m.isShadowMaterial)) {
          omitted.push({ name: node.name || '(unnamed)', reason: 'unsupported shader or shadow-only mesh' });
          return;
        }
        const mesh = new THREE.Mesh(localGeometry(node.geometry), node.material);
        mesh.name = node.name || 'Gym_Mesh_' + meshes;
        mesh.matrixAutoUpdate = false;
        mesh.matrix.fromArray(node.matrixWorld.elements);
        mesh.updateMatrixWorld(true);
        root.add(mesh);
        meshes++;
        vertices += node.geometry.attributes.position.count;
        triangles += (node.geometry.index ? node.geometry.index.count : node.geometry.attributes.position.count) / 3;
      });

      if (meshes < 20 || vertices < 500) {
        throw new Error('Eksport za mały — prawdopodobnie nie objął prawdziwej siłowni.');
      }

      status.textContent = 'Eksportuję ' + meshes + ' rzeczywistych siatek do GLB…';
      const bytes = await new GLTFExporter().parseAsync(root, {
        binary: true, onlyVisible: false, maxTextureSize: 2048,
        includeCustomExtensions: false, trs: false
      });
      if (!(bytes instanceof ArrayBuffer) || bytes.byteLength < 100000) {
        throw new Error('Nieprawidłowy lub pusty wynik eksportu GLB.');
      }
      const link = document.createElement('a');
      const url = URL.createObjectURL(new Blob([bytes], { type: 'model/gltf-binary' }));
      link.href = url;
      link.download = 'braxhorn-original-gym.glb';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);

      // Coordinates are copied from the original collision engine (World), not estimated.
      const points = game.POINTS || {};
      const coords = {};
      for (const key of ['gym_start', 'gym_ring_center', 'gym_door_in', 'gym_door_out', 'street_gym']) {
        const p = points[key];
        if (p) coords[key] = { x: p.x, y: p.y, z: p.z, face: p.face };
      }
      const manifest = {
        project: 'braxhorn-city', scope: 'original-gym-only',
        origin: 'web-threejs-r160', geometry: 'exported-from-running-original-game',
        bakedLight: true, coordinateSystem: 'Three.js metres / Y-up',
        maxTextureSize: 2048,
        meshes, vertices, triangles: Math.round(triangles),
        bytes: bytes.byteLength, omitted,
        spawnAndEntrances: coords,
        collisions: plainCollision(game.world),
        warnings: [
          'No characters or animations included in the gym geometry export.',
          'Moving/interactive meshes are exported in their current static pose.',
          'Real Unity visual comparison and collision/door tests remain mandatory.'
        ]
      };
      status.textContent = 'GLB wygenerowany. Sprawdź import i obraz w Unity; nie jest to zakończona migracja.';
      return manifest;
    };
  </script>
</body>
</html>
