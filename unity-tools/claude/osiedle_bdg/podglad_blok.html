const TCACHE={}; function tex(slug,rep,kind){const k=slug+'_'+kind; if(!TCACHE[k]){const b=ld('tex/'+k+'.jpg'); b.wrapS=b.wrapT=THREE.RepeatWrapping; b.anisotropy=8; if(kind==='diff')b.colorSpace=THREE.SRGBColorSpace; TCACHE[k]=b} const t=TCACHE[k].clone(); t.repeat.set(1/rep,1/rep); return t}

// materiały z paleta.json (ta sama paleta trafia do gry)

  if(v.tex) M[k]=pbr(v.tex,v.m,v.kol,v.szorst,{brud:v.brud,naklejka:v.nakl,sila:1})

M.okno=okno(2.6,1.); M.okno_klatka=okno(1.8,0.)

const g=await new GLTFLoader().loadAsync('out/'+(Q.get('plik')||'blok_32a.glb'))
g.scene.traverse(o=>{ if(!o.isMesh) return; const mat=o.name.split('|')[1]||(o.parent&&o.parent.name.split('|')[1]); const m=M[mat]
  if(!m) console.log('BRAK',o.name); o.material=m||flat([255,0,255],.5); o.castShadow=!/okno|teren/.test(mat||''); o.receiveShadow=true })
sc.add(g.scene)

// trawa 3D jak w grze (BraxClaudeTrawa): kępy = 3 płaszczyzny co 60°, karty z atlasu grass_medium_01, tylko w promieniu od kamery
if(+(Q.get('trawa3d')||0)>0){
  const R=+Q.get('trawa3d'), GEST=+(Q.get('gest')||110), HK=+(Q.get('hk')||.13), ATL=Q.get('atlas')||'kepy_bermuda', oko=num('oko')
  const AT=await (await fetch('tex/detail/'+ATL+'.json')).json(); const at=ld('tex/detail/'+ATL+'.png'); at.colorSpace=THREE.SRGBColorSpace
  const gl=lin(PAL.trawa.kol), cm=AT.srednia_lin, mat=bezOdwr(new THREE.MeshStandardMaterial({map:at,alphaTest:.45,side:THREE.DoubleSide,roughness:.95}))
  const JA=+(Q.get('jasn')||1.45); mat.color.setRGB(Math.min(4,gl[0]*JA/cm[0]),Math.min(4,gl[1]*JA/cm[1]),Math.min(4,gl[2]*JA/cm[2]),THREE.LinearSRGBColorSpace)
  const tri=[]; let pole=0; g.scene.updateMatrixWorld(true)
  g.scene.traverse(o=>{ if(!o.isMesh) return; const mn=o.name.split('|')[1]||(o.parent&&o.parent.name.split('|')[1]); if(mn!=='trawa') return
    const p=o.geometry.attributes.position, ix=o.geometry.index, v=new THREE.Vector3(), n=ix?ix.count:p.count, P=k=>v.fromBufferAttribute(p,ix?ix.getX(k):k).applyMatrix4(o.matrixWorld).clone()
    for(let k=0;k<n;k+=3){const a=P(k),b=P(k+1),c=P(k+2); const cx=(a.x+b.x+c.x)/3-oko[0], cz=(a.z+b.z+c.z)/3-oko[2]; if(cx*cx+cz*cz>(R+15)*(R+15)) continue
      const ar=new THREE.Vector3().crossVectors(b.clone().sub(a),c.clone().sub(a)).length()/2; if(ar<1e-4) continue; tri.push([a,b,c,ar]); pole+=ar}})
  let s=12345; const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff)
  const kom=AT.komorki, lis=kom.map(()=>[]), m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler()
  for(const [a,b,c,ar] of tri){ let want=ar*GEST, n=Math.floor(want)+(rnd()<want%1?1:0)
    for(let k=0;k<n;k++){ let u=rnd(), w=rnd(); if(u+w>1){u=1-u;w=1-w}
      const x=a.x+(b.x-a.x)*u+(c.x-a.x)*w, y=a.y+(b.y-a.y)*u+(c.y-a.y)*w, z=a.z+(b.z-a.z)*u+(c.z-a.z)*w
      const dx=x-oko[0], dz=z-oko[2]; if(dx*dx+dz*dz>R*R) continue
      const zan=Math.min(1,Math.max(0,(R-Math.sqrt(dx*dx+dz*dz))/(R*.45))); if(rnd()>zan) continue; const hs=HK*(.75+.4*rnd())*(.6+.4*zan); e.set((rnd()-.5)*.2,rnd()*6.283,(rnd()-.5)*.2); q.setFromEuler(e)
      const WG=ATL==='kepy_bermuda'?[1,1,1,.8,.6,.22]:kom.map(()=>1), SW=WG.reduce((a,b)=>a+b,0); let rr=rnd()*SW, ci=0; while(ci<WG.length-1&&rr>WG[ci]){rr-=WG[ci];ci++}
      lis[ci].push(m4.clone().compose(new THREE.Vector3(x,y-.01,z),q,new THREE.Vector3(hs,hs,hs)))}}
  let ile=0
  kom.forEach((K,ci)=>{ if(!lis[ci].length) return; const asp=K.aspekt, pos=[], uv=[], nr=[], id=[]
    for(let qd=0;qd<3;qd++){const an=qd*Math.PI/3, dx=Math.cos(an)*asp/2, dz=Math.sin(an)*asp/2, b0=pos.length/3
      pos.push(-dx,0,-dz, dx,0,dz, dx,1,dz, -dx,1,-dz); uv.push(K.u,K.v, K.u+K.w,K.v, K.u+K.w,K.v+K.h, K.u,K.v+K.h); for(let i=0;i<4;i++) nr.push(0,1,0)
      id.push(b0,b0+1,b0+2,b0,b0+2,b0+3)}
    const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); geo.setAttribute('normal',new THREE.Float32BufferAttribute(nr,3)); geo.setIndex(id)
    const im=new THREE.InstancedMesh(geo,mat,lis[ci].length); lis[ci].forEach((M,i)=>im.setMatrixAt(i,M)); im.receiveShadow=true; im.frustumCulled=false; sc.add(im); ile+=lis[ci].length})
  window.KEPY=ile
}
// drzewa z biblioteki właściciela (te same modele co w grze), punkty z osiedle_punkty.json
if(Q.get('drzewa')==='1'){
  // drzewa jak w grze: pień drzewo_verdant + korona z kart-gałązek (drzewo_klaster, BraxClaudeOsiedleDrzewa), młode =
  // las_drzewko (tree_small_02 w wersji na telefon), iglaste = las_sosna_a; normalne korony sferyczne (shader OsiedleLiscie)
  const PT=await (await fetch('out/osiedle_punkty.json')).json(); const GL=new GLTFLoader()
  const ver=(await GL.loadAsync('lib/drzewo_verdant.glb')).scene, kl=(await GL.loadAsync('lib/drzewo_klaster.glb')).scene
  const korona=kl.getObjectByName('liscie_0'); const kg=korona.geometry.clone(); kg.computeBoundingBox(); const c=new THREE.Vector3(); kg.boundingBox.getCenter(c); c.y+=(kg.boundingBox.max.y-kg.boundingBox.min.y)*.08
  const P=kg.attributes.position, N=kg.attributes.normal, v=new THREE.Vector3(); for(let i=0;i<P.count;i++){v.fromBufferAttribute(P,i).sub(c).normalize(); N.setXYZ(i,v.x,v.y*1.1+.15,v.z)} N.needsUpdate=true
  const lm=['a','b'].map(k=>{const t=ld('lib/galazki_'+k+'.png'); t.colorSpace=THREE.SRGBColorSpace; return bezOdwr(new THREE.MeshStandardMaterial({map:t,alphaTest:.45,side:THREE.DoubleSide,roughness:.85}))})
  ver.traverse(o=>{if(/^liscie_/.test(o.name)) o.visible=false; if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})
  const wz={}; const zrob=(m,h,k)=>{const bb=new THREE.Box3().setFromObject(m); const c=new THREE.Vector3(); bb.getCenter(c); const gr=new THREE.Group(); const mm=m.clone(); mm.position.set(-c.x,-bb.min.y,-c.z); gr.add(mm); const s=h/(bb.max.y-bb.min.y); wz[k]={m:gr,s,y:0}}   // pień w punkcie (drzewo_verdant ma siatkę w (9.9, −73.2)!)
  for(const v_ of [0,1]){const t=ver.clone(true); const l0=t.getObjectByName('liscie_0'); const ko=new THREE.Mesh(kg,lm[v_]); ko.castShadow=true; ko.receiveShadow=true
    if(l0.isMesh){l0.geometry=kg; l0.material=lm[v_]; l0.visible=true} else {l0.clear(); l0.add(ko); l0.visible=true}

  zrob(wz.lisc0,13,'duze'); zrob(wz.lisc1,13,'duze_b'); zrob(wz.lisc0,9,'srednie'); zrob(wz.lisc1,9,'srednie_b')

    const m=(await GL.loadAsync('lib/'+f)).scene; m.traverse(o=>{if(/liscie_[12]/.test(o.name))o.visible=false; if(o.isMesh){o.castShadow=true;o.receiveShadow=true; if(o.material&&/liscie/.test(o.name+(o.parent?o.parent.name:''))){o.material.alphaTest=.5; bezOdwr(o.material)}}}); zrob(m,h,k)}
  let i=0; for(const [x,z,t] of PT.drzewa){const w=wz[(t==='duze'||t==='srednie')&&(i%2)?t+'_b':t]||wz.duze; const cl=w.m.clone(); cl.scale.setScalar(w.s*(.85+.3*((i*0.618)%1))); cl.position.set(x,w.y+.08,-z); cl.rotation.y=i*2.4; sc.add(cl); i++}
}
const big=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),M.trawa_podglad); big.rotation.x=-Math.PI/2; big.position.y=-.05; big.receiveShadow=true; sc.add(big)

await Promise.all(CZEKAJ); await new Promise(res=>setTimeout(res,800)); comp.render(); window.R=r; window.INFO={lost:r.getContext().isContextLost(), err:r.getContext().getError(), calls:r.info.render.calls, tris:r.info.render.triangles, prog:r.info.programs.length, geo:r.info.memory.geometries, tex:r.info.memory.textures}; window.GOTOWE=true
