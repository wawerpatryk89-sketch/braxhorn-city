<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
// MIASTO R1 — podgląd bloku 32a (Bydgoszcz). Te same trójkąty co gra (GLB z generatora), tekstury Poly Haven 2K,
// okna: pokój za szybą (ten sam algorytm co shader gry), niebo kloofendal, słońce + cienie, AO ekranowe.
import * as THREE from 'three'
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js'
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js'
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js'
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js'
const Q=new URLSearchParams(location.search), W=+(Q.get('w')||1600), H=+(Q.get('h')||738)
const num=k=>Q.get(k).split(',').map(Number)
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setPixelRatio(1); r.setSize(W,H)
r.outputColorSpace=THREE.SRGBColorSpace; r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=+(Q.get('ekspo')||1.12)
r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement)
const sc=new THREE.Scene(); const TL=new THREE.TextureLoader(); const CZEKAJ=[]
const ld=u=>{const t=TL.load(u); CZEKAJ.push(new Promise(res=>{const i=setInterval(()=>{if(t.image&&t.image.complete!==false&&t.image.width){clearInterval(i);res()}},50)})); return t}
const sky=await TL.loadAsync('niebo.jpg'); sky.mapping=THREE.EquirectangularReflectionMapping; sky.colorSpace=THREE.SRGBColorSpace
sc.background=sky; sc.environment=sky; sc.environmentIntensity=+(Q.get('niebo')||1.35); sc.backgroundIntensity=1.0
// słońce: azymut/wysokość (stopnie, azymut od północy na wschód, w układzie mapy; w podglądzie północ = -z)
const az=+(Q.get('az')||215)*Math.PI/180, el=+(Q.get('el')||22)*Math.PI/180
const sun=new THREE.DirectionalLight(0xfff1e0,+(Q.get('slonce')||2.6)); const dir=new THREE.Vector3(Math.sin(az)*Math.cos(el),Math.sin(el),-Math.cos(az)*Math.cos(el))
sun.position.copy(dir.clone().multiplyScalar(80)).add(new THREE.Vector3(9,0,-20)); sun.target.position.set(9,0,-20); sc.add(sun,sun.target)
sun.castShadow=true; sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:220}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.02
const lin=c=>c.map(v=>Math.pow(v/255,2.2))
function tex(slug,rep,kind){const t=ld('tex/'+slug+'_'+kind+'.jpg'); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1/rep,1/rep); t.anisotropy=8; if(kind==='diff')t.colorSpace=THREE.SRGBColorSpace; return t}
const AVG={white_stucco_02:[.683,.679,.666],brushed_concrete_04:[.409,.368,.327],concrete_pavers:[.409,.372,.328],clean_asphalt:[.27,.274,.276]}
function pbr(slug,rep,target,rough=1,ext={}){
  const a=AVG[slug].map(v=>Math.pow(v,2.2)), t=lin(target)
  const m=new THREE.MeshStandardMaterial({map:tex(slug,rep,'diff'),normalMap:tex(slug,rep,'nor'),roughnessMap:tex(slug,rep,'rough'),roughness:rough,metalness:0})
  m.color.setRGB(t[0]/a[0],t[1]/a[1],t[2]/a[2],THREE.LinearSRGBColorSpace); m.normalScale.set(1,1)
  if(ext.brud||ext.naklejka){
    const br=ext.brud?ld('out/'+ext.brud):null, nk=ext.naklejka?ld('out/'+ext.naklejka):null
    if(nk) nk.colorSpace=THREE.SRGBColorSpace
    m.customProgramCacheKey=()=>'brud'+(br?1:0)+'nak'+(nk?1:0)
    m.onBeforeCompile=s=>{
      s.uniforms.tBrud={value:br}; s.uniforms.tNak={value:nk}; s.uniforms.silaBrud={value:ext.sila||1}
      s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nattribute vec2 uv1;\nvarying vec2 vU1;').replace('#include <uv_vertex>','#include <uv_vertex>\nvU1=uv1;')
      s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec2 vU1;\nuniform sampler2D tBrud; uniform sampler2D tNak; uniform float silaBrud;')
       .replace('#include <map_fragment>','#include <map_fragment>\n'+(br?'diffuseColor.rgb*=mix(1.0,texture2D(tBrud,vU1).r,silaBrud);\n':'')+(nk?'{vec4 nkc=texture2D(tNak,vU1); diffuseColor.rgb=mix(diffuseColor.rgb,nkc.rgb*nkc.rgb,nkc.a);}\n':''))
    }
  }
  return m}
const flat=(c,rough,metal=0)=>{const m=new THREE.MeshStandardMaterial({roughness:rough,metalness:metal}); const t=lin(c); m.color.setRGB(t[0],t[1],t[2],THREE.LinearSRGBColorSpace); return m}
// okno: pokój za szybą (algorytm Braxhorn/UliceOkno w układzie stycznej: x wzdłuż elewacji, y góra, z w głąb)
const pok=await TL.loadAsync('tex/detail/pokoje.png'); pok.colorSpace=THREE.SRGBColorSpace; pok.minFilter=THREE.LinearMipmapLinearFilter
function okno(cellW,mebli){return new THREE.ShaderMaterial({uniforms:{tPok:{value:pok},tNieb:{value:sky},cellW:{value:cellW},cellH:{value:2.7},glab:{value:3.6},jasn:{value:.42},meble:{value:mebli}},
 vertexShader:`attribute vec4 tangent; attribute vec2 uv1; varying vec2 vU; varying vec3 vV; varying vec3 vR;
  void main(){ vec3 N=normalize(mat3(modelMatrix)*normal), T=normalize(mat3(modelMatrix)*tangent.xyz), B=cross(N,T)*tangent.w;
   vec4 wp=modelMatrix*vec4(position,1.); vec3 V=cameraPosition-wp.xyz; vV=vec3(dot(V,T),dot(V,B),dot(V,N)); vU=uv1; vR=reflect(-normalize(V),N);
   gl_Position=projectionMatrix*viewMatrix*wp; }`,
 fragmentShader:`uniform sampler2D tPok,tNieb; uniform float cellW,cellH,glab,jasn,meble; varying vec2 vU; varying vec3 vV; varying vec3 vR;
  float Hs(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453);}
  void main(){ vec3 Vt=normalize(vV); vec2 c=floor(vU); vec3 p=vec3(fract(vU),0.);
   vec3 rd=vec3(-Vt.x/cellW,-Vt.y/cellH,max(Vt.z/glab,1e-3));
   float tx=rd.x>0.?(1.-p.x)/rd.x:-p.x/min(rd.x,-1e-5), ty=rd.y>0.?(1.-p.y)/rd.y:-p.y/min(rd.y,-1e-5), tz=1./rd.z, t=min(min(tx,ty),tz);
   vec3 h=clamp(p+rd*t,0.,1.); float id=Hs(vec3(c,7.));
   vec3 wallC=mix(vec3(.87,.84,.79),vec3(.80,.84,.87),fract(id*7.31)); wallC=mix(wallC,vec3(.89,.83,.74),step(.72,fract(id*13.7)));
   vec3 col;
   if(t==tz){ float k=floor(id*4.999); vec2 tile=vec2(mod(k,4.),floor(k/4.)); vec2 uv=vec2((tile.x+h.x)*.25,(1.-tile.y-1.+h.y)*.5+.5);
     vec4 a=texture2D(tPok,vec2(uv.x,uv.y)); col=mix(wallC,a.rgb*a.rgb*1.0,a.a*meble)*.93; }
   else if(t==tx) col=wallC*.8;
   else if(rd.y<0.){ float row=floor(h.z*3.), pk=h.x*6.+row*.37; vec3 wood=mix(vec3(.52,.38,.26),vec3(.64,.49,.33),Hs(vec3(floor(pk),row,c.x+c.y*17.))); col=wood*(fract(pk)<.04?.72:1.); }
   else { col=vec3(.93,.93,.92); col=mix(col,vec3(.74,.73,.71),step(length(vec2(h.x-.5,(h.z-.5)*1.2)),.07)); }
   col*=mix(1.,.55,h.z); col=col*col;
   float cur=step(id,.55)*mix(.08,.22,fract(id*3.7)); vec3 fab=mix(vec3(.93,.91,.86),vec3(.72,.68,.62),fract(id*5.1))*(.9+.1*sin(p.x*140.)); fab=fab*fab;
   col=mix(col,fab,clamp(step(p.x,cur)+step(1.-cur,p.x),0.,1.));
   float fir=step(fract(id*41.7),.68); float fal=.86+.14*sin(p.x*cellW*38.+id*9.);
   col=mix(col,vec3(.80,.79,.76)*fal,fir*.62);
   float bl=step(fract(id*17.3),.3)*.35; float sl=.85+.15*step(.5,fract(p.y*40.)); col=mix(col,vec3(.72,.72,.68)*sl,step(1.-bl,p.y)*step(.001,bl));
   vec3 R=normalize(vR); vec2 eu=vec2(atan(R.z,R.x)/(2.*3.14159265)+.5, asin(clamp(R.y,-1.,1.))/3.14159265+.5);
   vec3 env=texture2D(tNieb,eu).rgb; env=env*env;
   float F=.04+.96*pow(1.-clamp(Vt.z,0.,1.),5.);
   vec3 o=col*jasn*(1.-F)+env*F*1.1; gl_FragColor=vec4(o,1.);
   #include <tonemapping_fragment>
   #include <colorspace_fragment>
  }`})}
const M={
 tynk:pbr('white_stucco_02',2,[208,168,104],1,{brud:'brud_32a_wejscie.png',sila:1}),
 tynk_brudny:pbr('white_stucco_02',2,[200,182,136],1,{brud:'brud_32a_slepa.png',sila:1}),
 tynk_zolty:pbr('white_stucco_02',2,[214,184,104]),
 graffiti_32a:pbr('white_stucco_02',2,[214,184,104],1,{naklejka:'graffiti_32a.png'}),
 napis_32a:pbr('white_stucco_02',2,[200,182,136],1,{naklejka:'napis_32a.png'}),
 opaska:pbr('white_stucco_02',2,[198,194,184]),
 cokol:pbr('brushed_concrete_04',1.5,[118,123,130]),
 plycina:flat([158,160,158],.55), listwa_braz:flat([92,62,46],.6),
 pcv:flat([236,236,232],.35), parapet:flat([150,152,154],.4,.5), obrobka:flat([140,142,144],.45,.5),
 drzwi_czerwone:flat([168,28,30],.45), szyba_drzwi:flat([40,46,50],.08,.2), szyba_piwnica:flat([30,32,34],.2),
 beton_daszek:pbr('brushed_concrete_04',1.5,[170,168,160]), beton_schody:pbr('brushed_concrete_04',1.5,[150,148,142]),
 stal:flat([60,62,64],.45,.7), kratka:flat([25,25,25],.8), skrzynka_gaz:flat([212,172,40],.5), rura_gaz:flat([212,172,40],.5),
 papa:flat([60,60,62],.9), lampa:flat([240,240,236],.4), tabliczka_32a:flat([235,235,235],.4), domofon:flat([120,122,124],.4,.4),
 zwir:flat([128,124,118],.95), kostka:pbr('concrete_pavers',1.0,[150,146,140]), kraweznik:pbr('brushed_concrete_04',1.5,[160,158,152]),
 asfalt:pbr('clean_asphalt',4,[92,92,94]), trawa_podglad:flat([88,112,62],.95),
 beton_balkon:pbr('brushed_concrete_04',1.5,[168,164,154]), stal_balustrada:flat([62,64,66],.45,.6),
 balustrada_prety:(()=>{const t=ld('out/balustrada_prety.png'); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.colorSpace=THREE.SRGBColorSpace; return new THREE.MeshStandardMaterial({map:t,alphaTest:.5,roughness:.45,metalness:.6,side:THREE.FrontSide})})(),
 balustrada_blacha_zielona:flat([52,128,74],.5,.2), balustrada_blacha_ciemna:flat([38,38,40],.5,.2),
 balustrada_blacha_biala:flat([222,220,212],.5,.1), balustrada_blacha_braz:flat([118,62,46],.5,.2),
 okno:okno(2.6,1.), okno_klatka:okno(1.8,0.)}
const g=await new GLTFLoader().loadAsync('out/'+(Q.get('plik')||'blok_32a.glb'))
g.scene.traverse(o=>{ if(!o.isMesh) return; const mat=o.name.split('|')[1]||(o.parent&&o.parent.name.split('|')[1]); const m=M[mat]
  if(!m) console.log('BRAK',o.name); o.material=m||flat([255,0,255],.5); o.castShadow=!/okno|teren/.test(mat||''); o.receiveShadow=true })
sc.add(g.scene)
const big=new THREE.Mesh(new THREE.PlaneGeometry(400,400),M.trawa_podglad); big.rotation.x=-Math.PI/2; big.position.y=-.05; big.receiveShadow=true; sc.add(big)
const cam=new THREE.PerspectiveCamera(+(Q.get('fov')||56.9),W/H,.1,900); cam.position.set(...num('oko')); cam.lookAt(...num('cel'))
const comp=new EffectComposer(r); comp.addPass(new RenderPass(sc,cam))
if(Q.get('ao')!=='0'){const ao=new GTAOPass(sc,cam,W,H); ao.updateGtaoMaterial({radius:.8,distanceExponent:1,thickness:1,scale:1}); comp.addPass(ao)}
comp.addPass(new OutputPass())
await Promise.all(CZEKAJ); await new Promise(res=>setTimeout(res,800)); comp.render(); window.GOTOWE=true
</script></body></html>
