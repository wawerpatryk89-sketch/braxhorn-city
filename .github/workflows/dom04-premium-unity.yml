name: BRAXHORN DOM04 isolated Unity6 real screenshot and MP4
on:
  push:
    branches: [codex/dom04-premium-fix-20261030]
    paths:
      - 'unity-city/**'
      - 'unity-tools/city/dom04-*'
      - '.github/workflows/dom04-premium-unity.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: dom04-isolated-final-proof-${{ github.sha }}
  cancel-in-progress: false
jobs:
  dom04:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && github.ref == 'refs/heads/codex/dom04-premium-fix-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            unity-city
            unity-tools
            public/assets/chars
            public/assets/tex
            public/assets/logo
            asset-library/sources/sofa_02
          persist-credentials: false
          lfs: false
      - name: Retrieve verified original gym export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 40787817505
          github-token: ${{ github.token }}
          name: braxhorn-city-original-gym-a4a395c93a3ee20eae36ab5e4aee52e1220f2d3c
          path: unity-city/Assets/Source/
      - name: Retrieve original City and Estate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 40840263799
          github-token: ${{ github.token }}
          name: unity-full-city-geometry-148cb8d9d3f1fbddaf25f7b4672ac4555e16bc71
          path: unity-city/Assets/Source/City/
      - name: Prepare exact Library-matching and other original CC0 source materials
        run: |
          mkdir -p city-review
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python3 -m compileall -q unity-tools
          python3 unity-tools/prepare_playable.py
          python3 unity-tools/premium_prepare.py
          python3 unity-tools/premium_refinements.py
          python3 unity-tools/city/prepare_segment.py
          python3 unity-tools/city/prepare.py
          python3 unity-tools/city/import_approved_roofs.py
          python3 unity-tools/city/dom04-prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --background --disable-autoexec asset-library/sources/sofa_02/sofa_02_4k.blend --python unity-tools/export_library_sofa.py
          python3 unity-tools/city/dom04-real-flower-sources.py
          blender --background --disable-autoexec dom04-flower-originals/planter_box_01/planter_box_01_4k.blend --python unity-tools/city/dom04-export-original-plant.py -- planter_box_01
          blender --background --disable-autoexec dom04-flower-originals/periwinkle_plant/periwinkle_plant_2k.blend --python unity-tools/city/dom04-export-original-plant.py -- periwinkle_plant
          blender --background --disable-autoexec unity-city/Assets/Source/City/Dom04/periwinkle_plant_2k.blend --python unity-tools/city/dom04-export-periwinkle.py
          git diff --exit-code -- unity-city/Assets/*.cs unity-city/Assets/*.shader unity-city/Assets/Editor unity-city/Assets/City unity-tools
      - name: Compile original estate and DOM04 upgrade with Unity 6
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: WebGL
          buildMethod: BraxGymBuild.BuildCity
          versioning: None
          allowDirtyBuild: true
      - name: Check generated exact DOM04 scope and materials
        run: |
          python3 - <<'PY'
          import pathlib,json
          matches=list(pathlib.Path('.').glob('**/city-review/dom04-premium-scope.json'))
          assert len(matches)==1,matches
          data=json.loads(matches[0].read_text())
          assert data['scope']=='DOM04_ONLY' and data['originalBraxOrControlsChanged'] is False
          assert data['lawnReplacedSourceRenderer']=='EstateMesh_273'
          assert data['replacedOriginalLawnAreaSquareMetres']==483 and data['originalLawnTopTrianglesReplaced']==2
          assert data['oldGrassOverlayRetained'] is False and data['totalDom04Trees']==4
          assert data['originalWindowFrameMeshUnchanged'] is True and data['originalInteriorMeshesUnchanged'] is True
          assert data['floweringRealPlants']==4 and data['ceramicPlanters']==4
          assert 'EstateMesh_315' in data['windows']
          assert data['productionPublished'] is False and data['visualQAConfirmed'] is False
          source=json.loads(pathlib.Path('city-review/dom04-library-source-evidence.json').read_text())
          assert source['sourceVerified'] and sum(x['libraryByteIdentity'] for x in source['sources'])==8
          assert source['plantSourceVerified'] is True and len(source['plantSourceFilesVerified'])==3
          flowers=json.loads(pathlib.Path('city-review/dom04-periwinkle-export.json').read_text())
          assert flowers['geometryIsOriginal'] and flowers['outputTriangles']<=20000
          PY
      - name: Package isolated Unity player for browser QA
        run: python3 unity-tools/city/package_estate.py
      - name: Prepare Chromium WebGL and ffmpeg
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record four TRUE Unity6 frames and continuous video
        run: node unity-tools/city/dom04-record.mjs
      - name: Upload actual DOM04 evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dom04-unity6-real-evidence-${{ github.sha }}
          path: |
            dom04-evidence/
            city-review/dom04-library-source-evidence.json
            city-review/dom04-periwinkle-export.json
            unity-city/city-review/dom04-premium-scope.json
          retention-days: 30
      - name: Upload compiled unity-only test player, NEVER publish
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dom04-unity6-test-build-${{ github.sha }}
          path: unity-preview/
          if-no-files-found: warn
          retention-days: 14
