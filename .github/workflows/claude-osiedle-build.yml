name: Claude R2 osiedle - park + osiedle B (Unity6 WebGL, zdjecia w CI)
on:
  push:
    branches: [claude/osiedle-20261031]
    paths: ['unity-city/**','unity-tools/**','.github/workflows/claude-osiedle-build.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: claude-osiedle-${{ github.sha }}
  cancel-in-progress: true
jobs:
  estate:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            unity-city
            unity-tools
            public/assets/chars
            public/assets/tex
            public/assets/logo
            asset-library/sources/sofa_02
          persist-credentials: false
          lfs: false
      - name: Oryginalna silownia i geometria miasta+osiedla (trwala kopia w wydaniu claude-base-backup-20261030)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download claude-base-backup-20261030 --repo "$GITHUB_REPOSITORY" --pattern original-gym.zip --pattern full-city-geometry.zip --pattern SHA256SUMS.txt --dir /tmp/kopia
          (cd /tmp/kopia && sha256sum --check --ignore-missing SHA256SUMS.txt)
          mkdir -p unity-city/Assets/Source/City
          unzip -o -q /tmp/kopia/original-gym.zip -d unity-city/Assets/Source/
          unzip -o -q /tmp/kopia/full-city-geometry.zip -d unity-city/Assets/Source/City/
          ls -la unity-city/Assets/Source/ unity-city/Assets/Source/City/ | head -30
      - name: Przygotowanie zrodel (jak w buildzie Codexa R2)
        run: |
          mkdir -p city-review
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python3 -m compileall -q unity-tools
          python3 unity-tools/prepare_playable.py
          python3 unity-tools/premium_prepare.py
          python3 unity-tools/premium_refinements.py
          python3 unity-tools/city/prepare_segment.py
          python3 unity-tools/city/prepare.py
          python3 unity-tools/city/import_approved_roofs.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --background --disable-autoexec asset-library/sources/sofa_02/sofa_02_4k.blend --python unity-tools/export_library_sofa.py
          git diff --exit-code -- unity-city/Assets/*.cs unity-city/Assets/*.shader unity-city/Assets/Editor unity-city/Assets/City unity-tools
      - name: Materialy i modele CC0 do osiedla (Poly Haven + ambientCG)
        run: python3 unity-tools/claude/fetch_osiedle.py
      - name: Kompilacja Unity 6 (osiedle jako pierwsza scena)
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: WebGL
          buildMethod: BraxGymBuild.BuildCity
          versioning: None
          allowDirtyBuild: true
      - name: Raport rozbudowy
        if: always()
        run: |
          for f in unity-city/city-review/osiedle-claude.json city-review/osiedle-claude.json unity-city/city-review/osiedle-rozmiary.json city-review/osiedle-rozmiary.json; do [ -f "$f" ] && cat "$f"; done || true
          du -sb build/WebGL 2>/dev/null || true
      - name: Pakowanie playera
        run: python3 unity-tools/city/package_estate.py
      - name: Player do szkicu wydania (zdjęcia robią 3 osobne maszyny równolegle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL=claude-osiedle-preview
          S=${GITHUB_SHA::7}
          mkdir -p osiedle-shots && date > osiedle-shots/build.txt
          for f in unity-city/city-review/osiedle-claude.json city-review/osiedle-claude.json unity-city/city-review/osiedle-rozmiary.json city-review/osiedle-rozmiary.json; do [ -f "$f" ] && cp "$f" osiedle-shots/; done || true
          du -sb unity-preview > osiedle-shots/rozmiar-playera.txt 2>/dev/null || true
          (cd osiedle-shots && zip -q -r ../osiedle-report-$S.zip .)
          (cd unity-preview && zip -q -r -1 ../osiedle-player-$S.zip .)
          ls -la osiedle-*.zip
          gh release view "$REL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$REL" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "Podglad osiedla R2 (Claude, TEST)" --notes "Player Unity 6 osiedla (park + osiedle B) i zdjecia z CI. Nie produkcja."
          gh release upload "$REL" --repo "$GITHUB_REPOSITORY" --clobber osiedle-player-$S.zip osiedle-report-$S.zip
  shots:
    needs: estate
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            unity-tools/claude
          persist-credentials: false
          lfs: false
      - name: Player z wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=${GITHUB_SHA::7}
          gh release download claude-osiedle-preview --repo "$GITHUB_REPOSITORY" --pattern "osiedle-player-$S.zip" --dir /tmp/p
          mkdir -p unity-preview && unzip -q /tmp/p/osiedle-player-$S.zip -d unity-preview && ls unity-preview | head
      - name: Przegladarka do zdjec
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Zdjecia z prawdziwego playera (czesc ${{ matrix.part }} z 3)
        continue-on-error: true
        timeout-minutes: 80
        env:
          SHOT_PART: ${{ matrix.part }}
          SHOT_PARTS: 3
        run: node unity-tools/claude/osiedle_shots.mjs
      - name: Zdjecia do szkicu wydania
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=${GITHUB_SHA::7}
          mkdir -p osiedle-shots && date > osiedle-shots/part-${{ matrix.part }}.txt
          (cd osiedle-shots && zip -q -r ../osiedle-shots-$S-part${{ matrix.part }}.zip .)
          gh release upload claude-osiedle-preview --repo "$GITHUB_REPOSITORY" --clobber osiedle-shots-$S-part${{ matrix.part }}.zip
