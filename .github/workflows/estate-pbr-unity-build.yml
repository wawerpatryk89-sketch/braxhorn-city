name: BRAXHORN R2 premium 1K PBR — original Brax + real roof and facade materials
on:
  push:
    branches: [codex/estate-premium-pbr-20261030]
    paths: ['.github/workflows/estate-pbr-unity-build.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: braxhorn-r2-pbr-single-build
  cancel-in-progress: false
jobs:
  estate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: |
            unity-city
            unity-tools
            public/assets/chars
            public/assets/tex
            public/assets/logo
            asset-library/sources/sofa_02
          persist-credentials: false
          lfs: false
      - name: Restore verified original game sources, never substitute Brax
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 40787817505
          github-token: ${{ github.token }}
          name: braxhorn-city-original-gym-a4a395c93a3ee20eae36ab5e4aee52e1220f2d3c
          path: unity-city/Assets/Source/
      - name: Restore original estate geometry and material inventory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 40840263799
          github-token: ${{ github.token }}
          name: unity-full-city-geometry-148cb8d9d3f1fbddaf25f7b4672ac4555e16bc71
          path: unity-city/Assets/Source/City/
      - name: Restore 18 certified official Poly Haven PBR images + packed gloss
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 41047049159
          github-token: ${{ github.token }}
          name: estate-certified-cc0-pbr-c530c4d55c3eaec8e17de4ec768a2babae056807
          path: unity-city/Assets/Source/EstateRenovation/
      - name: Verify exact material source provenance and avoid fake substitute maps
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('unity-city/Assets/Source/EstateRenovation')
          files=list(root.rglob('estate-pbr-provenance.json'))
          assert len(files)==1,files
          d=json.loads(files[0].read_text())
          assert d['source']=='Poly Haven official public API'
          assert len(d['assets'])==6
          for a in d['assets']:
            assert len(a['maps'])==3 and a['packedMetallicGloss']
            for v in a['maps']:
              f=root/(a['asset']+'_'+v['channel']+'_1k.png')
              assert hashlib.sha256(f.read_bytes()).hexdigest()==v['outputSha256'],f
            f=root/(a['asset']+'_metallic_gloss_1k.png')
            assert hashlib.sha256(f.read_bytes()).hexdigest()==a['packedMetallicGloss']['sha256'],f
          assert pathlib.Path('unity-city/Assets/Source/City/estate-manifest.json').is_file()
          print('18/18 SOURCE MAPS and 6/6 packed gloss verified; CC0; original Brax unmodified')
          PY
      - name: Prepare authentic city Brax and estate source; no public updates
        run: |
          mkdir -p city-review
          python3 -m pip install --quiet Pillow==11.3.0 numpy==2.2.6
          python3 -m compileall -q unity-tools
          node --check unity-tools/city/check_estate_original_player.mjs
          python3 unity-tools/prepare_playable.py
          python3 unity-tools/premium_prepare.py
          python3 unity-tools/premium_refinements.py
          python3 unity-tools/city/prepare.py
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --background --disable-autoexec asset-library/sources/sofa_02/sofa_02_4k.blend --python unity-tools/export_library_sofa.py
          git diff --exit-code -- unity-city/Assets/*.cs unity-city/Assets/*.shader unity-city/Assets/Editor unity-city/Assets/City unity-tools
      - name: Compile ONLY R2 in Unity 6 with original BraxGymPlayer
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: WebGL
          buildMethod: BraxGymBuild.BuildCity
          versioning: None
          allowDirtyBuild: true
      - name: Require PBR material slots truly applied to estate source scene
        run: |
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('unity-city/Assets/PlayableGenerated/City/estate-pbr-material-report.json')
          assert p.is_file(),'Material map was not applied in Unity'
          j=json.loads(p.read_text())
          assert j['scope']=='R2 ESTATE ONLY'
          assert not j['productionChanged'] and not j['originalMeshesChanged']
          assert j['rendererSlotsUpdated']>=4
          ids={x['assetId'] for x in j['entries']}
          assert len(ids)>=3,ids
          print('UNITY R2 PBR ASSIGNMENT PASS',j['rendererSlotsUpdated'],'render slots',ids)
          PY
      - name: Package isolated original city player entry with PBR material QA
        run: |
          python3 unity-tools/city/package_estate.py
          cp unity-city/Assets/PlayableGenerated/City/estate-pbr-material-report.json unity-preview/
          cp unity-city/Assets/Source/EstateRenovation/estate-pbr-provenance.json unity-preview/
      - name: Check native mobile size rather than claiming no memory cost
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=list(Path('unity-preview/Build').glob('*.data.unityweb'))
          assert len(files)==1,files
          mb=files[0].stat().st_size/1048576
          print('Unity R2 Premium PBR compressed size MiB',round(mb,2))
          assert mb<286,'Unexpected full city included in isolated R2'
          PY
      - name: Install real Chromium WebGL QA
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check same Brax rig, controls, locations and doors in actual rendered R2
        run: node unity-tools/city/check_estate_original_player.mjs
      - name: Preserve genuine screenshots, source receipts and compiled R2 for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braxhorn-r2-pbr-review-${{ github.sha }}
          path: |
            city-review/
            unity-preview/estate-pbr-material-report.json
            unity-preview/estate-pbr-provenance.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve Unity binary strictly as TEST artifact, no production release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braxhorn-r2-pbr-unity-test-${{ github.sha }}
          path: unity-preview/
          if-no-files-found: warn
          retention-days: 14
