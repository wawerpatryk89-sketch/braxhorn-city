name: BRAXHORN R1 - UNITY 6 scene-only acceptance (NO APK)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
env:
  PAMIEC_REJONOW: osiedle
concurrency:
  group: r1-scene-only-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-imports:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && (github.ref == 'refs/heads/claude/region-20261030' || github.ref == 'refs/heads/claude/miasto-opus-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        sparse-checkout: unity-tools/city
        persist-credentials: false
    - name: Verified original import fetch from private GitHub draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 unity-tools/city/fetch_original_imports.py
    - name: Make originals available to read-only compilation job
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: unity6-original-imports-${{ github.sha }}
        path: unity-city/Assets/Source/
        retention-days: 3
        if-no-files-found: error
  cc0-assets:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && (github.ref == 'refs/heads/claude/region-20261030' || github.ref == 'refs/heads/claude/miasto-opus-20261031')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        sparse-checkout: unity-tools/claude
        persist-credentials: false
    - name: Pamiec podreczna Poly Haven i ambientCG (pobrane raz, nie przy kazdym buildzie)
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: unity-city/Assets/Source/Claude/PolyHaven
        key: claude-cc0-${{ hashFiles('unity-tools/claude/fetch_polyhaven.py', 'unity-tools/claude/fetch_region.py') }}
        restore-keys: claude-cc0-
    - name: Pobierz materialy i modele CC0 (Poly Haven, ambientCG) - tylko brakujace
      run: |
        python3 -m pip install --disable-pip-version-check Pillow==11.3.0
        python3 unity-tools/claude/fetch_polyhaven.py
        python3 unity-tools/claude/fetch_region.py
        du -sh unity-city/Assets/Source/Claude/PolyHaven
    - name: Katalog CC0 dla obu buildow Unity
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: claude-cc0-${{ github.sha }}
        path: unity-city/Assets/Source/Claude/PolyHaven/
        retention-days: 3
        if-no-files-found: error
  scene-only-unity6:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && github.ref == 'refs/heads/claude/miasto-opus-20261031'
    needs:
      - source-imports
      - cc0-assets
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        sparse-checkout: 'unity-city

          unity-tools

          public/assets/chars

          public/assets/tex

          public/assets/logo

          public/assets/people

          public/assets/basis

          public/assets/cars-src

          public/unity-gym

          .github/scripts

          asset-library/sources/sofa_02


          asset-library/sources/audio

          '
        persist-credentials: false
        lfs: false
    - name: Verify project WebGL bridge providers before the expensive Unity build
      run: |
        python3 unity-tools/check_webgl_bridges.py
        python3 unity-tools/kickboxing/package.py --check-template
    - name: Receive durable SHA-verified original Unity imports
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: unity6-original-imports-${{ github.sha }}
        path: unity-city/Assets/Source/
    - name: Restore authored facades and PBR materials (audited source archive)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        repository: wawerpatryk89-sketch/braxhorn-city
        run-id: 40869502253
        github-token: ${{ github.token }}
        name: city-rebuild-curated-extended-3c98ccd919409da59d8145c0171b0776bc65b93d
        path: unity-city/Assets/
    - name: Recover exact reviewed packed bag derivative instead of changed vendor response
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        repository: wawerpatryk89-sketch/braxhorn-city
        run-id: 40897925601
        github-token: ${{ github.token }}
        name: unity-kickboxing-review-b2279bd24f7ce1660160c6fc3af119e9820a32f9
        path: reviewed-gym-source/
    - name: Prepare unchanged player and current source assets
      run: 'mkdir -p kickboxing-review

        python3 -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88

        python3 -m compileall -q unity-tools

        python3 unity-tools/nutrition/audit_assets.py

        node --check unity-tools/kickboxing/check.mjs

        python3 unity-tools/prepare_playable.py

        python3 unity-tools/premium_prepare.py

        python3 unity-tools/premium_refinements.py

        python3 unity-tools/city/prepare.py

        python3 unity-tools/kickboxing/fetch_assets.py


        python3 unity-tools/city/import_approved_roofs.py

        python3 unity-tools/city-rebuild/check_brand_sources.py


        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends ffmpeg

        python3 unity-tools/nova-audio/prepare.py

        '
      env:
        BRAXHORN_RESTORE_REVIEWED_BAG: '1'
    - name: Reproduce the reviewed CC0-derived bags with pinned Blender
      run: 'curl --fail --location --retry 3 --output /tmp/blender-4.2.3-linux-x64.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz

        echo ''3a64efd1982465395abab4259b4091d5c8c56054c7267e9633e4f702a71ea3f4  /tmp/blender-4.2.3-linux-x64.tar.xz'' | sha256sum
        --check --strict

        tar -xJf /tmp/blender-4.2.3-linux-x64.tar.xz -C /tmp

        /tmp/blender-4.2.3-linux-x64/blender --background --disable-autoexec asset-library/sources/sofa_02/sofa_02_4k.blend
        --python unity-tools/export_library_sofa.py

        /tmp/blender-4.2.3-linux-x64/blender --background --disable-autoexec reviewed-gym-source/kickboxing-review/bag-source/bag-refined-before-export.blend
        --python unity-tools/kickboxing/restore_reviewed_bag.py

        python3 unity-tools/kickboxing/externalize_models.py --remove-source

        git diff --exit-code -- unity-city/Assets/BraxGymPlayer.cs unity-city/Assets/City unity-city/Assets/Editor/BraxCityBuild.cs
        unity-city/Assets/Editor/BraxHeroRefinements.cs unity-tools/prepare_playable.py unity-tools/premium_refinements.py
        unity-tools/city/prepare.py

        '
    - name: Materialy i modele CC0 z joba cc0-assets (bez pobierania w buildzie)
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: claude-cc0-${{ github.sha }}
        path: unity-city/Assets/Source/Claude/PolyHaven/
    - name: Drzewo do gry z LOD zamiast skanow Poly Haven (budzet mobilny), paczka miasta bez gltf osiedla
      run: |
        for t in tree_small_02; do ls unity-city/Assets/Source/Claude/PolyHaven/models/$t | head -3; done
        ls -la unity-city/Assets/Source/Claude/Library/drzewo_verdant.glb
        ls -la unity-city/Assets/Source/City/ | grep -i estate || true; echo "miasto + osiedle R2 w jednej paczce (31.10, Opus)"
    - name: Materialy i modele osiedla R2 (Poly Haven + ambientCG + tekstury generowane)
      run: python3 unity-tools/claude/fetch_osiedle.py
    - name: Prywatna muzyka do willi z rozami (plik zaszyfrowany, klucz tylko w sekretach repozytorium)
      env:
        KLUCZ: ${{ secrets.WILLA_MUZYKA_KLUCZ }}
      run: |
        if [ -n "$KLUCZ" ] && [ -f unity-tools/claude/prywatne/willa_muzyka.ogg.enc ]; then
          openssl enc -d -aes-256-cbc -pbkdf2 -in unity-tools/claude/prywatne/willa_muzyka.ogg.enc -out unity-city/Assets/Claude/Audio/willa_muzyka.ogg -pass env:KLUCZ \
            && echo "muzyka willi z rozami: OK" || { rm -f unity-city/Assets/Claude/Audio/willa_muzyka.ogg; echo "muzyka willi: zly klucz - gra Industrial Pulse"; }
        else
          echo "muzyka willi: brak sekretu WILLA_MUZYKA_KLUCZ - gra Industrial Pulse"
        fi
    - name: Prywatne zasoby wlasciciela - Patryk i ruchy Mixamo (paczki zaszyfrowane, klucz tylko w sekretach; bez klucza gra Brax)
      env:
        KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
      run: python3 unity-tools/claude/prywatne.py
    - name: Ludzie - Microsoft Rocketbox (MIT, commit 0943055) - 24 postacie i animacje, tekstury 1024/512 z maska ubran
      run: |
        # sparse checkout po sciezkach (bez calego repo), TGA 2048 -> PNG (kolor 1024, normalne 512), w alfie ciala maska ubran
        python3 unity-tools/claude/fetch_rocketbox.py || echo "DO POPRAWKI: Rocketbox nie pobrany - przechodnie z build 13"
        du -sh unity-city/Assets/Source/Rocketbox || true
    - name: Odchudzanie modeli pod telefon (tekstury z .glb jako pliki do kompresji, uproszczenie ciezkich skanow) + ekran Autorzy
      run: |
        # ludzie i auta z wersji przeglądarkowej (meshopt + KTX2) → zwykłe .glb dla glTFast (bez pakietów meshopt/KTX)
        node unity-tools/claude/dekoduj_glb.mjs public/assets/people unity-city/Assets/Source/Claude/Ludzie || echo "DO POPRAWKI: dekodowanie ludzi"
        node unity-tools/claude/dekoduj_glb.mjs public/assets/cars-src unity-city/Assets/Source/Claude/Auta || echo "DO POPRAWKI: dekodowanie aut"
        python3 unity-tools/claude/autorzy.py
        python3 unity-tools/claude/odchudzanie_modeli.py
    - name: Rejon buildu i klucz pamieci rejonu (PO wszystkich krokach przygotowujacych zasoby, PRZED Unity)
      id: rejon
      env:
        WEJSCIE_REJON: miasto
        WEJSCIE_PAMIEC: ${{ github.event.inputs.pamiec }}
      run: |
        t=$(date +%s)
        python3 -I unity-tools/claude/rejon_buildu.py --platforma webgl --unity 6000.0.58f2
        cat unity-city/rejon-ci.txt
        echo "BRAXHORN_CZAS etap=klucz_rejonu s=$(( $(date +%s) - t ))"
        echo "T_PAMIEC=$(date +%s)" >> "$GITHUB_ENV"
    - name: Pamiec podreczna wygenerowanego rejonu (sceny i zasoby rejonu + .meta + ProjectSettings; klucz = kod generatora + zrodla + Unity + rejon)
      id: pamiec
      if: steps.rejon.outputs.pamiec == 'tak'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          unity-city/Assets/PlayableGenerated
          unity-city/Assets/**/*.meta
          unity-city/ProjectSettings
          unity-city/Assets/Source/Premium/unity-premium-report.json
          unity-city/Assets/Source/Premium/source-refinements.json
          unity-city/Assets/Source/Claude/Osiedle/sky/niebo_odbicia.jpg
        key: ${{ steps.rejon.outputs.klucz }}
    - name: Wynik pamieci rejonu (trafienie = bez generowania rejonu w Unity)
      if: steps.rejon.outputs.pamiec == 'tak'
      run: |
        echo "BRAXHORN_PAMIEC_CI rejon=${{ steps.rejon.outputs.rejon }} z_pamięci=${{ steps.pamiec.outputs.cache-hit == 'true' && 'tak' || 'nie' }} klucz=${{ steps.rejon.outputs.klucz }}"
        echo "BRAXHORN_CZAS etap=przywrocenie_pamieci s=$(( $(date +%s) - T_PAMIEC ))"
        du -sh unity-city/Assets/PlayableGenerated 2>/dev/null || echo 'swiat rejonu: brak w pamieci (pelne generowanie, zapis po udanym jobie)'
    - name: Tydzien (klucz pamieci Library - jeden wpis na tydzien zamiast nowego 6 GB przy kazdym commicie)
      id: tydzien
      run: echo "t=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"
    - name: Pamiec podreczna Library Unity (odczyt; zapis osobnym krokiem raz na tydzien - limit 10 GB na repo)
      id: biblioteka
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: unity-city/Library
        key: claude-library-webgl-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ steps.tydzien.outputs.t }}
        restore-keys: claude-library-webgl-${{ hashFiles('unity-city/Packages/manifest.json') }}-
    - name: Miejsce na dysku dla obrazu Unity i pliku wymiany (runner ma ~14 GB wolne)
      run: |
        df -h / | tail -1
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell || true
        sudo apt-get clean || true
        sudo docker image prune --all --force || true
        df -h / | tail -1
    - name: Plik wymiany 10 GB (edytor Unity + kompilacja IL2CPP na 16 GB RAM, exit 137)
      run: |
        df -h / | tail -1
        # /swapfile (2 GB) już istnieje na runnerze GitHuba („Text file busy”), więc osobny plik.
        sudo fallocate -l 12G /swapfile-unity && sudo chmod 600 /swapfile-unity && sudo mkswap /swapfile-unity && sudo swapon /swapfile-unity || echo 'brak miejsca na swap'
        free -g
    - name: REAL Unity 6 Editor test — generate ALL R1 scenes and receipt; NO app compilation
      uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        projectPath: unity-city
        unityVersion: 6000.0.58f2
        targetPlatform: WebGL
        buildMethod: BraxGymBuild.SceneOnlyCityR1
        versioning: None
        allowDirtyBuild: true
    - name: Check actual scene-only receipt and first Unity error
      if: always()
      shell: bash
      run: |
        echo 'BRAXHORN R1 — Unity 6 rzeczywisty test sceny BEZ APK'
        test -s unity-city/Assets/PlayableGenerated/R1SceneAcceptance/scene-only.txt || {
          echo 'DO POPRAWKI: brak markera rzeczywistego wygenerowania sceny'
        }
        cat unity-city/Assets/PlayableGenerated/R1SceneAcceptance/scene-only.txt 2>/dev/null || true
        cat unity-city/Assets/PlayableGenerated/R1SceneAcceptance/r1-transport-sklep.txt 2>/dev/null || true
        if [ -d unity-city/Assets/PlayableGenerated ]; then
          find unity-city/Assets/PlayableGenerated -maxdepth 2 -type f -name '*.unity' -print | sort | head -40
        fi
    - name: Archive Unity scene-only diagnostics (no APK, no WebGL player)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: r1-unity-scene-only-${{ github.sha }}
        path: |
          unity-city/Assets/PlayableGenerated/R1SceneAcceptance/
          unity-city/Assets/PlayableGenerated/ClaudeRegion/region.json
          unity-city/Assets/PlayableGenerated/ClaudeMetro/metro.json
          unity-city/Assets/PlayableGenerated/CityRebuild/
        retention-days: 7
        if-no-files-found: warn
