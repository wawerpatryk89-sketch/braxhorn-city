name: BRAXHORN R2 - Unity-only source and old Three vendor removal gates
on:
  push:
    branches: [codex/estate-premium-renovation-20261030]
    paths:
      - 'dev/three/**'
      - 'unity-city/**'
      - '.github/workflows/estate-premium-renovation-qa.yml'
permissions:
  contents: read
jobs:
  source-check:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && github.ref == 'refs/heads/codex/estate-premium-renovation-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Three.js vendor removed without deleting original content library
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          assert not Path('dev/three').exists(), 'Legacy vendored Three.js is still present'
          required=[
            'unity-city/Assets/BraxGymPlayer.cs',
            'unity-city/Assets/Editor/BraxGymBuild.cs',
            'unity-city/Assets/Editor/BraxCityBuild.cs',
            'unity-city/Assets/City/BraxCityWorld.cs',
            'unity-city/Assets/Editor/BraxEstateR2ApprovedRoofs.cs',
            'unity-city/Assets/Editor/BraxEstateR2FacadeFinish.cs',
            'unity-city/ProjectSettings/ProjectVersion.txt',
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f'Unity 6 sources missing: {missing}'
          assert '6000.0.58f2' in Path('unity-city/ProjectSettings/ProjectVersion.txt').read_text()
          assert Path('asset-library').is_dir(), 'Owned asset library missing'
          assert Path('dev/models').is_dir(), 'Original 3D models missing'
          assert Path('public/assets').is_dir(), 'Game assets missing'
          # Legacy browser bundles and export source remain read-only until
          # an independent full Unity City+Estate+Gym WebGL build has passed.
          legacy=['public/game.js','public/osiedle/game.js','dev/src/main.js']
          assert all(Path(p).is_file() for p in legacy),'Legacy rollback/reference not preserved'
          report={
            'scope':'codex/estate-premium-renovation-20261030',
            'vendoredThreeJsRemoved':True,
            'allOwnedAssetDirectoriesRetained':True,
            'legacyBrowserBundlesArchivedInPlaceUntilFullUnityRelease':True,
            'fullUnityReleaseApproved':False,
            'productionUpdated':False,
            'result':'SOURCE_GATE_PASS_ONLY__UNITY_RUNTIME_ACCEPTANCE_NOT_PROVEN'
          }
          Path('/tmp/r2-unity-only-source-gate.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Upload source removal evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-three-vendor-removal-check-${{ github.sha }}
          path: /tmp/r2-unity-only-source-gate.json
          retention-days: 14
