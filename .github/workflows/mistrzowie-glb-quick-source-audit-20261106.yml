name: Miasto Mistrzów — pojedynczy audyt GLB P1 i portu (BEZ APK)
run-name: Champions 3D original GLB quick source/UV checks — no Unity

on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/mistrzowie-glb-quick-source-audit-20261106.yml

permissions:
  # Draft private owner release asset requires the same scoped token permission
  # as the existing Mistrzowie APK workflow. No GitHub writes are executed.
  contents: write

concurrency:
  group: mistrzowie-glb-short-original-audit
  cancel-in-progress: false

jobs:
  all-glbs:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout original crane and read-only model scanner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-tools/mistrzowie/audit_owner_glb_geometry.py
            unity-tools/mistrzowie/isolate_unused_glb_champions.py
            unity-tools/mistrzowie/import_pool_p1_owner_assets.py
            unity-city/Assets/Editor/Mistrzowie
            unity-city/Assets/Mistrzowie
            unity-tools/mistrzowie/repair_pool_p1_towels.py
            unity-city/Assets/Source/HarborBeach/Models/harbor_crane.glb
      - name: Download the pinned ORIGINAL owner P1 equipment only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/715496694" \
            > "$RUNNER_TEMP/P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          test -s "$RUNNER_TEMP/P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          echo "Original owner ZIP fetched; no changes to visual assets"
      - name: One original GLB at a time — geometry, materials, UV channels
        run: |
          python3 unity-tools/mistrzowie/audit_owner_glb_geometry.py \
            --owner-zip "$RUNNER_TEMP/P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip" \
            --harbor-glb unity-city/Assets/Source/HarborBeach/Models/harbor_crane.glb
      - name: Classify unsafe UV channels individually without changing originals
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('mistrzowie-evidence/source-glb-audit.json')
          v=json.loads(p.read_text())
          for model in v['files']:
              if model['extraUVs']:
                  print('BRAX_MISTRZOWIE_UV_REVIEW',model['name'],
                        'perMaterial',model['perMaterialUVs'],
                        'sourceNotModified',True,flush=True)
          print('No visual asset substitutions or unsafe UV stripping performed')
          PY
      - name: Short runner-only proof — no referenced model is removed from game
        env:
          MISTRZOWIE_PIPELINE: "20261105-A1-T11"
        run: |
          python3 unity-tools/mistrzowie/import_pool_p1_owner_assets.py \
            "$RUNNER_TEMP/P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          python3 unity-tools/mistrzowie/isolate_unused_glb_champions.py
          python3 unity-tools/mistrzowie/isolate_unused_glb_champions.py --apply-runner-only
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          v=json.loads(Path("mistrzowie-evidence/isolated-unused-uv-glb.json").read_text())
          assert v["status"]=="UNUSED_UV_SOURCES_ISOLATED_IN_RUNNER"
          for m in v["models"]:
              assert not Path(m["workingPath"]).exists(),m
              backup=Path(m["preservedPath"])
              assert backup.is_file() and hashlib.sha256(backup.read_bytes()).hexdigest()==m["sha256"]
          print("CHAMPIONS_SAFE_UNUSED_GLB_IMPORT_SCOPE_TEST_PASS 2/2")
          PY
      - name: Preserve source integrity and compatibility report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-glb-structural-audit-${{ github.run_id }}
          path: |
            mistrzowie-evidence/source-glb-audit.json
            mistrzowie-evidence/isolated-unused-uv-glb.json
          if-no-files-found: warn
          retention-days: 14
      - name: Scope statement
        if: always()
        run: |
          echo 'Original owner P1 and harbor crane GLB files checked read-only, one model at a time. No Unity, no APK, no asset rewrite.' >> "$GITHUB_STEP_SUMMARY"
