name: Obóz — auto APK po zielonej scenie 42330616645

on:
  push:
    branches: [codex/oboz-przebudowa-pbr-20261105]
    paths: [.github/workflows/oboz-auto-apk-after-scene-20261107.yml]

permissions:
  actions: write
  contents: read

concurrency:
  group: oboz-auto-apk-after-scene-42330616645
  cancel-in-progress: false

jobs:
  wait-and-dispatch:
    name: Czekaj na PASS sceny i uruchom jeden APK
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      SCENE_RUN_ID: "42330616645"
      TESTED_SHA: "c6fba5234fae65d9bd21d9a79499778fd159084e"
      TARGET_BRANCH: "codex/oboz-przebudowa-pbr-20261105"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Nie buduj, jeśli od testowanego SHA zmieniły się pliki gry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TESTED_SHA^{commit}"
          mapfile -t changed < <(git diff --name-only "$TESTED_SHA"..HEAD)
          printf 'Zmiany po testowanym SHA:\n%s\n' "${changed[*]:-brak}"
          for f in "${changed[@]}"; do
            case "$f" in
              .github/workflows/*) ;;
              *)
                echo "::error::Po uruchomieniu testu zmienił się plik gry/źródła: $f. Nie uruchamiam APK z nieprzetestowanej rewizji."
                exit 1
                ;;
            esac
          done

      - name: Czekaj na zakończenie dokładnie runu sceny 42330616645
        id: wait_scene
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SCENE_RUN_ID")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            echo "SCENE_RUN=$SCENE_RUN_ID status=$status conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::Test sceny zakończył się $conclusion — APK NIE zostanie uruchomiony."
                exit 1
              fi
              echo "SCENE_PASS=1" >> "$GITHUB_OUTPUT"
              echo "scene_updated_at=$(jq -r '.updated_at' <<<"$payload")" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 60
          done

      - name: Blokada duplikatu pełnego runu po scenie
        id: duplicate
        shell: bash
        env:
          SCENE_UPDATED_AT: ${{ steps.wait_scene.outputs.scene_updated_at }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/oboz-unity-build.yml/runs?branch=$TARGET_BRANCH&event=workflow_dispatch&per_page=30")"
          count="$(jq --arg t "$SCENE_UPDATED_AT" --argjson scene "$SCENE_RUN_ID"             '[.workflow_runs[] | select(.id != $scene and .created_at >= $t and (.status=="queued" or .status=="in_progress"))] | length' <<<"$payload")"
          if [ "$count" -gt 0 ]; then
            echo "DUPLICATE_BLOCK=1 — istnieje już nowszy aktywny run tego workflow; nie uruchamiam drugiego."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Uruchom dokładnie jeden pełny APK Obozu
        if: steps.duplicate.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run oboz-unity-build.yml             --repo "$GITHUB_REPOSITORY"             --ref "$TARGET_BRANCH"             -f quality_review=false             -f first_install=false             -f content_action=none             -f expected_sha=
          echo "APK_DISPATCHED=1"
