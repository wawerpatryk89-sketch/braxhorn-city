name: Verify published Unity gym preview URL
on:
  push:
    branches: [codex/unity-gym-polish-controls-20261029]
    paths: ['.github/workflows/unity-gym-verify-published-20261029.yml']
permissions:
  contents: read
jobs:
  verify-preview:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city' && github.ref == 'refs/heads/codex/unity-gym-polish-controls-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify the published preview against the tested Unity build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, urllib.request, urllib.parse
          repo='wawerpatryk89-sketch/braxhorn-city'
          published='bc0fa518566625e7c5afaf951fffcba9c76482c7'
          source='942509273fc7e5f726413306a4f3fcf749351b1e'
          # Exact preview origin returned by vercel[bot] on PR 1, comment 6490410573.
          # Vercel posts commit statuses but creates no GitHub Deployments records.
          origin='https://braxhorn-city-git-codex-unity-gym-pol-148030-wawerpatryk89-1409.vercel.app'
          report={'scope':'isolated-unity-gym','publicationCommit':published,'sourceCommit':source,'productionModified':False,'testUrl':origin+'/unity-gym/','files':[],'verified':False}
          def github(path):
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'Braxhorn-Gym-Preview-Verification'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          def public(url):
              # Do not forward any GitHub credentials to the hosting platform.
              request=urllib.request.Request(url,headers={'User-Agent':'Braxhorn-Gym-Preview-Verification','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=90) as response:
                  final=urllib.parse.urlsplit(response.url)
                  first=urllib.parse.urlsplit(url)
                  if final.hostname!=first.hostname:raise ValueError('Deployment redirected to another host')
                  return response.read()
          try:
              report['mainBefore']=github('git/ref/heads/main')['object']['sha']
              item=github('contents/public/unity-gym/release.json?ref='+published)
              expected=json.loads(base64.b64decode(item['content']))
              assert expected['sourceCommit']==source and expected['target']=='preview'
              live=json.loads(public(origin+'/unity-gym/release.json'))
              assert live['scope']=='isolated-unity-gym' and live['target']=='preview'
              assert live['sourceCommit']==source and live['files']==expected['files']
              for name,digest in expected['files'].items():
                  path=pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
                  data=public(origin+'/unity-gym/'+urllib.parse.quote(name,safe='/'))
                  actual=hashlib.sha256(data).hexdigest()
                  assert actual==digest,'Different live file: '+name
                  report['files'].append({'path':name,'bytes':len(data),'sha256':actual})
              report['mainAfter']=github('git/ref/heads/main')['object']['sha']
              report['mainUnchangedDuringVerification']=report['mainBefore']==report['mainAfter']
              report['verified']=True
              print('VERIFIED_TEST_URL',report['testUrl'])
              print('VERIFIED_SOURCE_COMMIT',source)
              print('VERIFIED_PUBLISHED_FILES',len(report['files']))
              print('MAIN_UNCHANGED',report['mainUnchangedDuringVerification'])
          except Exception as error:
              report['error']=str(error)
              print('PREVIEW_VERIFICATION_ERROR',str(error))
              raise
          finally:
              pathlib.Path('published-preview-verification.json').write_text(json.dumps(report,indent=2)+'\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
                  out.write('## Unity gym preview verification\n\nSource: `'+source+'`\n\n')
                  out.write('Public live byte verification: '+str(report['verified'])+'\n\n')
                  out.write('Test link: '+report['testUrl']+'\n\nNo production writes performed.\n')
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unity-gym-published-preview-verification
          path: published-preview-verification.json
          if-no-files-found: error
          retention-days: 7
