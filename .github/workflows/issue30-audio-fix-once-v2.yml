name: Issue 30 — repair BRAXHORN engine audio once — NO UNITY NO APK

on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/issue30-audio-fix-once-v2.yml

permissions:
  contents: write

concurrency:
  group: issue30-audio-fix-once-v2
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout shared branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/miasto-mistrzow-kasyno-t11-20261105
          fetch-depth: 0

      - name: Guard Issue 30 car code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs)" = "9b082d3b40a04ff7b5fe8686184d241224741338"
          test "$(git hash-object unity-city/Assets/Mistrzowie/BraxChampionsCar.cs)" = "3d23bd562a7180577f9e8279f91af5fc0a6dd579"

      - name: Install audio encoder only
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download audited source and generate full OGG clips
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "BRAXHORN-CITY/Issue30 licensed audio" \
            "https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm" \
            -o /tmp/issue30-source.webm
          echo "15a9fcf82f53c710f489b7d888557b4937ae3f50d968c22f2be342d29df398b6  /tmp/issue30-source.webm" | sha256sum -c -
          python3 unity-tools/mistrzowie/finalize_issue30_audio.py /tmp/issue30-source.webm
          python3 unity-tools/mistrzowie/prepare_champion_car_audio.py
          python3 unity-tools/mistrzowie/test_issue30_car_audio.py -v
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of default=nw=1 \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of default=nw=1 \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg

      - name: Commit only Issue 30 audio outputs
        shell: bash
        env:
          BRANCH: gpt/miasto-mistrzow-kasyno-t11-20261105
        run: |
          set -euo pipefail
          git config user.name "wawerpatryk89-sketch"
          git config user.email "wawerpatryk89@gmail.com"
          git add \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/ATTRIBUTION.txt \
            unity-tools/mistrzowie/champion_car_audio_sources.json \
            unity-tools/mistrzowie/prepare_champion_car_audio.py \
            unity-tools/mistrzowie/test_issue30_car_audio.py
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).split())
          allowed={
            'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/ATTRIBUTION.txt',
            'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg',
            'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg',
            'unity-tools/mistrzowie/champion_car_audio_sources.json',
            'unity-tools/mistrzowie/prepare_champion_car_audio.py',
            'unity-tools/mistrzowie/test_issue30_car_audio.py',
          }
          if changed != allowed:
              raise SystemExit('ISSUE30_SCOPE_FAIL '+repr(sorted(changed)))
          print('ISSUE30_SCOPE_PASS',sorted(changed))
          PY
          git commit -m "Issue 30: replace truncated engine clips with verified full OGG audio"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"

# final-trigger-20261108-1529
