name: Issue 30 — FINALIZE licensed BRAXHORN engine audio — NO APK
run-name: Issue 30 finalize engine idle+rev, hashes and attribution — NO APK

on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/issue30-finalize-car-audio-once.yml

permissions:
  contents: write

concurrency:
  group: issue30-finalize-car-audio-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/miasto-mistrzow-kasyno-t11-20261105
          fetch-depth: 0

      - name: Guard car files against concurrent edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs)" = "07f732a9afa42b5fc6a8f3ecbd90dcc9f3237a63"
          test "$(git hash-object unity-city/Assets/Mistrzowie/BraxChampionsCar.cs)" = "aeebdc51ca2bab564e3d61d91587fda70e8f7ed6"

      - name: Install local audio encoder only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download verified CC BY 3.0 engine source and derive idle+rev
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/issue30
          SOURCE_URL="https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm"
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "BRAXHORN-CITY/Issue30 licensed audio preparation" \
            "$SOURCE_URL" -o /tmp/issue30/source.webm
          echo "15a9fcf82f53c710f489b7d888557b4937ae3f50d968c22f2be342d29df398b6  /tmp/issue30/source.webm" | sha256sum -c -
          ffmpeg -hide_banner -loglevel error -y -i /tmp/issue30/source.webm \
            -vn -ac 1 -ar 22050 -c:a pcm_s16le /tmp/issue30/source.wav
          python3 - <<'PY'
          import wave, math, struct
          from pathlib import Path
          root=Path('/tmp/issue30')
          with wave.open(str(root/'source.wav'),'rb') as w:
              assert w.getnchannels()==1 and w.getsampwidth()==2 and w.getframerate()==22050
              rate=w.getframerate(); raw=w.readframes(w.getnframes())
          vals=list(struct.unpack('<%dh'%(len(raw)//2), raw))
          x=[v/32768.0 for v in vals]
          def write(path, samples):
              pcm=bytearray()
              for v in samples:
                  q=max(-32767,min(32767,int(round(v*32767))))
                  pcm += struct.pack('<h',q)
              with wave.open(str(path),'wb') as w:
                  w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate); w.writeframes(pcm)
          a,b=229558,322174
          idle=x[a:b]
          f=int(.012*rate)
          cross=[]
          for i in range(f):
              t=i/f
              cross.append(idle[-f+i]*(1-t)+idle[i]*t)
          idle=cross+idle[f:-f]
          target=10**(-4/20)
          gain=target/max(max(abs(v) for v in idle),1e-9)
          idle=[v*gain for v in idle]
          write(root/'idle.wav',idle)
          a,b=int(22.10*rate),int(24.20*rate)
          rev=x[a:b]
          target=10**(-2/20)
          gain=target/max(max(abs(v) for v in rev),1e-9)
          rev=[v*gain for v in rev]
          fi,fo=int(.12*rate),int(.28*rate)
          for i in range(fi): rev[i]*=i/max(1,fi-1)
          for i in range(fo): rev[-fo+i]*=(fo-1-i)/max(1,fo-1)
          write(root/'rev.wav',rev)
          print('ISSUE30_DERIVED idle_samples=%d idle_seconds=%.6f rev_samples=%d rev_seconds=%.6f' %
                (len(idle),len(idle)/rate,len(rev),len(rev)/rate))
          PY
          ffmpeg -hide_banner -loglevel error -y -i /tmp/issue30/idle.wav -c:a libvorbis -q:a 4 /tmp/issue30/brax_engine_idle.ogg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/issue30/rev.wav -c:a libvorbis -q:a 4 /tmp/issue30/brax_engine_rev.ogg
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of default=nw=1 /tmp/issue30/brax_engine_idle.ogg
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration,size -of default=nw=1 /tmp/issue30/brax_engine_rev.ogg

      - name: Install clips, attribution, manifest and regression verifier
        shell: bash
        run: |
          set -euo pipefail
          AUDIO="unity-city/Assets/Source/Mistrzowie/Audio/BraxCar"
          mkdir -p "$AUDIO"
          cp /tmp/issue30/brax_engine_idle.ogg "$AUDIO/brax_engine_idle.ogg"
          cp /tmp/issue30/brax_engine_rev.ogg "$AUDIO/brax_engine_rev.ogg"
          IDLE_SHA="$(sha256sum "$AUDIO/brax_engine_idle.ogg" | awk '{print $1}')"
          REV_SHA="$(sha256sum "$AUDIO/brax_engine_rev.ogg" | awk '{print $1}')"
          IDLE_BYTES="$(stat -c%s "$AUDIO/brax_engine_idle.ogg")"
          REV_BYTES="$(stat -c%s "$AUDIO/brax_engine_rev.ogg")"
          export IDLE_SHA REV_SHA IDLE_BYTES REV_BYTES
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root=Path('.')
          audio=root/'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar'
          metas={
            root/'unity-city/Assets/Source/Mistrzowie/Audio.meta':'8d0bdff8d9425c8492fc2edcb3d9b048',
            root/'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar.meta':'d570c9b5fdbf52d09fc447b40af0ad6e',
            audio/'brax_engine_idle.ogg.meta':'10e57b853d7d5895af1b49160bd068f1',
            audio/'brax_engine_rev.ogg.meta':'c40f72ef5c625b3b97f7426f59b25163',
            audio/'ATTRIBUTION.txt.meta':'9858e4b2a5f65c9d8137e85d3533ce8f',
          }
          for p,guid in metas.items():
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text('fileFormatVersion: 2\nguid: '+guid+'\n',encoding='utf-8')
          attribution='''BRAXHORN CITY — vehicle engine audio attribution

Source recording: “Starting up Lada 1200L Zhiguli Engine”
Source page: https://commons.wikimedia.org/wiki/File:Starting_up_Lada_1200L_Zhiguli_Engine.webm
Original source URL: https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm
Creator / attribution requested by source: Sounds of Changes; sound/photo/video: Antti Makkonen
License: Creative Commons Attribution 3.0 Unported (CC BY 3.0)
License URL: https://creativecommons.org/licenses/by/3.0/
Original source SHA-256: 15a9fcf82f53c710f489b7d888557b4937ae3f50d968c22f2be342d29df398b6

Modifications for BRAXHORN CITY Issue #30:
- downmixed to mono and resampled to 22.05 kHz;
- idle derived from 10.41079365–14.61106576 s, seam-smoothed and normalized;
- rev derived from 22.10–24.20 s, normalized with 0.12 s fade-in / 0.28 s fade-out;
- encoded as OGG Vorbis for mobile use.

No endorsement by the creator is implied.
'''
          (audio/'ATTRIBUTION.txt').write_text(attribution,encoding='utf-8')
          manifest={
            'schema':2,'status':'FINAL_LICENSED_AUDIO_COMMITTED','issue':30,
            'source':{
              'title':'Starting up Lada 1200L Zhiguli Engine',
              'page_url':'https://commons.wikimedia.org/wiki/File:Starting_up_Lada_1200L_Zhiguli_Engine.webm',
              'direct_url':'https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm',
              'attribution':'Sounds of Changes; sound/photo/video: Antti Makkonen',
              'license':'CC BY 3.0 Unported','license_url':'https://creativecommons.org/licenses/by/3.0/',
              'sha256':'15a9fcf82f53c710f489b7d888557b4937ae3f50d968c22f2be342d29df398b6'
            },
            'derived_files':[
              {'role':'idle','unity_path':'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg',
               'sha256':os.environ['IDLE_SHA'],'bytes':int(os.environ['IDLE_BYTES']),'sample_rate':22050,'channels':1,
               'source_range_seconds':[10.41079365,14.61106576]},
              {'role':'rev','unity_path':'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg',
               'sha256':os.environ['REV_SHA'],'bytes':int(os.environ['REV_BYTES']),'sample_rate':22050,'channels':1,
               'source_range_seconds':[22.10,24.20]}
            ],
            'modifications':'mono downmix, 22.05kHz resample, trim, normalization; idle seam smoothing; rev fades; OGG Vorbis encoding',
            'pixabay_candidates_rejected':'Official Pixabay candidate pages were verified, but automated binary retrieval was blocked by HTTP 403; no unverifiable or mirrored Pixabay bytes were used.'
          }
          (root/'unity-tools/mistrzowie/champion_car_audio_sources.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path('unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.mp3','Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg')
          s=s.replace('Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.mp3','Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg')
          p.write_text(s,encoding='utf-8')
          PY
          cat > unity-tools/mistrzowie/prepare_champion_car_audio.py <<'PY'
          #!/usr/bin/env python3
          """Verify final licensed BRAXHORN car engine audio. No network, no Unity, no APK."""
          from pathlib import Path
          import hashlib, json
          ROOT=Path(__file__).resolve().parents[2]
          MANIFEST=ROOT/'unity-tools/mistrzowie/champion_car_audio_sources.json'
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda:f.read(1024*1024),b''): h.update(block)
              return h.hexdigest()
          def main():
              doc=json.loads(MANIFEST.read_text('utf-8'))
              assert doc['status']=='FINAL_LICENSED_AUDIO_COMMITTED'
              assert doc['source']['license']=='CC BY 3.0 Unported'
              assert doc['source']['sha256']=='15a9fcf82f53c710f489b7d888557b4937ae3f50d968c22f2be342d29df398b6'
              for rec in doc['derived_files']:
                  p=ROOT/rec['unity_path']
                  if not p.is_file(): raise FileNotFoundError(p)
                  data=p.read_bytes()
                  if not data.startswith(b'OggS'): raise ValueError('Not OGG: '+str(p))
                  if len(data)!=rec['bytes'] or sha(p)!=rec['sha256']:
                      raise ValueError('Audio hash/size mismatch: '+str(p))
              print('A1_CAR_AUDIO_VERIFY_PASS files=2 license=CC_BY_3_0 source_sha='+doc['source']['sha256'])
          if __name__=='__main__': main()
          PY
          chmod +x unity-tools/mistrzowie/prepare_champion_car_audio.py
          cat > unity-tools/mistrzowie/test_champion_car_audio.py <<'PY'
          from pathlib import Path
          import hashlib, json, unittest
          ROOT=Path(__file__).resolve().parents[2]
          class ChampionCarAudioTests(unittest.TestCase):
              def test_final_audio_is_real_licensed_hashed_and_wired(self):
                  doc=json.loads((ROOT/'unity-tools/mistrzowie/champion_car_audio_sources.json').read_text('utf-8'))
                  self.assertEqual(doc['status'],'FINAL_LICENSED_AUDIO_COMMITTED')
                  self.assertEqual(doc['source']['license'],'CC BY 3.0 Unported')
                  self.assertIn('Antti Makkonen',doc['source']['attribution'])
                  builder=(ROOT/'unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs').read_text('utf-8')
                  runtime=(ROOT/'unity-city/Assets/Mistrzowie/BraxChampionsCar.cs').read_text('utf-8')
                  self.assertIn('brax_engine_idle.ogg',builder); self.assertIn('brax_engine_rev.ogg',builder)
                  self.assertIn('AudioRolloffMode.Linear',runtime); self.assertIn('A1_CAR_ENGINE_REV',runtime)
                  self.assertNotIn('AudioClip.Create("BRAXHORN',runtime)
                  for rec in doc['derived_files']:
                      p=ROOT/rec['unity_path']; data=p.read_bytes()
                      self.assertTrue(data.startswith(b'OggS'))
                      self.assertEqual(len(data),rec['bytes'])
                      self.assertEqual(hashlib.sha256(data).hexdigest(),rec['sha256'])
              def test_car_contract_remains_495m_and_120kph(self):
                  b=(ROOT/'unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs').read_text('utf-8')
                  r=(ROOT/'unity-city/Assets/Mistrzowie/BraxChampionsCar.cs').read_text('utf-8')
                  self.assertIn('LengthMetres = 4.95f',b)
                  self.assertIn('car.maxSpeed = 120f / 3.6f',b)
                  self.assertIn('maxSpeed = 120f / 3.6f',r)
          if __name__=='__main__': unittest.main()
          PY
          python3 unity-tools/mistrzowie/prepare_champion_car_audio.py
          python3 -m unittest unity-tools/mistrzowie/test_champion_car_audio.py -v
          sha256sum "$AUDIO/brax_engine_idle.ogg" "$AUDIO/brax_engine_rev.ogg"

      - name: Commit only Issue 30 audio files and self-delete this workflow
        shell: bash
        env:
          BRANCH: gpt/miasto-mistrzow-kasyno-t11-20261105
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue30-finalize-car-audio-once.yml
          git config user.name "wawerpatryk89-sketch"
          git config user.email "wawerpatryk89@gmail.com"
          git add \
            unity-city/Assets/Source/Mistrzowie/Audio.meta \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar.meta \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar \
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs \
            unity-tools/mistrzowie/champion_car_audio_sources.json \
            unity-tools/mistrzowie/prepare_champion_car_audio.py \
            unity-tools/mistrzowie/test_champion_car_audio.py \
            .github/workflows/issue30-finalize-car-audio-once.yml
          git diff --cached --name-only
          if git diff --cached --name-only | grep -E 'BraxChampions(Arena|Casino)' | grep -v 'CarBuilder'; then
            echo 'ERROR: foreign Arena/Casino scope entered final audio commit' >&2; exit 90
          fi
          git commit -m "Issue 30: finalize licensed BRAXHORN engine idle and rev audio"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
