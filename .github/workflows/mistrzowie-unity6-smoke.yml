name: Miasto Mistrzów A1+T11 — podpisany APK aktualizacyjny
run-name: A1+T11 — Unity 6 Android APK — aktualizacja istniejącej aplikacji

# Historical owner-authorized APK workflow. After 2026-11-06 manual start only;
# never launch the Unity build on push or because a static preflight passed.
# The reusable workflow performs pre-Unity checks for the ORIGINAL app ID,
# ORIGINAL signing certificate and versionCode > Champions #14; it may
# proceed to Unity only when those checks pass. Do not start a second app.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# Same concurrency group as the existing scene-only job. A new APK run
# MUST CANCEL the previous Unity-6 scene-only run rather than waste time.
concurrency:
  group: mistrzowie-unity6-real-scenes-only
  cancel-in-progress: true

jobs:
  android-update-apk:
    if: github.ref == 'refs/heads/gpt/miasto-mistrzow-kasyno-t11-20261105'
    uses: ./.github/workflows/mistrzowie-apk.yml
    with:
      etap: apk
      kontrola_tras: false
      zdjecia: false
      recovery_run: ''
      base_id: ''
      commit: gpt/miasto-mistrzow-kasyno-t11-20261105
      arena_assets_tag: champions-a1-20261105
    secrets: inherit
