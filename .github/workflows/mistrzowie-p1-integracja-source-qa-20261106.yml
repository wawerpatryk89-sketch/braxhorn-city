name: Champions A1 T11 + P1 source integration QA (NO UNITY/APK)
run-name: A1+T11+P1 quick source QA - ${{ github.sha }}

on:
  push:
    branches: [gpt/miasto-mistrzow-a1-t11-p1-integracja-20261106]
    paths:
      - .github/workflows/mistrzowie-p1-integracja-source-qa-20261106.yml
      - unity-city/Assets/Editor/Mistrzowie/**
      - unity-city/Assets/BraxGymPlayer.cs
      - unity-city/Assets/Claude/Runtime/BraxSwimmingZone.cs
      - unity-tools/mistrzowie/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: champions-p1-integration-quick-qa
  cancel-in-progress: true

jobs:
  verify-integration-source:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Sparse checkout static source only (no large models or Unity import)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows
            unity-tools/mistrzowie
            unity-tools/validation
            unity-city/Assets/Editor/Mistrzowie
            unity-city/Assets/Editor/Claude/BraxClaudeMetro.cs
            unity-city/Assets/Editor/Mistrzowie/BraxClaudeMetro.Reuse.cs
            unity-city/Assets/Editor/BraxBuildQuality.cs
            unity-city/Assets/BraxGymPlayer.cs
            unity-city/Assets/Claude/BraxTouchControls.cs
            unity-city/Assets/Claude/Runtime/BraxSwimmingZone.cs
            unity-city/Assets/Claude/Runtime/BraxSchodyRuchomeJazda.cs
            unity-city/Assets/Mistrzowie
            unity-city/Assets/Source/Mistrzowie/PoolP1
            unity-city/Packages/manifest.json
            unity-city/ProjectSettings/ProjectVersion.txt
      - name: Python dependencies for original source tests
        run: |
          python3 -m pip install -q numpy==2.2.6 shapely==2.1.2 pillow==11.3.0 matplotlib==3.10.7
          python3 -m pip install -q -r unity-tools/validation/requirements.txt
      - name: Owner P1 full source tests
        run: |
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_pool_p1_*.py' -v
      - name: Preserve A1 T11 VIP original garage and Brax drivable car
        run: |
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_casino_t11_garage.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_vip_owner_model.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_a1_t11_before_apk.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_early_import_readiness.py' -v
      - name: Five real metro stations - source, route, original prefabs
        run: |
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_metro_five_stations.py' -v
      - name: Check CSharp syntax and local scope collisions
        run: |
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Source-only preserved boundaries and approved final P1 drawing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('.')
          read=lambda p:(root/p).read_text(encoding='utf-8')
          p1=json.loads(read('unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json'))
          assert (p1['lot']['x'],p1['lot']['z'],p1['lot']['w'],p1['lot']['d'])==(520,180,160,120)
          assert p1['parkingSpaces']==95 and p1['texResolution']==2048
          assert p1['waterReady'] and not p1['waterDeferred']
          assert len(p1['basins'])==3
          assert (p1['basins'][0]['w'],p1['basins'][0]['d'])==(25,17)
          buildings=read('unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuildings.cs')
          assert buildings.count('BraxChampionsCasinoT11.Generate(Out);')==1
          assert buildings.count('BraxChampionsPoolP1.Generate();')==1
          assert 'BraxChampionsArena.Generate(root);' in buildings
          player=read('unity-city/Assets/BraxGymPlayer.cs')
          for token in ('public BraxChampionsCar championsCar;',
                        'championsCar.Steer(move)','championsCar.EmergencyExit()',
                        'championsCarCameraHits','public bool Swimming =>',
                        'ClearSwimming();','swimmingSurfaceY-body.height'):
            assert token in player,token
          ground=read('unity-tools/mistrzowie/legacy_foundation.py')
          for token in ('PAVILION_PADS','PAVILION_FOOTPRINTS',
                        'cycle_lane','inlay_polygon','POOL_HOLES',
                        '[T11_GARAGE_RAMP]+POOL_HOLES',
                        'if any(inside((x,z),r) for r in POOL_HOLES):return None'):
            assert token in ground,token
          from sys import path
          path.insert(0,str(root/'unity-tools/mistrzowie'))
          from layout import METRO
          assert len(METRO)==5 and [m['id'] for m in METRO]==['M1','M2','M3','M4','M5']
          wf=read('.github/workflows/mistrzowie-apk.yml')
          for token in ('prepare_champion_car.py','import_brax_car_animations.py',
                        'prepare_promenade_props.py','prepare_pool_p1_slide.py',
                        'prepare_pool_p1_textures_2k.py','import_pool_p1_owner_assets.py',
                        'mistrzowie-unity6-smoke.yml','mistrzowie-unity6-apk-update.yml'):
            assert token in wf,token
          print('A1_T11_P1_APPROVED_SOURCE_INTEGRATION_PASS - NO UNITY/APK')
          PY
      - name: Honest source-only result
        if: always()
        run: |
          echo '## SOURCE-ONLY QA (NO Unity, NO APK)' >> "$GITHUB_STEP_SUMMARY"
          echo 'All P1 + A1/T11 + car + metro static tests checked. Visual/Android acceptance requires a separate authorized real Unity build.' >> "$GITHUB_STEP_SUMMARY"
