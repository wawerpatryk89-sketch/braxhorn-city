name: Obóz BRAXHORN — jednorazowy preflight przed Unity (bez APK)
# Jednorazowe, świadomie zlecone przez właściciela sprawdzenie obozu.
# Push-trigger ograniczony dokładnie do tego pliku i tej jednej gałęzi.
on:
  push:
    branches:
      - codex/oboz-przebudowa-pbr-20261105
    paths:
      - .github/workflows/oboz-authorized-preflight-20261105.yml
  workflow_dispatch:

permissions:
  # Draft releases require a principal with repository push access.
  # This job only READS release metadata and runs local static checks.
  contents: write
concurrency:
  group: oboz-owner-one-time-preflight-20261105
  cancel-in-progress: false

jobs:
  read-only-preflight:
    if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout only camp source, static tests and shared update tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            # These contract tests read the original workflow definitions
            # and the shared encrypted-delivery tool, not just game sources.
            .gitignore
            .github/workflows/
            unity-tools/claude/prywatne.py
            unity-city/Assets/
            unity-city/Packages/
            unity-city/ProjectSettings/
            unity-city/apk-warianty.txt
            unity-tools/oboz/
            unity-tools/updates/
            unity-tools/validation/
      - name: Verify actual owner models already present in private draft (no download)
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/owner_release_assets.py preflight
      - name: Verify existing encrypted legacy source delivery (no extraction)
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/assets.py preflight
      # Cheap end-to-end check of the missing #19 Idle.anim dependency.
      # No Unity editor, no APK and no modification of original source assets.
      - name: Odzyskaj i zweryfikuj szesc oryginalnych animacji bez Unity
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/motion_candidates.py
          python3 - <<'PY_MOTION'
          import hashlib, json
          from pathlib import Path
          root = Path('unity-city/Assets/Source/Prywatne/Oboz')
          folder = Path('unity-tools/oboz')
          verified = []
          for name in ('motion-candidates.json', 'monika-owner-motion.json'):
              records = json.loads((folder/name).read_text(encoding='utf-8'))['files']
              for record in records:
                  path = root/record['path']
                  if (not path.is_file() or path.stat().st_size != record['bytes'] or
                      hashlib.sha256(path.read_bytes()).hexdigest() != record['sha256']):
                      raise SystemExit('BRAXHORN_OBOZ_MOTION_MISSING_OR_CORRUPT '+record['path'])
                  verified.append(record['path'])
          if len(verified) != 6 or len(set(verified)) != 6:
              raise SystemExit('BRAXHORN_OBOZ_MOTION_INCOMPLETE')
          print('BRAXHORN_OBOZ_MOTION_PREFLIGHT=PASS files=6 Idle+Walk+Run+Monika owner')
          PY_MOTION
      - name: Validate latest signed APK #18 baseline and exact signing certificate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oboz18"
          gh release download oboz-review-latest --repo "$GITHUB_REPOSITORY" --pattern release-identity.json --dir "$RUNNER_TEMP/oboz18"
          python3 - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          sys.path.insert(0,"unity-tools/oboz")
          from recover_apk import CERTIFICATE
          original=Path(os.environ["RUNNER_TEMP"])/"oboz18/release-identity.json"
          info=json.loads(original.read_text())
          expected={
              "applicationId":"com.braxhorn.oboz",
              "versionCode":216024998,
              "sourceCommit":"e2ee759be31532fa283a3dd7e3f98acb12e9f256",
              "sourceRun":41983757537,
              "signingCertificateSha256":CERTIFICATE,
          }
          for key,want in expected.items():
              if info.get(key)!=want:
                  raise SystemExit(f"APK18 baseline mismatch: {key}: expected {want}, got {info.get(key)}")
          if info.get("contentUpdatesReady") is not False:
              raise SystemExit("Unexpected content updater claim on old APK18")
          if not re.fullmatch(r"[a-f0-9]{64}",info.get("apkSha256","")):
              raise SystemExit("Missing SHA256 of signed APK18")
          print("BRAXHORN_OBOZ_APK18_BASE=PASS appid=original signer=original update=APK not content-only")
          PY
      - name: Install pinned C sharp syntax parser, no Unity editor
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
      - name: Guard regressions, source packaging and update contract
        run: |
          set -euo pipefail
          python3 -m unittest discover -s unity-tools/oboz/tests -p 'test_*.py' -v
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
          python3 -m unittest discover -s unity-tools/oboz -p 'test_training_compile.py' -v
      - name: Parse Unity C sharp and check name scopes (not full Unity compile)
        run: |
          set -euo pipefail
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Record result
        if: success()
        run: |
          echo "BRAXHORN_OBOZ_PREFLIGHT=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Scope: source/static validation only; Unity editor=NOT_STARTED; APK=NOT_BUILT; phone=NOT_TESTED." >> "$GITHUB_STEP_SUMMARY"
          echo "Characters, animation and control files=UNCHANGED_BY_THIS_WORKFLOW." >> "$GITHUB_STEP_SUMMARY"
