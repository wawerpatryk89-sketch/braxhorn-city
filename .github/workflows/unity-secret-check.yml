name: Check Unity secret format
on:
  push:
    branches: [codex/unity-cloud-proof-20261028]
    paths: ['.github/workflows/unity-secret-check.yml']
permissions: {}
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check formatting without displaying values
        shell: python
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          import os, re, sys
          email = os.environ.get('UNITY_EMAIL', '')
          password = os.environ.get('UNITY_PASSWORD', '')
          license = os.environ.get('UNITY_LICENSE', '')
          errors = []
          if not re.fullmatch(r'[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+', email):
              errors.append('UNITY_EMAIL is not a plain email address, or contains whitespace.')
          if not password:
              errors.append('UNITY_PASSWORD is empty.')
          if password == email:
              errors.append('UNITY_PASSWORD is identical to UNITY_EMAIL.')
          if password.strip() == license.strip():
              errors.append('UNITY_PASSWORD is identical to UNITY_LICENSE.')
          if '\n' in password or '\r' in password:
              errors.append('UNITY_PASSWORD contains a line break.')
          if password and password != password.strip():
              errors.append('UNITY_PASSWORD has whitespace at its beginning or end. Verify whether it was intended.')
          for error in errors:
              print('::error::' + error)
          if errors:
              sys.exit(1)
          print('Formatting checks passed. This does not confirm the email/password or account activation.')
