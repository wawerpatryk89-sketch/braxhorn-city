name: Preserve verified CC0 sofas in asset library

on:
  push:
    branches: [codex/city-unity-gym-port-20261029]
    paths: ['.github/workflows/asset-library-sofas.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asset-library-cc0-sofas
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/codex/city-unity-gym-port-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/city-unity-gym-port-20261029
          sparse-checkout: asset-library
          lfs: false
          persist-credentials: true
      - name: Retrieve CC0 original files; verify every byte against uploaded archives
        shell: python
        run: |
          import hashlib, json, time, urllib.request, urllib.parse
          from pathlib import Path, PurePosixPath
          from datetime import datetime, timezone
          catalog_path = Path('asset-library/intake-20261029-02.json')
          catalog = json.loads(catalog_path.read_text())
          receipt = []
          allowed_hosts = {'api.polyhaven.com', 'dl.polyhaven.org'}
          def fetch(url, maximum):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != 'https' or parsed.hostname not in allowed_hosts:
                  raise ValueError('Not an approved official Poly Haven URL')
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'BraxhornAssetImport/1.0'})
                      with urllib.request.urlopen(req, timeout=90) as response:
                          if urllib.parse.urlsplit(response.geturl()).hostname not in allowed_hosts:
                              raise ValueError('Unexpected download redirect')
                          data = response.read(maximum + 1)
                          if len(data) > maximum:
                              raise ValueError('Unexpected response size')
                          return data
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(2 ** attempt)
          def urls(value):
              if isinstance(value, str) and value.startswith('https://'):
                  yield value
              elif isinstance(value, dict):
                  for child in value.values(): yield from urls(child)
              elif isinstance(value, list):
                  for child in value: yield from urls(child)
          records = [r for r in catalog['records'] if r.get('group') in ('sofa_02','sofa_03')]
          assert len(records) == 2
          for record in records:
              assert record['license'] == 'CC0' and record['publicSourceImportAllowed'] is True
              asset = record['group']
              api = json.loads(fetch('https://api.polyhaven.com/files/' + asset, 4000000))
              available = sorted(set(urls(api)))
              folder = Path('asset-library/sources') / asset
              for entry in record['sourceFiles']:
                  relative = PurePosixPath(entry['path'])
                  if relative.is_absolute() or '..' in relative.parts:
                      raise ValueError('Unsafe relative filename')
                  candidates = [u for u in available if urllib.parse.urlsplit(u).hostname == 'dl.polyhaven.org'
                                and PurePosixPath(urllib.parse.unquote(urllib.parse.urlsplit(u).path)).name == relative.name]
                  if not candidates: raise ValueError('No official source URL for ' + entry['path'])
                  data = None
                  for url in candidates:
                      candidate = fetch(url, entry['bytes'])
                      if len(candidate) == entry['bytes'] and hashlib.sha256(candidate).hexdigest() == entry['sha256']:
                          data = candidate
                          break
                  if data is None: raise ValueError('Source differs from user upload: ' + entry['path'])
                  target = folder / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists() and hashlib.sha256(target.read_bytes()).hexdigest() != entry['sha256']:
                      raise ValueError('Refusing to overwrite a different existing asset')
                  target.write_bytes(data)
                  receipt.append({'path':str(target), 'bytes':len(data), 'sha256':entry['sha256'], 'sourceUrl':url})
                  print('VERIFIED_ASSET', target, len(data), entry['sha256'])
              record['sourceFilesPresentInGitHub'] = True
              record['storageStatus'] = 'SOURCE_CONTENT_IMPORTED__EXACT_MEMBER_HASHES_MATCH_UPLOAD'
              record['storedAt'] = str(folder)
              record['originalZipStored'] = False
              (folder / 'PROVENANCE.md').write_text('# ' + asset + '\n\nSource: ' + record['source'] + '\nAuthor: ' + record['author'] + '\nLicense: CC0.\n\nModel and texture bytes match the uploaded archive, verified using SHA-256 for each file.\nThe original ZIP wrapper is not duplicated. These are source files, not an imported or approved Unity prefab.\n')
          assert len(receipt) == 10
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n')
          Path('asset-library/sofas-import-receipt.json').write_text(json.dumps({
              'verifiedAtUtc':datetime.now(timezone.utc).isoformat(), 'files':receipt,
              'fileCount':len(receipt), 'totalBytes':sum(x['bytes'] for x in receipt),
              'verification':'All ten file hashes match the members of the two user-uploaded sofa archives.',
              'gameDeployment':False}, ensure_ascii=False, indent=2) + '\n')
          print('CC0_SOURCE_IMPORT_PASS', len(receipt), sum(x['bytes'] for x in receipt))
      - name: Save source files only on isolated branch; never publish game
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "codex/city-unity-gym-port-20261029"
          git add -- asset-library/sources/sofa_02 asset-library/sources/sofa_03 asset-library/intake-20261029-02.json asset-library/sofas-import-receipt.json
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert paths and all(p.startswith('asset-library/') for p in paths), 'Unexpected changes outside asset library'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets: preserve two original CC0 sofas and eight textures, hash-verified'
          git push origin HEAD:refs/heads/codex/city-unity-gym-port-20261029
