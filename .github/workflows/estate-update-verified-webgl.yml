name: BRAXHORN Estate - update isolated preview ONLY after real WebGL pixels PASS
on:
  push:
    branches:
      - work/unity6-estate-migration-20261029
    paths:
      - ".github/workflows/estate-update-verified-webgl.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish-corrected-partial-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github

      - name: Require actual original Brax + completed scene from screenshot QA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh run view 40976624425 -R "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')"
          if [[ "$status" != "success" ]]; then
            echo "::error::Braxhorn WebGL scene QA did not pass: $status"
            exit 1
          fi
          gh run download 40976624425 -R "$GITHUB_REPOSITORY" \
            -n estate-REAL-WebGL-screenshot-QA-f797ece96d00906e69304c5d029d2dbd0e6b2b93 \
            -D "$RUNNER_TEMP/estate-certified-qa"
          python3 - <<'PY'
          import os, json
          from pathlib import Path
          file = Path(os.environ["RUNNER_TEMP"]) / "estate-certified-qa/visual-qa-report.json"
          a = json.loads(file.read_text())
          assert a["loaded"] and a["visualPass"] and a["runtimeSceneReady"]
          assert a["pink_ratio"] < .01 and a["braxGzipTransportIntact"]
          assert a["sourceModelCount"] == 19 and a["sourceDoorCount"] == 24
          assert a["sourceCollisionCount"] == 1013
          assert (file.parent / "unity-estate-real-browser.png").is_file()
          print("PASS: REAL unity rendered original Brax, 19/21 assets, 24 doors, no magenta.")
          PY

      - name: Fetch exact shader-fixed Unity WebGL build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40969008277 -R "$GITHUB_REPOSITORY" \
            -n estate-unity6-PARTIAL-NOT-1TO1-ccf2349859f4bfa927e41ad39ecd46f3388b383c \
            -D "$RUNNER_TEMP/estate-corrected-build"
          test -s "$RUNNER_TEMP/estate-corrected-build/EstatePartial_NOT_1TO1/index.html"
          test -s "$RUNNER_TEMP/estate-corrected-build/EstatePartial_NOT_1TO1/Build/EstatePartial_NOT_1TO1.wasm.gz"
          test -s "$RUNNER_TEMP/estate-corrected-build/EstatePartial_NOT_1TO1/StreamingAssets/Estate/EstateProceduralAndDoors.glb"

      - name: Commit tested game to an ISOLATED preview Git branch only
        run: |
          set -euo pipefail
          BRANCH="preview/estate-unity6-webgl-20261029"
          REF="refs/heads/$BRANCH"
          git fetch --no-tags --depth=1 origin "$REF:refs/remotes/origin/$BRANCH"
          git switch -C "$BRANCH" "refs/remotes/origin/$BRANCH"
          git rm --sparse --cached -r --ignore-unmatch Build StreamingAssets TemplateData index.html
          cp -a "$RUNNER_TEMP/estate-corrected-build/EstatePartial_NOT_1TO1/." .
          test -s index.html
          mkdir -p qa
          cp -a "$RUNNER_TEMP/estate-certified-qa/unity-estate-real-browser.png" qa/
          cp -a "$RUNNER_TEMP/estate-certified-qa/visual-qa-report.json" qa/
          git add --sparse -A Build StreamingAssets TemplateData index.html qa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Tested game already on isolated preview branch."
          else
            git commit -m "fix(est-visual): verified original Unity WebGL shaders, NOT full 1:1"
            git push origin "HEAD:$REF"
          fi
          echo "Preview branch updated. No main, city, gym or production touched."
