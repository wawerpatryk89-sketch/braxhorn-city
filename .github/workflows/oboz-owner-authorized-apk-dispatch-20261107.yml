name: Obóz — owner authorized APK dispatch 20261107
# One owner-approved final retry after duplicate-DEX fix and green source tests, 2026-11-07.
# Delivers lightweight APK + verified external Obóz base package. Source commits never auto-build.
on:
  push:
    branches: [codex/oboz-przebudowa-pbr-20261105]
    paths: [.github/workflows/oboz-owner-authorized-apk-dispatch-20261107.yml]

permissions:
  actions: write
  contents: read

concurrency:
  group: oboz-explicit-owner-request-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
      - name: Verify source and explicitly requested repaired APK
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: a47fa85702de5bb43963df124417c8df9d0e9b4e
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA"..HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/oboz-owner-authorized-apk-dispatch-20261107.yml"
          echo "OBOZ_OWNER_SOURCE_CHECKED=1 source=$SOURCE_SHA"
      - name: Dispatch exactly one camp Android APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow oboz-unity-build.yml --branch codex/oboz-przebudowa-pbr-20261105 --limit 20 --json status | jq '[.[] | select(.status != "completed")] | length')"
          test "$active" -eq 0 || { echo "::error::APK already running; no duplicate"; exit 1; }
          gh workflow run oboz-unity-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref codex/oboz-przebudowa-pbr-20261105 \
            -f quality_review=false \
            -f first_install=false \
            -f content_action=none \
            -f expected_sha="$GITHUB_SHA"
          echo "OBOZ_OWNER_AUTHORIZED_LIGHT_APK_DISPATCHED=1"
