# Owner-approved single contingency. No polling, no parallel Android build.
# Runs only when the specific Champions run #14 fails after completion.
name: Miasto Mistrzow - one-time backup after 14
on:
  workflow_run:
    workflows:
      - "Miasto Mistrzów — APK"
    types:
      - completed
    branches:
      - codex/miasto-mistrzow-20261104

permissions:
  contents: read
  actions: write

concurrency:
  group: mistrzowie-once-after-run-42028827233
  cancel-in-progress: false

jobs:
  conditional-retry:
    if: >-
      ${{ github.repository == 'wawerpatryk89-sketch/braxhorn-city' &&
          github.event.workflow_run.id == 42028827233 &&
          github.event.workflow_run.run_attempt == 1 &&
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.head_branch == 'codex/miasto-mistrzow-20261104' &&
          github.event.workflow_run.head_sha == '6eca26ef55cf1ff5f11ca98e4bcd3181122c0dbb' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source failure and dispatch one signed Champions base APK
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_ORIGIN_RUN: "42028827233"
          SOURCE_SHA: "cffaddde1bd0459f7034dad26c6b4eb340257ff4"
          TARGET_BRANCH: "codex/miasto-mistrzow-20261104"
        shell: bash
        run: |
          set -euo pipefail
          test "$REPO" = "wawerpatryk89-sketch/braxhorn-city"
          test "${{ github.event.workflow_run.id }}" = "$EXPECTED_ORIGIN_RUN"
          origin=$(gh api "repos/$REPO/actions/runs/$EXPECTED_ORIGIN_RUN")
          printf '%s' "$origin" | jq -e --arg branch "$TARGET_BRANCH" \
            --arg sha "6eca26ef55cf1ff5f11ca98e4bcd3181122c0dbb" \
            '(.status == "completed") and (.conclusion == "failure") and
             (.run_attempt == 1) and (.head_branch == $branch) and
             (.head_sha == $sha) and (.path == ".github/workflows/mistrzowie-apk.yml")' >/dev/null
          # This commit was deliberately pinned at arming time. No moving targets.
          gh api "repos/$REPO/commits/$SOURCE_SHA" --jq .sha | grep -Fx "$SOURCE_SHA"
          # Avoid a second build if the owner has already dispatched the same
          # pinned code during the interval after #14 finished.
          source_completed=$(printf '%s' "$origin" | jq -r .updated_at)
          existing=$(gh api "repos/$REPO/actions/workflows/mistrzowie-apk.yml/runs?branch=$TARGET_BRANCH&event=workflow_dispatch&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$SOURCE_SHA\" and .created_at >= \"$source_completed\") | .id" || true)
          if [ -n "$existing" ]; then
            echo "BRAX_MISTRZOWIE_BACKUP_SKIPPED_OWNER_ALREADY_STARTED id=$existing"
            exit 0
          fi
          echo "BRAX_MISTRZOWIE_BACKUP_TRIGGERED origin=$EXPECTED_ORIGIN_RUN newSource=$SOURCE_SHA"
          gh api -X POST "repos/$REPO/actions/workflows/mistrzowie-apk.yml/dispatches" \
            -f ref="$TARGET_BRANCH" \
            -f "inputs[commit]=$SOURCE_SHA"
          echo "Dispatched exactly one new manual-equivalent Champions workflow. APK requires usual release certificate and quality checks." >> "$GITHUB_STEP_SUMMARY"
