name: Obóz — rozmowy lokalnym Piperem
on:
  push:
    branches: [codex/oboz-npc-life-20261104]
    paths: [unity-tools/oboz/dialogue-request.json]
permissions:
  contents: read
concurrency:
  group: oboz-piper-dialogue
  cancel-in-progress: false
jobs:
  dialogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Ten sam lokalny silnik co osiedle
        run: |
          python3 -m venv "$RUNNER_TEMP/piper"
          "$RUNNER_TEMP/piper/bin/pip" install piper-tts==1.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Nagranie oryginalnych kwestii obozu
        run: '"$RUNNER_TEMP/piper/bin/python" unity-tools/oboz/dialogue.py'
      - name: Nagrania, treść i pochodzenie
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camp-dialogue-${{ github.run_id }}
          path: build/CampDialogue/
          if-no-files-found: error
          retention-days: 90
