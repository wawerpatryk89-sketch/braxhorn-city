name: Miasto Mistrzów — APK
run-name: Miasto Mistrzów — ${{ inputs.etap || 'apk' }} — ${{ github.run_number }}

# Register this entry on main so GitHub displays a dedicated Run workflow form.
# The game stays on its own branch; every run records the exact checked-out SHA.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Zostaw puste. Opcjonalnie pełne SHA lub nazwa gałęzi Miasta Mistrzów.'
        type: string
        required: false
        default: ''
      kontrola_tras:
        description: 'Opcjonalna dłuższa kontrola przejść metra i areny; kolizje fizyczne zawsze zostają.'
        type: boolean
        default: false
      etap:
        description: 'apk = kompilacja APK; sceny = kontrola scen w Unity bez APK i bundles (też trwa)'
        type: choice
        options: [apk, sceny, aktualizacja]
        default: apk
      zdjecia:
        description: 'Opcjonalny dodatkowy player Linux i zdjęcia po dostarczeniu APK; wydłuża build'
        type: boolean
        required: false
        default: false
      recovery_run:
        description: 'Opcjonalnie ID nieudanego przebiegu z zapisanym APK (odzysk podpisu bez Unity); zostaw puste dla zwykłego buildu'
        type: string
        required: false
        default: ''
      base_id:
        description: 'Tylko dla etap=aktualizacja: identyfikator bazy mistrzowie-32hex z raportu pierwszego APK'
        type: string
        required: false
        default: ''
      arena_assets_tag:
        description: 'Tag jednego wydania GitHub z arena A1 + murale + szyldy Miasta Mistrzow'
        type: string
        required: false
        default: 'champions-a1-20261105'
      p1_assets_tag:
        description: 'P1: tag szkicu GitHub Release z oryginalnym wyposażeniem BASEN+SPA'
        type: string
        required: false
        default: 'p1-basen-spa-20261106'
permissions:
  contents: write
  actions: read
concurrency:
  group: mistrzowie-apk
  cancel-in-progress: false
jobs:
  exploration-apk:
    if: ${{ inputs.recovery_run == '' && inputs.etap != 'aktualizacja' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MISTRZOWIE_PIPELINE: "20261105-A1-T11"
    steps:
      - name: Resolve the selected Champions source
        id: selected
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          python3 - <<'PYREF'
          import os, re
          # ONE production source for a combined Arena A1 + Casino T11 APK.
          # Running this from the older Arena-only/main workflow must stop.
          combined = 'gpt/miasto-mistrzow-kasyno-t11-20261105'
          pool = 'gpt/miasto-mistrzow-basen-p1-20261105'
          current = os.environ.get('GITHUB_REF', '').removeprefix('refs/heads/')
          if current not in (combined,pool):
              raise SystemExit('Use workflow from: ' + pool +
                               ' (or existing A1+T11). Do not build old main/arena branch.')
          sha = os.environ['GITHUB_SHA'].lower()
          selected = os.environ.get('SOURCE_COMMIT', '').strip()
          if selected and selected not in (current,sha):
              raise SystemExit('Only current commit for chosen Champions branch: ' + sha)
          value = sha
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ref=' + value + '\n')
          PYREF
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Pin the selected branch run to the event SHA. From main, use the
          # requested game commit (or the current Champions branch if blank).
          ref: ${{ steps.selected.outputs.ref }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets
            unity-city/Packages
            unity-city/ProjectSettings
            unity-city/Prywatne/miasto_palmy.tar.gz.enc
            unity-city/Prywatne/miasto_silownia_metro.tar.gz.enc
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
            unity-tools/mistrzowie
            unity-tools/updates
            unity-tools/validation
            .github/workflows/mistrzowie-apk.yml
            unity-tools/claude/prywatne.py
            unity-tools/claude/import_patryk_transfer.py
            unity-tools/claude/import_patryk_animations.py
            unity-tools/claude/tekstury_b5.py
      - name: Zapisz dokładną wersję gry przed generowaniem
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          test -f unity-tools/mistrzowie/apk_delivery.py
          test -f unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuild.cs
          printf '%s\n' "$sha" > unity-city/mistrzowie.source-commit
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'SOURCE_SHA=%s\n' "$sha" >> "$GITHUB_ENV"
          printf '## Miasto Mistrzów — wersja do zbudowania\n\nKod gry: `%s`\n\nWorkflow: `%s`\n' "$sha" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify source, workflow and pinned Unity configuration
        id: preflight
        run: python3 unity-tools/mistrzowie/pipeline.py
      - name: Verify and import original A1 arena assets before any expensive Unity build
        if: ${{ hashFiles('unity-tools/mistrzowie/verify_champion_assets.py') != '' }}
        env:
          A1_ASSET_TAG: ${{ inputs.arena_assets_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$A1_ASSET_TAG" ] ||
             ! [[ "$A1_ASSET_TAG" =~ ^champions-a1-[a-zA-Z0-9._-]{1,80}$ ]]; then
            echo "::error::Invalid or missing A1/T11 owner source tag"
            exit 1
          fi
          # There are two DRAFT releases with the SAME tag. The approved
          # original A1 and T11 ZIPs are inside one SHA256-locked outer ZIP.
          # 'gh release download TAG' cannot resolve this safely and may
          # hide drafts. Query the authenticated release list by tag + name.
          outer="BRAXHORN_MISTRZOWIE_A1_T11_ORIGINALY_DO_BUILD.zip"
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          asset_id="$(printf '%s' "$releases" | jq -r \
            --arg tag "$A1_ASSET_TAG" --arg name "$outer" \
            '[.[]|select(.tag_name==$tag)|.assets[]?|select(.name==$name)|.id] |
              if length==1 then .[0] else empty end')"
          if [ -z "$asset_id" ]; then
            echo "::error::Expected one original A1/T11 outer ZIP in draft releases"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            > "$RUNNER_TEMP/$outer"
          python3 unity-tools/mistrzowie/unpack_a1_t11_nested_release.py \
            "$RUNNER_TEMP/$outer" "$RUNNER_TEMP" --dry-run
          python3 unity-tools/mistrzowie/unpack_a1_t11_nested_release.py \
            "$RUNNER_TEMP/$outer" "$RUNNER_TEMP"
          # Both inner ZIPs are original and SHA256-pinned. Do not import
          # other bundled character animations or alter existing GUIDs.
          python3 unity-tools/mistrzowie/import_champion_assets.py \
            "$RUNNER_TEMP/ARENA_A1_DO_GITHUB_POBIERZ_PONOWNIE.zip" --dry-run
          python3 unity-tools/mistrzowie/import_champion_assets.py \
            "$RUNNER_TEMP/ARENA_A1_DO_GITHUB_POBIERZ_PONOWNIE.zip"
          python3 unity-tools/mistrzowie/import_selected_a1_t11.py \
            "$RUNNER_TEMP/ARENA_A1_KASYNO_T11_ORYGINALY_Z_GABLOTA.zip" --dry-run
          python3 unity-tools/mistrzowie/import_selected_a1_t11.py \
            "$RUNNER_TEMP/ARENA_A1_KASYNO_T11_ORYGINALY_Z_GABLOTA.zip"
          python3 unity-tools/mistrzowie/verify_champion_assets.py
          python3 unity-tools/mistrzowie/verify_arena_three_murals.py
          test -s unity-city/Assets/Source/Mistrzowie/CitySigns/01_GLOWNE/C1_KASYNO_KASYNO_WAWER.png
          test -s unity-city/Assets/Source/Mistrzowie/Trophies/BRAXHORN_ARENA_CASE_PLAQUE.jpg
          echo "MISTRZOWIE_A1_T11_ASSET_GATE PASS; original belt/VIP + 3 murals + 3 relevant signs + 1 owner case image"

      - name: Restore original P1 equipment and both owner signs before Unity
        if: ${{ hashFiles('unity-tools/mistrzowie/import_pool_p1_owner_assets.py') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P1_SOURCE_TAG: ${{ inputs.p1_assets_tag }}
        shell: bash
        run: |
          set -euo pipefail
          zip_name="P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          if [ -z "$P1_SOURCE_TAG" ]; then
            echo "::error::P1 needs its owner ZIP in a private GitHub Release; set p1_assets_tag"
            exit 1
          fi
          if ! [[ "$P1_SOURCE_TAG" =~ ^[A-Za-z0-9._-]{3,100}$ ]]; then
            echo "::error::Invalid P1 private source release tag"
            exit 1
          fi
          # Draft releases may give 404 for GET-by-tag; use authenticated list.
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          asset_id="$(printf '%s' "$release_json" | jq -r \
            --arg tag "$P1_SOURCE_TAG" --arg file "$zip_name" \
            '[.[] | select(.tag_name==$tag) | .assets[]? | select(.name==$file) | .id] | first // empty')"
          if [ -z "$asset_id" ]; then
            echo "::error::P1 original source ZIP not found in release $P1_SOURCE_TAG"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/$zip_name"
          python3 unity-tools/mistrzowie/import_pool_p1_owner_assets.py "$RUNNER_TEMP/$zip_name" --dry-run
          python3 unity-tools/mistrzowie/import_pool_p1_owner_assets.py "$RUNNER_TEMP/$zip_name"
          test -s unity-city/Assets/Source/Mistrzowie/PoolP1/OwnerEquipment/hot-tub-original-exterior-model.glb
          test -s unity-city/Assets/Source/Mistrzowie/CitySigns/01_GLOWNE/P1_BASEN_BASEN_MIEJSKI.png
          test -s unity-city/Assets/Source/Mistrzowie/CitySigns/01_GLOWNE/P1_SPA_SPA_WELLNESS.png
          echo "P1_OWNER_SOURCE_GATE PASS, original SPA and BASEN source assets installed"

      - name: Verify key and sign a real tiny APK before the expensive Unity build
        if: inputs.etap != 'sceny'
        env:
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          test -n "$KS" && test -n "$KP"
          umask 077
          printf '%s' "$KS" | base64 --decode > unity-city/braxhorn.keystore
          printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
          python3 unity-tools/mistrzowie/apk_version.py > unity-city/braxhorn.versioncode
          python3 unity-tools/mistrzowie/apk_delivery.py preflight
          # Identity from the signed, delivered Champions #14 APK. Fatal only
          # on incompatible Android package/certificate/version, not aesthetics.
          python3 unity-tools/mistrzowie/verify_previous_apk.py
      - name: C# syntax and local scopes before Unity (CS0136 regression)
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Prepare runner disk and 12 GiB Unity swap
        run: |
          # Keep the host Android SDK: APK certificate/identity verification needs it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune --all --force
          sudo fallocate -l 12G /swapfile-mistrzowie
          sudo chmod 600 /swapfile-mistrzowie
          sudo mkswap /swapfile-mistrzowie
          sudo swapon /swapfile-mistrzowie
          df -h /
          free -h
      - name: Cache original public PBR source maps
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: unity-city/Assets/Source/Mistrzowie/Textures
          key: mistrzowie-pbr-4k-${{ hashFiles('unity-tools/mistrzowie/prepare_assets.py', 'unity-tools/mistrzowie/verified_textures.json') }}
      - name: Cache T11 provider-native Poly Haven 2K source maps
        if: ${{ hashFiles('unity-tools/mistrzowie/prepare_casino_textures_2k.py') != '' }}
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: unity-city/Assets/Source/Mistrzowie/CasinoT11/Textures2K
          key: mistrzowie-casino-t11-2k-${{ hashFiles('unity-tools/mistrzowie/prepare_casino_textures_2k.py') }}
      - name: Cache P1 provider-native Poly Haven 2K source maps
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: unity-city/Assets/Source/Mistrzowie/PoolP1/Textures2K
          key: mistrzowie-pool-p1-2k-${{ hashFiles('unity-tools/mistrzowie/prepare_pool_p1_textures_2k.py') }}
      - name: Geometry and source preparation
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 -m pip install numpy==2.2.6 shapely==2.1.2 pillow==11.3.0 matplotlib==3.10.7
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_*.py' -v
          python3 -m py_compile unity-tools/updates/content_snapshot.py
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
          python3 unity-tools/mistrzowie/audit_metro.py
          python3 unity-tools/mistrzowie/prepare_assets.py
          # New T11 surfaces ONLY: fetch original Poly Haven native 2K, no 1K/4K.
          python3 unity-tools/mistrzowie/prepare_casino_textures_2k.py
          python3 unity-tools/mistrzowie/prepare_casino_vegetation_2k.py
          # P1 only: genuine native 2048x2048 Poly Haven PBR; fail on missing sources.
          python3 unity-tools/mistrzowie/prepare_pool_p1_textures_2k.py
          # Original owner-supplied raft slide: direct publisher GLB, exact SHA256 and stable GUID.
          python3 unity-tools/mistrzowie/prepare_pool_p1_slide.py
          python3 unity-tools/mistrzowie/restore_private.py
          python3 unity-tools/mistrzowie/prepare_brax.py
          python3 unity-tools/mistrzowie/prepare_signage.py
          python3 unity-tools/mistrzowie/build_infrastructure.py
          python3 unity-tools/mistrzowie/prepare_landscape.py
          python3 unity-tools/mistrzowie/validate_contract.py
          python3 unity-tools/mistrzowie/build_exteriors.py
          python3 unity-tools/mistrzowie/audit_layout.py
          python3 unity-tools/mistrzowie/build_signs.py
          python3 unity-tools/mistrzowie/prepare_arena.py
      - name: Prepare durable Addressables content baseline mode
        if: ${{ inputs.etap != 'sceny' }}
        run: |
          # This runs ONLY for the next intentionally built base APK, not an update.
          # It must finish recording stable GUIDs, catalog and content state.
          printf 'baseline\n' > unity-city/content-mode.txt
          printf '{"edits":[]}\n' > unity-city/content-patch.json
      - name: Compile Android file picker for future content-only patches
        if: ${{ inputs.etap != 'sceny' }}
        run: |
          docker run --rm --entrypoint bash -v "$PWD:/project" \
            ${{ steps.preflight.outputs.androidImage }} \
            /project/unity-tools/mistrzowie/build_content_picker.sh
          test -s unity-city/Assets/Plugins/Android/BraxContentPicker.jar
      - name: Restore isolated encrypted Champions Library
        id: library
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-${{ steps.preflight.outputs.unity }}-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            champions-library-android-${{ steps.preflight.outputs.unity }}-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-
      - name: Restore imported assets and source GUIDs
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: bash unity-tools/mistrzowie/library_cache.sh restore unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
      - name: Remove restored archive and report remaining space
        run: |
          rm -f "$RUNNER_TEMP/champions-library.tar.zst.enc"
          df -h /
      - name: Unity 6 - Miasto Mistrzów, Brax i APK do zwiedzania
        id: unity_build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: ${{ steps.preflight.outputs.unity }}
          customImage: ${{ steps.preflight.outputs.androidImage }}
          targetPlatform: Android
          buildMethod: ${{ inputs.etap == 'sceny' && 'BraxChampionsBuild.ValidateScenes' || (inputs.kontrola_tras == false && 'BraxChampionsBuild.BuildAndroidWithoutWalkChecks' || 'BraxChampionsBuild.BuildAndroid') }}
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true
      # Save the expensive Unity-generated scene and original content state
      # independently of later signing, artifact upload or release errors.
      - name: Archive immutable generated Champions scene and Addressables baseline
        id: content_baseline
        if: ${{ always() && !cancelled() && hashFiles('unity-city/BraxContentBuild/base/manifest.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 unity-tools/updates/content_snapshot.py publish-base
          python3 - <<'PY'
          import json,os,pathlib
          manifest=json.loads(pathlib.Path('unity-city/BraxContentBuild/base/manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('### Miasto Mistrzów: niezmienna baza zawartości\n\n')
              out.write('Base ID: `' + manifest['baseId'] + '`\n\n')
              out.write('Adres prywatnej bazy: content-base-' + manifest['baseId'] + '\n\n')
              out.write('Kolejne poprawki w trybie `aktualizacja` nie wykonują BuildPlayer.\n')
          PY
      - name: Validate APK identity and existing certificate; stage immutable output
        id: apk_stage
        if: always() && !cancelled() && steps.content_baseline.outcome == 'success' && hashFiles('build/Android/braxhorn-mistrzowie.gotowe') != ''
        run: python3 unity-tools/mistrzowie/apk_delivery.py stage
      # BuildPlayer has completed, but final signing/publishing failed.
      # Save the raw output WITHOUT any keystore. This is NOT a trusted installer.
      # The owner can use recovery_run later to re-sign and publish without Unity.
      - name: Record raw APK checkpoint after a failed signature validation
        id: raw_checkpoint
        if: ${{ always() && !cancelled() && (steps.apk_stage.outcome == 'failure' || steps.content_baseline.outcome == 'failure') && hashFiles('build/Android/braxhorn-mistrzowie.gotowe') != '' }}
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/mistrzowie/apk_rescue.py save
      - name: Save quarantined compiled APK for safe recovery without Unity
        if: ${{ always() && !cancelled() && steps.raw_checkpoint.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UNVERIFIED-mistrzowie-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.source.outputs.sha }}
          path: |
            mistrzowie-rescue/braxhorn-mistrzowie.apk.enc
            unity-city/braxhorn.versioncode
            unity-city/mistrzowie.source-commit
            mistrzowie-rescue/raw.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Immediately save APK as Actions artifact
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.source.outputs.sha }}
          path: mistrzowie-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Independently save APK as a unique test release
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        id: apk_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:7}"
          python3 - <<'PYNOTES'
          import json, pathlib
          m = json.loads(pathlib.Path('mistrzowie-apk/manifest.json').read_text())
          pathlib.Path('mistrzowie-apk/release-notes.txt').write_text(
              'Miasto Mistrzów — zwiedzanie Patrykiem, sterowanie z gry.\n\n'
              + 'Commit: ' + m['commit'] + '\nSHA-256 APK: ' + m['sha256']
              + '\nTest wizualny i sterowanie na urządzeniu: jeszcze niepotwierdzone.\n')
          PYNOTES
          gh release create "$tag" mistrzowie-apk/*.apk mistrzowie-apk/manifest.json --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease --title "Miasto Mistrzów — APK ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" --notes-file mistrzowie-apk/release-notes.txt
      - name: Confirm at least one real APK delivery before optional reports
        id: apk_delivery
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
          APK_ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
        run: |
          export APK_RELEASE_TAG="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:7}"
          python3 unity-tools/mistrzowie/apk_delivery.py verify
      - name: Activate immutable Addressables base only after signed APK delivery
        if: ${{ always() && !cancelled() && steps.content_baseline.outcome == 'success' && steps.apk_delivery.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python3 unity-tools/updates/content_snapshot.py approve-base
          echo 'BRAXHORN: signed APK delivered and immutable content baseline approved' >> "$GITHUB_STEP_SUMMARY"
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-182
          path: build/QualityReview/
          if-no-files-found: warn
      - name: Optional real player for visual review after APK delivery
        id: visual_player
        if: success() && inputs.zdjecia && steps.apk_delivery.outcome == 'success'
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: ${{ steps.preflight.outputs.unity }}
          customImage: ${{ steps.preflight.outputs.visualImage }}
          targetPlatform: StandaloneLinux64
          buildMethod: BraxChampionsBuild.BuildVisualReview
          versioning: None
          allowDirtyBuild: true
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-249
          path: build/QualityReview/
          if-no-files-found: warn
      - name: Capture the real running player
        if: success() && steps.visual_player.outcome == 'success'
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          CHAMPIONS_REVIEW_DIR: ${{ github.workspace }}/mistrzowie-visual-review
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgl1 libasound2t64
          chmod +x build/VisualReview/Mistrzowie.x86_64
          timeout 300s xvfb-run -a -s '-screen 0 1280x720x24' build/VisualReview/Mistrzowie.x86_64 --champions-review -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 -logFile "$GITHUB_WORKSPACE/mistrzowie-visual-player.log"
          test -s mistrzowie-visual-review/complete.txt
          python3 - <<'PYIMAGES'
          from pathlib import Path
          from PIL import Image, ImageStat
          files=list(Path('mistrzowie-visual-review').glob('*.png'))
          assert len(files)==5, 'Five real player frames required'
          for path in files:
              with Image.open(path) as frame:
                  assert frame.width >= 1000 and frame.height >= 600
                  assert max(ImageStat.Stat(frame.convert('RGB')).stddev)>2, 'Flat or blank render: '+str(path)
          PYIMAGES
      - name: Save optional visual review and player log
        if: always() && !cancelled() && inputs.zdjecia && steps.apk_delivery.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-visual-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mistrzowie-visual-review/
            mistrzowie-visual-player.log
          if-no-files-found: warn
      - name: Save validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            mistrzowie-evidence/*.json
            unity-city/Assets/Source/Mistrzowie/source-materials.json
            unity-city/Logs/
            unity-city/Packages/packages-lock.json
            unity-city/ProjectSettings/ProjectVersion.txt
            unity-city/BraxContentBuild/base/manifest.json
            unity-city/BraxContentBuild/base/scene-guids.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Pack encrypted imports after delivery attempts or failed Unity validation
        id: library_pack
        if: always() && !cancelled() && !inputs.zdjecia && (steps.unity_build.outcome == 'success' || steps.unity_build.outcome == 'failure')
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          # A failed scene check still leaves reusable imports. Save after the
          # APK/evidence steps; this is never a claim that the scene passed.
          test -d unity-city/Library
          sudo swapoff /swapfile-mistrzowie || true
          sudo rm -f /swapfile-mistrzowie
          sudo docker image prune --all --force
          sudo chown -R "$(id -u):$(id -g)" unity-city/Library
          bash unity-tools/mistrzowie/library_cache.sh save unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
      - name: Save isolated encrypted Champions Library
        if: always() && !cancelled() && steps.library_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-${{ steps.preflight.outputs.unity }}-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

  recover-existing-apk:
    # Explicit manual recovery only. No Unity compilation, no generated key,
    # no unverified APK release. The original raw artifact is quarantined.
    if: ${{ inputs.recovery_run != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/miasto-mistrzow-20261104
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-tools/mistrzowie
            unity-city/Packages
            unity-city/ProjectSettings
      - name: Verify quarantined APK provenance and restore exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run }}
        run: |
          python3 unity-tools/mistrzowie/apk_rescue.py restore
          echo "SOURCE_SHA=$(cat unity-city/mistrzowie.source-commit)" >> "$GITHUB_ENV"
      - name: Verify existing key and real Android APK signing without Unity
        env:
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          test -n "$KS" && test -n "$KP"
          umask 077
          printf '%s' "$KS" | base64 --decode > unity-city/braxhorn.keystore
          printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
          python3 unity-tools/mistrzowie/apk_delivery.py preflight
      - name: Validate and sign recovered APK with the same release certificate
        id: apk_stage
        run: python3 unity-tools/mistrzowie/apk_delivery.py stage
      - name: Save recovered and verified APK as Actions artifact
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-apk-recovered-${{ github.run_id }}-${{ github.run_attempt }}
          path: mistrzowie-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish recovered signed APK to unique test release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:7}"
          gh release create "$tag" mistrzowie-apk/*.apk mistrzowie-apk/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --prerelease \
            --title "Miasto Mistrzów — APK odzysk ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --notes "Ponownie zweryfikowany podpis istniejącym kluczem. APK odzyskany z poprzedniej kompilacji Unity; uruchomienie na telefonie nadal niepotwierdzone."
      - name: Verify real uploaded APK digest and delivery
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
          APK_ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
        run: |
          export APK_RELEASE_TAG="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:7}"
          python3 unity-tools/mistrzowie/apk_delivery.py verify

  champions-content-update:
    # A new APK is forbidden here. Save/load the signed base's original scene
    # and Addressables state; changed assets only. Source C# changes are rejected.
    if: ${{ inputs.recovery_run == '' && inputs.etap == 'aktualizacja' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    env:
      MISTRZOWIE_PIPELINE: "20261105-A1-T11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets
            unity-city/Packages
            unity-city/ProjectSettings
            unity-city/content-patch.json
            unity-tools/updates
            unity-tools/mistrzowie
            unity-tools/validation
      - name: Require exact immutable published Miasto Mistrzów base ID
        id: content_request
        env:
          CHAMPIONS_BASE_ID: ${{ inputs.base_id }}
        run: |
          python3 - <<'PY'
          import os,re
          base=os.environ['CHAMPIONS_BASE_ID'].strip()
          if not re.fullmatch(r'mistrzowie-[a-f0-9]{32}',base):
              raise SystemExit('Wymagany base_id mistrzowie-32hex z poprzedniego bazowego APK')
          if not os.path.isfile('unity-city/content-patch.json'):
              raise SystemExit('Missing explicit cumulative content-patch.json')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('base='+base+'\n')
          PY
      - name: Restore immutable encrypted authoring scene and Addressables state
        env:
          GH_TOKEN: ${{ github.token }}
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          BASE_ID: ${{ steps.content_request.outputs.base }}
        run: |
          python3 unity-tools/updates/content_snapshot.py restore-base --base "$BASE_ID"
          test -s unity-city/BraxContentBuild/base/addressables_content_state.bin
          test -s unity-city/BraxContentBuild/base/scene-guids.txt
          test -s unity-city/Assets/Resources/BraxContentBase.json
      - name: Keep the exact Android picker from the immutable signed baseline
        run: |
          # Never rebuild runtime Java code for an Addressables-only patch.
          # The encrypted baseline contains the original JAR and original GUID.
          test -s unity-city/Assets/Plugins/Android/BraxContentPicker.jar
          test -s unity-city/Assets/Plugins/Android/BraxContentPicker.jar.meta
          echo BRAX_MISTRZOWIE_PICKER_FROM_SIGNED_BASELINE
      - name: Restore encrypted previously-imported Unity Library for content updates
        id: content_library
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-6000.0.85f2-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-content-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            champions-library-android-6000.0.85f2-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-
      - name: Restore cached imports with stable GUIDs (optional)
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          bash unity-tools/mistrzowie/library_cache.sh restore unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
          rm -f "$RUNNER_TEMP/champions-library.tar.zst.enc"
          du -sh unity-city/Library 2>/dev/null || echo 'Brak cache; Unity zaimportuje źródła jeszcze raz'
      - name: Cheap validation before Unity
        run: |
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Build changed Addressables bundles ONLY - never Android APK
        id: content_build
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.85f2
          customImage: unityci/editor:ubuntu-6000.0.85f2-android-3.2.2
          targetPlatform: Android
          buildMethod: BraxContentBuild.UpdateFromBaseline
          versioning: None
          allowDirtyBuild: true
      - name: Verify bundle package identity before uploading
        env:
          BASE_ID: ${{ steps.content_request.outputs.base }}
        run: |
          python3 - <<'PY'
          import json,os,zipfile
          from pathlib import Path
          packages=list(Path('unity-city/BraxContentBuild').glob('mistrzowie-u-*.braxupdate.zip'))
          if len(packages)!=1: raise SystemExit('Exactly one cumulative update ZIP required')
          package=packages[0]
          if not 0<package.stat().st_size<2*1024**3:
              raise SystemExit('Update exceeds private release size limit; split content bundles')
          with zipfile.ZipFile(package) as archive:
              entries=archive.namelist()
              if len(entries)!=len(set(entries)) or 'manifest.json' not in entries:
                  raise SystemExit('Bad or duplicate ZIP manifest entries')
              manifest=json.loads(archive.read('manifest.json'))
              if manifest.get('zone')!='mistrzowie' or manifest.get('baseId')!=os.environ['BASE_ID']:
                  raise SystemExit('Wrong content zone or base')
              if not manifest.get('catalog') or not manifest.get('files'):
                  raise SystemExit('Invalid content catalog')
          print('BRAX_MISTRZOWIE_DELTA_VERIFIED',package.name,package.stat().st_size,'APK_NOT_BUILT')
          PY
      # The repo is public and the owner-provided art can be private.
      # GitHub Actions artifacts are NOT the private draft release.
      # Retain only encrypted bytes here; keep the ZIP plaintext only inside
      # this runner and the authenticated private draft release.
      - name: Encrypt verified content delta for recoverable CI backup
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          test -n "$KLUCZ"
          mkdir -p "$RUNNER_TEMP/mistrzowie-protected-delta"
          package=$(find unity-city/BraxContentBuild -maxdepth 1 -type f -name 'mistrzowie-u-*.braxupdate.zip' -print -quit)
          test -s "$package"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$package" \
            -out "$RUNNER_TEMP/mistrzowie-protected-delta/delta.braxupdate.zip.enc" -pass env:KLUCZ
          test -s "$RUNNER_TEMP/mistrzowie-protected-delta/delta.braxupdate.zip.enc"
          sha256sum "$RUNNER_TEMP/mistrzowie-protected-delta/delta.braxupdate.zip.enc" \
            > "$RUNNER_TEMP/mistrzowie-protected-delta/sha256.txt"
      - name: Save encrypted delta checkpoint in GitHub Actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-encrypted-delta-${{ steps.content_request.outputs.base }}-${{ github.run_id }}
          path: ${{ runner.temp }}/mistrzowie-protected-delta/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified cumulative .braxupdate.zip to private base draft
        env:
          GH_TOKEN: ${{ github.token }}
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          BASE_ID: ${{ steps.content_request.outputs.base }}
        run: |
          test "$(find unity-city/BraxContentBuild -maxdepth 1 -name 'mistrzowie-*.braxupdate.zip' -type f | wc -l)" -eq 1
          python3 unity-tools/updates/content_snapshot.py publish-update --base "$BASE_ID"
          echo '### Miasto Mistrzów — gotowa prywatna paczka .braxupdate.zip (bez budowania APK)' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve encrypted Unity import cache after content build
        id: content_cache_pack
        if: ${{ always() && !cancelled() && (steps.content_build.outcome == 'success' || steps.content_build.outcome == 'failure') }}
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          test -d unity-city/Library
          sudo chown -R "$(id -u):$(id -g)" unity-city/Library
          bash unity-tools/mistrzowie/library_cache.sh save unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
      - name: Store encrypted import cache for subsequent content-only updates
        if: ${{ always() && !cancelled() && steps.content_cache_pack.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-6000.0.85f2-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-content-${{ github.run_id }}-${{ github.run_attempt }}
