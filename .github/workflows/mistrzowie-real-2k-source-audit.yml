name: "Miasto Mistrzów — źródła T11 REAL (BEZ UNITY I APK)"
on:
  push:
    branches: [gpt/miasto-mistrzow-kasyno-t11-20261105]
    paths: [.github/workflows/mistrzowie-real-2k-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: champions-t11-real-2k-audit
  cancel-in-progress: false
jobs:
  validate-real-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-tools/mistrzowie/prepare_casino_textures_2k.py
            unity-tools/mistrzowie/prepare_casino_vegetation_2k.py
            unity-tools/mistrzowie/pack_casino_vegetation_glb.py
            unity-tools/mistrzowie/verify_real_t11_sources.py
            unity-tools/mistrzowie/test_native_vegetation_glb.py
      - name: Only Python and source images, NEVER Unity or Android build
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Validate lossless packer on test fixtures
        run: |
          python3 -m py_compile unity-tools/mistrzowie/*.py
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_native_vegetation_glb.py' -v
      - name: Download and embed exact Poly Haven original models
        run: python3 unity-tools/mistrzowie/prepare_casino_vegetation_2k.py
      - name: Download all 21 original PBR maps
        run: python3 unity-tools/mistrzowie/prepare_casino_textures_2k.py
      - name: Verify real GLB data, unchanged geometry and every 2K map
        run: python3 unity-tools/mistrzowie/verify_real_t11_sources.py
      - name: Save source-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: champions-t11-real-assets-audit
          path: mistrzowie-evidence/t11-real-source-audit.json
          retention-days: 10
          if-no-files-found: warn
      - name: Confirm no Unity/APK has started
        if: always()
        run: echo 'SOURCE AUDIT ONLY: UNITY_NOT_STARTED; APK_NOT_BUILT' >> "$GITHUB_STEP_SUMMARY"
