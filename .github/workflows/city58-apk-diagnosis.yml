name: City 58 - inspect existing APK (no Unity build)
on:
  push:
    branches: [codex/city58-startup-update-20261104]
    paths:
      - .github/workflows/city58-apk-diagnosis.yml
      - unity-tools/claude/check_apk_scene_bounds.py
  workflow_dispatch:
permissions:
  contents: write # GitHub requires push access to read a draft release.
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: unity-tools/claude/check_apk_scene_bounds.py
          sparse-checkout-cone-mode: false
      - name: Download the exact existing build 58 from its private draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p diagnostic
          gh release download claude-region-preview --repo "$GITHUB_REPOSITORY" --pattern braxhorn-miastogl-874f194.apk --dir diagnostic
          gh release download claude-region-preview --repo "$GITHUB_REPOSITORY" --pattern build-size-android-miastogl-874f194.txt --dir diagnostic
          echo '69592f179a12d2628dd77cbba7737d1cb35d8eea1842c200a65b7a3463b72e44  diagnostic/braxhorn-miastogl-874f194.apk' | sha256sum --check --strict
      - name: Verify ZIP and serialized scene ranges
        run: |
          set -o pipefail
          python3 unity-tools/claude/check_apk_scene_bounds.py diagnostic/braxhorn-miastogl-874f194.apk | tee diagnostic/scene-bounds.json
      - name: Package identity and certificate (public certificate, no private key)
        if: always()
        run: |
          sdk=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$sdk/apksigner" verify --print-certs diagnostic/braxhorn-miastogl-874f194.apk | tee diagnostic/certificate.txt
          "$sdk/aapt" dump badging diagnostic/braxhorn-miastogl-874f194.apk > diagnostic/badging.txt
          head -1 diagnostic/badging.txt | tee diagnostic/package.txt
          rm diagnostic/badging.txt
      - name: Run the unchanged ARM64 APK on an Android emulator for full logcat
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name city58 --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd city58 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 6144 -cores 4 > diagnostic/emulator.txt 2>&1 &
          booted=0
          for i in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then booted=1; break; fi
            sleep 3
          done
          [ "$booted" = 1 ] || { echo 'Emulator did not boot; runtime test inconclusive'; exit 1; }
          adb shell getprop ro.product.cpu.abilist | tee diagnostic/abis.txt
          grep -q arm64-v8a diagnostic/abis.txt || { echo 'No ARM64 translation; runtime test inconclusive'; exit 1; }
          adb shell input keyevent 82
          adb install diagnostic/braxhorn-miastogl-874f194.apk
          adb logcat -c
          adb shell monkey -p com.braxhorn.miastogl -c android.intent.category.LAUNCHER 1
          # The original build starts loading before START is tapped; capture that exact failure path.
          for i in $(seq 1 60); do
            sleep 3
            adb logcat -d -v threadtime > diagnostic/logcat.txt
            if grep -qE 'Position out of bounds|Fatal signal|FATAL EXCEPTION' diagnostic/logcat.txt; then break; fi
          done
          adb shell dumpsys activity exit-info com.braxhorn.miastogl > diagnostic/exit-info.txt
          adb shell pidof com.braxhorn.miastogl > diagnostic/pid.txt || true
          if grep -qE 'Position out of bounds|Fatal signal|FATAL EXCEPTION' diagnostic/logcat.txt; then
            echo 'Existing APK reproduced a runtime failure; inspect logcat.txt'
            exit 1
          fi
          echo 'Capture finished; a live process alone does not prove gameplay works.'
      - name: Retain diagnostic text only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city58-apk-diagnosis
          path: |
            diagnostic/*.json
            diagnostic/*.txt
          retention-days: 7
          if-no-files-found: warn
