name: Zone content - Unity Android bundle validation
on:
  push:
    branches: [codex/zone-content-updates-20261104]
    paths:
      - unity-city/Assets/**
      - unity-city/Packages/**
      - unity-tools/updates/**
      - .github/workflows/zone-content-validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: content-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [Android, StandaloneLinux64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            unity-city/Assets
            unity-city/Packages
            unity-city/ProjectSettings/ProjectVersion.txt
            unity-tools/updates
      - name: Isolated script-only project, no private source assets
        run: python3 unity-tools/updates/prepare_content_smoke.py
      - name: Compile scripts, build baseline and update Android bundles
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: content-smoke
          unityVersion: 6000.0.58f2
          targetPlatform: ${{ matrix.target }}
          buildMethod: BraxContentSmoke.Run
          versioning: None
          allowDirtyBuild: true
      - name: Validate success receipt
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/content-smoke/result.json').read_text())
          assert r['checks'] >= 12 and r['updateBytes'] < r['baselineBytes']
          print(json.dumps(r,indent=2))
          PY
      - name: Virtual display for Unity Linux player input and graphics
        if: matrix.target == 'StandaloneLinux64'
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Exercise actual player loading, import, restart and rollback
        if: matrix.target == 'StandaloneLinux64'
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11
          export XDG_CONFIG_HOME="$RUNNER_TEMP/brax-content-probe-config"
          sudo chown -R "$(id -u):$(id -g)" build/content-probe
          chmod +x build/content-probe/Probe.x86_64
          for mode in base stage update base stage interrupted rollback; do
            if ! timeout 110s xvfb-run -a -s "-screen 0 1280x720x24" build/content-probe/Probe.x86_64 -batchmode -force-glcore -screen-width 640 -screen-height 360 -probeMode "$mode" -probeZip "$PWD/build/content-probe/update.zip" -logFile "$RUNNER_TEMP/content-$mode.log"; then
              tail -120 "$RUNNER_TEMP/content-$mode.log"
              exit 1
            fi
            grep "BRAX_CONTENT_RUNTIME_PASS $mode" "$RUNNER_TEMP/content-$mode.log"
          done
      - name: Synthetic player diagnostics on failure
        if: failure() && matrix.target == 'StandaloneLinux64'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-content-probe
          path: |
            build/content-probe
            ${{ runner.temp }}/content-*.log
          retention-days: 1
      - name: Test receipt only (no game assets)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-smoke-receipt-${{ matrix.target }}
          path: build/content-smoke/result.json
          if-no-files-found: error
