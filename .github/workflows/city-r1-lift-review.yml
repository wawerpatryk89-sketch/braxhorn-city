name: R1 city continuation - physical lift baseline
on:
  push:
    branches: [codex/city-r1-continuation-20261029]
    paths:
      - .github/workflows/city-r1-lift-review.yml
      - unity-tools/city-rebuild/check_lift.mjs
permissions:
  contents: read
  actions: read
jobs:
  lift-route:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: unity-tools/city-rebuild
          persist-credentials: false
          lfs: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: wawerpatryk89-sketch/braxhorn-city
          run-id: 40946452434
          github-token: ${{ github.token }}
          name: city-access-player-58db7d5f6a25601c8120025f3153d0be8a5498a2
          path: unity-preview
      - name: Install browser for real Unity WebGL
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Physical lift route - initial lobby fixture only
        env:
          EXPECTED_BUILD_SHA: 58db7d5f6a25601c8120025f3153d0be8a5498a2
        run: node unity-tools/city-rebuild/check_lift.mjs
      - name: Preserve actual screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-lift-baseline-${{ github.sha }}
          path: city-lift-review/
          if-no-files-found: error
          retention-days: 14
