name: Issue30 audio final simple
on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/issue30-audio-final-simple.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout latest shared branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/miasto-mistrzow-kasyno-t11-20261105
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate and verify Issue 30 audio
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "BRAXHORN-CITY/Issue30" \
            "https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm" \
            -o /tmp/issue30-source.webm
          python3 unity-tools/mistrzowie/finalize_issue30_audio.py /tmp/issue30-source.webm
          python3 unity-tools/mistrzowie/prepare_champion_car_audio.py
          python3 unity-tools/mistrzowie/test_issue30_car_audio.py -v

      - name: Commit only Issue 30 audio
        env:
          BRANCH: gpt/miasto-mistrzow-kasyno-t11-20261105
        run: |
          set -euo pipefail
          git config user.name "wawerpatryk89-sketch"
          git config user.email "wawerpatryk89@gmail.com"
          git add \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg \
            unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/ATTRIBUTION.txt \
            unity-tools/mistrzowie/champion_car_audio_sources.json \
            unity-tools/mistrzowie/prepare_champion_car_audio.py \
            unity-tools/mistrzowie/test_issue30_car_audio.py
          python3 -c "import subprocess; c=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).split()); allowed={'unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg','unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg','unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/ATTRIBUTION.txt','unity-tools/mistrzowie/champion_car_audio_sources.json','unity-tools/mistrzowie/prepare_champion_car_audio.py','unity-tools/mistrzowie/test_issue30_car_audio.py'}; assert c<=allowed,(c-allowed); print('ISSUE30_SCOPE_PASS',sorted(c))"
          git commit -m "Issue 30: finalize verified full BRAXHORN engine audio"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
            if git push origin HEAD:"$BRANCH"; then
              echo "ISSUE30_AUDIO_PUSH_PASS"
              exit 0
            fi
            sleep 2
          done
          exit 1
