name: "Miasto Mistrzów A1+T11 — testy przed APK (BEZ UNITY)"
# Audit 06.11: verify source/Android texture dimensions and lossless 2K Poly Haven vegetation GLB.
# Never builds Android, never dispatches the actual game build, never changes
# quality gates, never deploys, uploads assets or moves a branch.
on:
  push:
    branches: [gpt/miasto-mistrzow-kasyno-t11-20261105]
    paths:
      - '.github/workflows/mistrzowie-a1-t11-test-before-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  code-preflight:
    if: github.ref == 'refs/heads/gpt/miasto-mistrzow-kasyno-t11-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets/BraxGymPlayer.cs
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
            public/assets/cars-src/car_rev.glb
            unity-city/Assets/Claude/
            unity-city/Assets/Editor/
            unity-city/Assets/City/
            unity-city/Assets/Mistrzowie/
            unity-city/Assets/Updates/
            unity-city/Assets/Source/Mistrzowie/
            unity-city/Assets/Source/Claude/Metro/metro_train.glb
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
            unity-city/Packages/manifest.json
            unity-tools/mistrzowie/
            unity-tools/validation/
            unity-tools/updates/
            unity-tools/claude/
            .github/workflows/mistrzowie-apk.yml
      - name: Install pinned dependencies for real source tests
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m pip install --disable-pip-version-check numpy==2.2.6 shapely==2.1.2 pillow==11.3.0
          echo "PYTHONPATH=$GITHUB_WORKSPACE/unity-tools/claude:$GITHUB_WORKSPACE/unity-tools/mistrzowie:$GITHUB_WORKSPACE/unity-tools/updates" >> "$GITHUB_ENV"
      - name: No-Unity static integration tests A1/T11
        run: python3 unity-tools/mistrzowie/test_a1_t11_before_apk.py
      - name: Python pipeline syntax
        run: |
          python3 -m compileall -q unity-tools/mistrzowie/
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_*.py' -v
          python3 -m py_compile unity-tools/mistrzowie/pack_casino_vegetation_glb.py unity-tools/mistrzowie/prepare_casino_vegetation_2k.py
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_native_vegetation_glb.py' -v
      - name: Pre-Unity C sharp syntax, scope and test APK quality-gate regression
        run: |
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_apk_quality_gate_regression.py' -v
      - name: Evidence — source tests only
        if: always()
        run: |
          printf 'A1/T11 preflight commit=%s\n' "$GITHUB_SHA"
          printf 'Android APK: NOT BUILT; signature: NO NEW SIGNATURE; phone: NOT TESTED.\n'
  source-release-preflight:
    # Reading GitHub draft releases requires contents:write for this token.
    # The job performs only GET requests; no release uploads or mutations.
    permissions:
      contents: write
    if: github.ref == 'refs/heads/gpt/miasto-mistrzow-kasyno-t11-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify original owner release assets exist (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The real APK pins this exact DRAFT release ID. A different tag
          # in the old static job wrongly reported the owner's files missing.
          export CHAMPIONS_OWNER_RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/435656828")"
          python3 - <<'PY_OWNER_RELEASE'
          import json,os
          data=json.loads(os.environ["CHAMPIONS_OWNER_RELEASE_JSON"])
          expected={"id":435656828, "tag_name":"champions-a1-20261105",
                    "target_commitish":"gpt/miasto-mistrzow-kasyno-t11-20261105",
                    "draft":True}
          for field,value in expected.items():
              if data.get(field)!=value:
                  raise SystemExit("A1/T11 owner release identity mismatch: "+field)
          original="BRAXHORN_MISTRZOWIE_A1_T11_ORIGINALY_DO_BUILD.zip"
          assets=[a for a in data.get("assets",[]) if a.get("name")==original]
          if len(assets)!=1 or assets[0].get("size",0)<=110000000:
              raise SystemExit("MISSING ORIGINAL OWNER SOURCE: "+original)
          print("A1_T11_OWNER_ASSETS_PRESENT pinned_draft_id=435656828 original="+original)
          print("Only presence validated; actual SHA-256 verification remains in APK preflight")
          PY_OWNER_RELEASE
