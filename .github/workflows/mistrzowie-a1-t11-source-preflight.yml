name: Miasto Mistrzow A1 T11 - preflight zrodel, BEZ Unity i APK

on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/mistrzowie-a1-t11-source-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    if: github.ref == 'refs/heads/gpt/miasto-mistrzow-kasyno-t11-20261105'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read only checkout without Unity Library or secrets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/mistrzowie-apk.yml
            .github/workflows/mistrzowie-a1-t11-source-preflight.yml
            unity-city/Assets
            unity-city/Packages
            unity-tools/mistrzowie
            unity-tools/validation
            unity-tools/updates
            unity-tools/claude
            public/assets/cars-src/car_rev.glb
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
      - name: Install offline parsing and unit test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m pip install --disable-pip-version-check pillow numpy matplotlib shapely
      - name: Check all C-sharp files syntax, local scopes, names
        run: python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Run offline Python regression tests
        run: |
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_*.py' -v
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
      - name: Check Python syntax
        run: python3 -m compileall -q unity-tools/mistrzowie unity-tools/validation unity-tools/updates
      - name: Verify original car_rev geometry and unchanged Git hash
        run: python3 unity-tools/mistrzowie/prepare_champion_car.py --dry-run
      - name: Check A1/T11 code and original Mixamo source paths before Unity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          assets = Path('unity-city/Assets')
          source = (assets/'Editor/Mistrzowie/BraxChampionsCarClips.cs').read_text()
          importer = Path('unity-tools/mistrzowie/import_brax_car_animations.py').read_text()
          workflow = Path('.github/workflows/mistrzowie-apk.yml').read_text()
          expected = 'Assets/Source/Mistrzowie/Brax/CarAnimations/'
          assert ('const string Source = "'+expected+'"') in source, 'Mixamo clip source directory mismatch'
          assert ('PREFIX = "'+expected+'"') in importer, 'Mixamo importer target mismatch'
          assert 'import_brax_car_animations.py' in workflow, 'Missing SHA-locked Mixamo source import'
          assert 'BRAXHORN_BRAX_3_ANIMACJE_MIXAMO_ORYGINALY.zip' in workflow, 'Missing 3-FBX owner archive'
          assert 'prepare_champion_car.py --dry-run' in workflow, 'Missing unchanged estate car preflight'
          brax = (assets/'Editor/Mistrzowie/BraxChampionsBrax.cs').read_text()
          assert 'BraxChampionsCarClips.Attach(hero, animation)' in brax
          car = (assets/'Mistrzowie/BraxChampionsCar.cs').read_text()
          for key in ('EnteringCar','Driving','ExitingCar','Physics.BoxCastNonAlloc'):
              assert key in car, 'Brax car runtime lacks '+key
          assert 'championsCar' in (assets/'BraxGymPlayer.cs').read_text()
          explorer = (assets/'Editor/Mistrzowie/BraxChampionsExplorer.cs').read_text()
          assert 'BraxChampionsCarBuilder.Generate(rig.transform)' in explorer
          showcase = (assets/'Editor/Mistrzowie/BraxChampionsBeltShowcase.cs').read_text()
          assert 'teak_veneer' in showcase and 'granite_tile' in showcase
          assert 'BRAXHORN_ARENA_CASE_PLAQUE.jpg' in showcase
          old = Path('unity-tools/mistrzowie/verify_previous_apk.py').read_text()
          assert '316045507' in old
          assert 'f3829d496e1bf4890ec64af78170c7e8b8696d1e49d4122df2b4fc1c80bd5ffe' in old
          print('A1_T11_SOURCE_PREFLIGHT_PASS WITHOUT UNITY APK OR SIGNING')
          PY
      - name: Issue 30 - acquire CC-BY engine recording and analyse source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issue30-car-audio
          SOURCE_URL="https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm"
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent "BRAXHORN-CITY/Issue30 source audit" \
            "$SOURCE_URL" -o issue30-car-audio/lada_1200l_engine_source.webm
          test "$(stat -c%s issue30-car-audio/lada_1200l_engine_source.webm)" -gt 6000000
          file issue30-car-audio/lada_1200l_engine_source.webm | tee issue30-car-audio/FILE_TYPES.txt
          grep -qiE 'WebM|video|audio' issue30-car-audio/FILE_TYPES.txt
          sha256sum issue30-car-audio/lada_1200l_engine_source.webm | tee issue30-car-audio/SOURCE_SHA256SUMS.txt

          ffmpeg -hide_banner -loglevel error -y \
            -i issue30-car-audio/lada_1200l_engine_source.webm \
            -vn -ac 1 -ar 22050 -c:a pcm_s16le issue30-car-audio/source_mono_22050.wav

          python3 - <<'PY'
          from pathlib import Path
          import wave, math, json
          root=Path("issue30-car-audio")
          wav=root/"source_mono_22050.wav"
          with wave.open(str(wav),"rb") as w:
              rate=w.getframerate(); n=w.getnframes(); raw=w.readframes(n)
          import numpy as np
          x=np.frombuffer(raw,dtype="<i2").astype(np.float32)/32768.0
          win=max(1,int(rate*.5))
          rows=[]
          for i in range(0,len(x),win):
              y=x[i:i+win]
              if len(y)<win//2: continue
              rms=float(np.sqrt(np.mean(y*y)+1e-12))
              peak=float(np.max(np.abs(y)))
              db=20*math.log10(max(rms,1e-9))
              rows.append((i/rate,(i+len(y))/rate,db,peak))
          (root/"RMS_HALFSECOND.tsv").write_text(
              "start_s\tend_s\trms_dbfs\tpeak\n"+
              "".join(f"{a:.2f}\t{b:.2f}\t{db:.2f}\t{pk:.5f}\n" for a,b,db,pk in rows))
          print("ISSUE30_AUDIO_DURATION_SECONDS",len(x)/rate)
          for row in rows:
              print("ISSUE30_AUDIO_RMS %.2f-%.2f %.2fdB peak=%.5f"%row)
          meta={
            "issue":30,
            "source_page":"https://commons.wikimedia.org/wiki/File:Starting_up_Lada_1200L_Zhiguli_Engine.webm",
            "source_url": "https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm",
            "title":"Starting up Lada 1200L Zhiguli Engine",
            "attribution":"Sounds of Changes; sound/photo/video: Antti Makkonen",
            "license":"CC BY 3.0 Unported",
            "license_url":"https://creativecommons.org/licenses/by/3.0/",
            "modification_plan":"derive short mono idle and rev clips for BRAXHORN vehicle audio; attribution retained",
            "source_bytes":(root/"lada_1200l_engine_source.webm").stat().st_size
          }
          (root/"SOURCE.json").write_text(json.dumps(meta,indent=2)+"\n")
          PY

      - name: Issue 30 - upload analysed engine source artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue30-car-audio-${{ github.sha }}
          path: issue30-car-audio
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Only report - no Unity, no APK and no physical collider changes
        if: always()
        run: |
          echo "Miasto Mistrzow A1 T11 - source preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "Source/static tests were run without Unity Editor or APK signing." >> "$GITHUB_STEP_SUMMARY"
          echo "All visual, route, physics/collision checks are advisory and require owner device review." >> "$GITHUB_STEP_SUMMARY"
          echo "The signed Android update identity must be checked before a real build." >> "$GITHUB_STEP_SUMMARY"
