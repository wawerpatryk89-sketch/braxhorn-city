name: Miasto Mistrzów — 45 krótkie testy, po kolei (BEZ APK)
run-name: Champions A1/T11/P1 — 45 independent short source checks — no Unity

on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/mistrzowie-sequential-short-audit-20261106.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mistrzowie-sequential-short-audit
  cancel-in-progress: false

jobs:
  short-sequential:
    name: Independent short test per module, report each failure
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout Champions code and static assets only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows
            unity-tools/mistrzowie
            unity-tools/validation
            unity-tools/updates
            unity-tools/claude
            unity-city/Assets/Editor
            unity-city/Assets/Mistrzowie
            unity-city/Assets/Claude
            unity-city/Assets/BraxGymPlayer.cs
            unity-city/Assets/City
            unity-city/Assets/CityAudio
            unity-city/Assets/CityRebuild/Systems
            unity-city/Assets/Kickboxing
            unity-city/Assets/Nutrition
            unity-city/Assets/Updates
            unity-city/Assets/Source/Claude/Metro/metro_train.glb
            unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json
            unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json.meta
            unity-city/Packages/manifest.json
            unity-city/ProjectSettings/ProjectVersion.txt
            public/assets/cars-src/car_rev.glb
            public/assets/chars/brax.glb.gz
            public/assets/tex/brax_color.webp
            public/assets/tex/brax_normal.webp
            public/assets/tex/brax_orm.webp
      - name: Dependencies for offline source checks only
        run: |
          python3 -m pip install -q --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m pip install -q --disable-pip-version-check numpy==2.2.6 shapely==2.1.2 pillow==11.3.0 matplotlib==3.10.7
      - name: Quick Python syntax before all modules
        run: python3 -m compileall -q unity-tools/mistrzowie unity-tools/validation unity-tools/updates
      - name: CSharp source scopes, does not compile Unity
        continue-on-error: true
        run: |
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Unity GUID preflight report
        continue-on-error: true
        run: |
          python3 unity-tools/validation/check_unity_meta_guids.py --champions
      - name: RUN ALL 45 TEST MODULES ONE BY ONE with individual timeout and evidence
        run: |
          python3 unity-tools/mistrzowie/audit_quick_sequential.py
      - name: Save every test log, even when errors are found
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540459e92b4886f43607fa02
        with:
          name: mistrzowie-sequential-source-qa-${{ github.run_id }}
          path: |
            mistrzowie-evidence/quick-sequential-audit.json
            mistrzowie-evidence/quick-sequential-audit.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Evidence scope
        if: always()
        run: |
          echo '45 independent source tests, short timeout each; no Unity, no APK, no release, no scene replacement.' >> "$GITHUB_STEP_SUMMARY"
