name: Miasto Mistrzów - krótki audyt metadanych i C# BEZ UNITY
run-name: Miasto Mistrzów A1+T11+P1 - szybka kontrola źródeł

# Owner forbids long tests. This job never calls Unity, Android, downloads assets,
# scene generation, private releases, build or other workflows.
on:
  push:
    branches: [gpt/miasto-mistrzow-kasyno-t11-20261105, gpt/miasto-mistrzow-hotel-sobczak-t03-20261108]
    paths:
      - .github/workflows/mistrzowie-cheap-code-audit-20261106.yml
      - unity-city/Assets/Editor/Mistrzowie/BraxChampionsCasinoPbr2K.cs
      - unity-city/Assets/Editor/Mistrzowie/BraxChampionsPoolP1Pbr2K.cs
      - unity-tools/mistrzowie/test_build18_recovery_and_delivery.py
      - unity-tools/mistrzowie/test_pool_p1_towels_uv.py
      - unity-tools/mistrzowie/test_hotel_sobczak_t03_contract.py
      - unity-city/Assets/Editor/Mistrzowie/BraxChampionsHotelSobczakT03.cs
      - unity-city/Assets/Editor/Mistrzowie/BraxChampionsHotelSobczakMaterials.cs
      - unity-city/Assets/Mistrzowie/BraxHotelSobczakFloorStreamer.cs
      - unity-tools/mistrzowie/repair_pool_p1_towels.py
      - unity-tools/mistrzowie/import_pool_p1_owner_assets.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Sparse checkout scripts and metadata only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-tools/validation
            unity-tools/mistrzowie/test_build18_recovery_and_delivery.py
            unity-tools/mistrzowie/test_pool_p1_towels_uv.py
            unity-tools/mistrzowie/test_hotel_sobczak_t03_contract.py
            unity-tools/mistrzowie/hotel_sobczak_t03_spec.json
            unity-tools/mistrzowie/plan_inventory.json
            unity-tools/mistrzowie/prepare_assets.py
            unity-tools/mistrzowie/repair_pool_p1_towels.py
            unity-tools/mistrzowie/import_pool_p1_owner_assets.py
            unity-tools/mistrzowie/prepare_casino_textures_2k.py
            unity-city/Assets/Editor
            unity-city/Assets/Mistrzowie
            unity-city/Assets/BraxGymPlayer.cs
            unity-city/Assets/City
            unity-city/Assets/CityAudio/BraxNovaMusic.cs
            unity-city/Assets/CityRebuild/Systems
            unity-city/Assets/Claude/*.cs
            unity-city/Assets/Claude/Runtime
            unity-city/Assets/Kickboxing/*.cs
            unity-city/Assets/Nutrition/*.cs
            unity-city/Assets/Updates/*.cs
            unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json
            unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json.meta
            .github/workflows/mistrzowie-apk.yml
            .github/workflows/mistrzowie-cheap-code-audit-20261106.yml
      - name: Verify Python source syntax and ALL checked-out Unity GUIDs
        run: |
          python3 -m py_compile unity-tools/validation/check_unity_meta_guids.py
          python3 unity-tools/validation/check_unity_meta_guids.py --champions
      - name: CSharp parser / local shadowing (never the Unity editor)
        run: |
          python3 -m pip install -q -r unity-tools/validation/requirements.txt
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Build 18 regression tests (source only, never Unity)
        run: |
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_build18_recovery_and_delivery.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_pool_p1_towels_uv.py' -v
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_hotel_sobczak_t03_contract.py' -v
      - name: Source-only report
        run: echo 'Szybka kontrola plików C# i .meta; nie wykonywano Unity, buildu APK ani testu telefonu.' >> "$GITHUB_STEP_SUMMARY"
