name: Issue 30 car audio finalizer - NO UNITY NO APK
on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/issue30-car-audio-verify-temp.yml

permissions:
  contents: write

concurrency:
  group: issue30-car-audio-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate and verify licensed engine audio
        run: |
          python3 unity-tools/mistrzowie/finalize_issue30_audio.py
          python3 unity-tools/mistrzowie/prepare_champion_car_audio.py
          python3 unity-tools/mistrzowie/test_issue30_car_audio.py -v

      - name: Commit Issue 30 audio only and remove temporary finalizer
        env:
          BRANCH: gpt/miasto-mistrzow-kasyno-t11-20261105
        run: |
          set -euo pipefail
          git config user.name "wawerpatryk89-sketch"
          git config user.email "wawerpatryk89@gmail.com"
          git rm -f .github/workflows/issue30-car-audio-verify-temp.yml
          git rm -f unity-tools/mistrzowie/finalize_issue30_audio.py
          git add unity-city/Assets/Source/Mistrzowie/Audio.meta
          git add unity-city/Assets/Source/Mistrzowie/Audio/BraxCar.meta
          git add unity-city/Assets/Source/Mistrzowie/Audio/BraxCar
          git add unity-tools/mistrzowie/champion_car_audio_sources.json
          git add unity-tools/mistrzowie/prepare_champion_car_audio.py
          git add unity-tools/mistrzowie/test_issue30_car_audio.py
          python3 -c "import subprocess; changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).split()); allowed=('.github/workflows/issue30-car-audio-verify-temp.yml','unity-tools/mistrzowie/finalize_issue30_audio.py','unity-tools/mistrzowie/champion_car_audio_sources.json','unity-tools/mistrzowie/prepare_champion_car_audio.py','unity-tools/mistrzowie/test_issue30_car_audio.py','unity-city/Assets/Source/Mistrzowie/Audio'); foreign=[p for p in changed if not any(p.startswith(a) for a in allowed)]; print('ISSUE30_SCOPE',sorted(changed)); assert not foreign, foreign"
          git commit -m "Issue 30: finalize full licensed BRAXHORN engine audio"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
