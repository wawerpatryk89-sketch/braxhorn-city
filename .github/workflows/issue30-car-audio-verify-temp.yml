name: Issue 30 car audio finalize — NO UNITY NO APK
on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/issue30-car-audio-verify-temp.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/miasto-mistrzow-kasyno-t11-20261105
          fetch-depth: 0
      - name: Guard Issue 30 code
        run: |
          set -euo pipefail
          test "$(git hash-object unity-city/Assets/Editor/Mistrzowie/BraxChampionsCarBuilder.cs)" = "24ac35fed738791ebe6d6686999ce6e19df8e887"
          test "$(git hash-object unity-city/Assets/Mistrzowie/BraxChampionsCar.cs)" = "3d23bd562a7180577f9e8279f91af5fc0a6dd579"
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Generate and verify final licensed audio
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors --user-agent "BRAXHORN-CITY/Issue30"             "https://upload.wikimedia.org/wikipedia/commons/3/33/Starting_up_Lada_1200L_Zhiguli_Engine.webm"             -o /tmp/issue30-source.webm
          python3 unity-tools/mistrzowie/finalize_issue30_audio.py /tmp/issue30-source.webm
          python3 unity-tools/mistrzowie/prepare_champion_car_audio.py
          python3 unity-tools/mistrzowie/test_issue30_car_audio.py -v
      - name: Commit exact Issue 30 scope and self-delete
        env:
          BRANCH: gpt/miasto-mistrzow-kasyno-t11-20261105
        run: |
          set -euo pipefail
          rm -f .github/workflows/issue30-car-audio-verify-temp.yml
          git config user.name "wawerpatryk89-sketch"
          git config user.email "wawerpatryk89@gmail.com"
          git add             unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_idle.ogg             unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/brax_engine_rev.ogg             unity-city/Assets/Source/Mistrzowie/Audio/BraxCar/ATTRIBUTION.txt             unity-tools/mistrzowie/champion_car_audio_sources.json             unity-tools/mistrzowie/prepare_champion_car_audio.py             unity-tools/mistrzowie/test_issue30_car_audio.py             unity-tools/mistrzowie/finalize_issue30_audio.py             .github/workflows/issue30-car-audio-verify-temp.yml
          git diff --cached --name-only
          git commit -m "Issue 30: finalize full licensed BRAXHORN engine audio"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin HEAD:"$BRANCH"
