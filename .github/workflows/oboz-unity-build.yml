name: Obóz — Unity 6 APK do testu

on:
  # Owner-requested start only; normal source commits do not build an APK.
  push:
    branches: [gpt/oboz, run/oboz-apk-20261105-0650]
    paths: [unity-tools/oboz/build-request.json, .github/workflows/oboz-unity-build.yml]
  workflow_dispatch:
    inputs:
      quality_review:
        description: Opcjonalny test Play Mode przed APK (wynik nie blokuje kompilacji)
        type: boolean
        default: false
      first_install:
        description: Pierwszy APK obozu, bez wcześniejszego potwierdzonego podpisu
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oboz-android-review
  cancel-in-progress: false

jobs:
  android-oboz:
    if: github.ref == 'refs/heads/gpt/oboz' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-realny-kompaktowy-20261105') || (github.event_name == 'push' && github.ref == 'refs/heads/run/oboz-apk-20261105-0650')
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # This job is EXCLUDED on codex/oboz-przebudowa-pbr-20261105.
      # Use oboz-content-base.yml or oboz-content-update.yml instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets/
            unity-city/Packages/
            unity-city/ProjectSettings/
            unity-city/apk-warianty.txt
            unity-tools/updates/
            unity-tools/validation/
            unity-tools/oboz/
      - name: Jawne zlecenie buildu z gałęzi obozu
        id: request
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FIRST_INSTALL: ${{ inputs.first_install }}
        run: python3 unity-tools/oboz/build_request.py
      # Fails before downloading Unity cache or importing models when owner
      # has not uploaded both original sources into the private DRAFT release.
      - name: Sprawdź prywatną dostawę modeli i byka przed Unity
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_release_assets.py preflight
      - name: C# syntax and local scopes before Unity (CS0136 regression)
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
          python3 -m unittest discover -s unity-tools/oboz -p 'test_training_compile.py' -v
          python3 -m unittest discover -s unity-tools/oboz/tests -p 'test_*.py' -v
      - name: Sprawdź narzędzia Androida przed kompilacją
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$SDK/build-tools"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$AAPT" && test -x "$AAPT"
          test -n "$SIGNER" && test -x "$SIGNER"
          "$AAPT" version
          "$SIGNER" version
          printf 'AAPT=%s\nSIGNER=%s\n' "$AAPT" "$SIGNER" >> "$GITHUB_ENV"
      - name: Sprawdzenie dostawy i sekretów przed importem Unity
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          LIC: ${{ secrets.UNITY_LICENSE }}
        run: |
          test -n "$KS" || { echo 'Brak stałego klucza podpisu APK'; exit 1; }
          test -n "$LIC" || { echo 'Brak licencji Unity'; exit 1; }
          python3 unity-tools/oboz/assets.py preflight
      - name: Poprzednia tożsamość APK i rosnący versionCode
        env:
          FIRST_INSTALL: ${{ steps.request.outputs.first_install }}
        run: |
          set -euo pipefail
          # Delivery uses the already existing draft. Fail before Unity if it is unavailable.
          DRAFT=$(gh release view oboz-review-latest --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          test "$DRAFT" = true || { echo 'Wydanie obozu musi pozostać draftem'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq 'oboz-review-latest' "$RUNNER_TEMP/release-tags.txt"; then
            gh release download oboz-review-latest --repo "$GITHUB_REPOSITORY" --pattern release-identity.json --dir "$RUNNER_TEMP/previous"
            python3 unity-tools/oboz/release_identity.py prepare --previous "$RUNNER_TEMP/previous/release-identity.json" --output unity-city/braxhorn.versioncode
          elif [ "$FIRST_INSTALL" = true ]; then
            python3 unity-tools/oboz/release_identity.py prepare --allow-first-install --output unity-city/braxhorn.versioncode
          else
            echo 'Brak poprzedniego APK obozu. Pierwsza instalacja wymaga jawnego first_install.'
            exit 1
          fi
      - name: Odszyfrowanie wyłącznie zasobów obozu i kontrola SHA-256
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/assets.py restore
      - name: Zweryfikowany import nowej prywatnej paczki 30 modeli i byka
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_release_assets.py restore
      - name: Zweryfikowane materiały Poly Haven dla obozu
        run: python3 unity-tools/oboz/public_materials.py
      - name: Spakuj PBR postaci (Monika 4K, pozostali 2K) — oryginały bez zmian
        if: github.ref != 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        # Packing is an optimization, not a compilation dependency. If this
        # step fails, the Unity authoring shader keeps original source maps.
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.0.0
          python3 -m unittest discover -s unity-tools/oboz -p 'test_pbr_pack.py' -v
          python3 unity-tools/oboz/pbr_pack.py
      - name: Zweryfikowane animacje ruchu Moniki
        if: github.ref != 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/motion_candidates.py
      - name: Oryginalny autobus osiedla — kopia do zatoki obozu
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/shared_bus.py
      - name: Te same zweryfikowane nagrania Pipera — bez ponownej generacji
        run: python3 unity-tools/oboz/restore_dialogue.py
      - name: Profil pamięci obozu
        id: profile
        run: python3 unity-tools/updates/unity_cache.py profile --zone oboz
      - name: Przywróć zaszyfrowaną Library obozu
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.profile.outputs.prefix }}
      - name: Trwała kopia Library przy braku wpisu w cache
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        run: python3 unity-tools/updates/durable_cache.py download --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Zgodna zaszyfrowana pamięć zakończonej próby obozu
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY_TEST_CACHE'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'unity-tools/updates')
          from unity_cache import profile
          from durable_cache import download,release_tag
          archive=Path(os.environ['RUNNER_TEMP'])/'oboz-library.tar.zst.enc'
          if not archive.exists():
              expected=profile(Path('unity-city'),'oboz','6000.0.58f2')
              tag=release_tag(expected,'refs/heads/codex/oboz-npc-life-20261104')
              download(os.environ['GITHUB_REPOSITORY'],tag,archive,expected)
          PY_TEST_CACHE
      - name: Sprawdź i odszyfruj cache
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          if [ -f "$RUNNER_TEMP/oboz-library.tar.zst.enc" ]; then
            if ! python3 unity-tools/updates/unity_cache.py restore --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"; then
              echo '::warning::Cache obozu odrzucony; nastąpi pełny import.'
            fi
          else
            echo 'BRAXHORN_PAMIEC_LIBRARY oboz=nie — pierwsze uruchomienie lub brak kopii'
          fi
      - name: Przywróć trwałe sceny i GUID poprzedniego obozu
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'unity-tools/oboz')
          from assets import digest
          previous=Path(os.environ['RUNNER_TEMP'])/'previous/release-identity.json'
          if not previous.exists():
              print('BRAXHORN_OBOZ_SCENA brak poprzedniego eksportu')
              sys.exit(0)
          data=json.loads(previous.read_text())
          if not data.get('worldSha256'):
              print('BRAXHORN_OBOZ_SCENA brak wcześniejszej kopii scen')
              sys.exit(0)
          tag=data['releaseTag']
          if tag!='oboz-review-latest' and not re.fullmatch(r'oboz-review-[0-9]+',tag): raise ValueError('Invalid prior release tag')
          folder=Path(os.environ['RUNNER_TEMP'])/'previous'
          asset=data.get('worldAssetName','oboz-world.tar.gz.enc')
          if not re.fullmatch(r'oboz-world(?:-[0-9]+-[0-9a-f]{7})?\.tar\.gz\.enc',asset): raise ValueError('Invalid world asset')
          subprocess.run(['gh','release','download',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',asset,'--dir',str(folder)],check=True)
          path=folder/asset
          if digest(path)!=data['worldSha256']: raise ValueError('World checksum mismatch')
          subprocess.run(['python3','unity-tools/oboz/world.py','restore','--archive',str(path)],check=True)
          PY
      - name: Rzeczywista scena, trasy i rotacja NPC bez APK
        id: life_review
        if: inputs.quality_review == true
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozCharacters.ReviewCampLife
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          enableGpu: true
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-202
          path: build/QualityReview/
          if-no-files-found: warn
      - name: Wynik ruchu, trafień, poleceń i pauzy
        if: inputs.quality_review == true
        continue-on-error: true
        run: |
          python3 - <<'PY_REVIEW'
          import json, os
          from pathlib import Path
          root=Path('build/CampLifeReview')
          nav=json.loads((root/'navigation-review.json').read_text())
          assert nav['complete'] and len(nav['routes'])==90 and all(p['complete'] for p in nav['routes'])
          assert nav['commit']==os.environ['GITHUB_SHA'] and not nav['phoneTested']
          r=json.loads((root/'camp-life-review.json').read_text())
          assert r['complete'] and r['playModeTested'] and not r['errors']
          assert not r['phoneTested'] and not r['appearanceApproved']
          assert r['commit']==os.environ['GITHUB_SHA'] and r['unity']=='6000.0.58f2'
          assert r['rounds']>=3 and r['orders']==2
          assert len(r['arenaRounds'])==3 and all(n>=1 for n in r['arenaRounds'])
          assert r['playerSparringStarted'] and r['playerSparringEnded'] and r['routineSuspendedForPlayer']
          assert len(r['playerSparringArenas'])==3 and all(r['playerSparringArenas'])
          assert r['bagStrikesDuringPlayerSparring']>=3
          assert r['bagStrikes']>=8 and r['sparringStrikes']>=6
          assert r['spokenLines']>=2 and r['contactSounds']==r['sparringStrikes']
          assert r['pauseDisplacement']<=.001 and r['pauseBagDegrees']<=.001
          assert len(r['frames'])>=500 and len(list(root.glob('*.png')))>=100
          print('Play Mode: trasy, rundy, trafienia, polecenia i pauza potwierdzone; wygląd wymaga oceny')
          poses=json.loads((root/'final-pose-review.json').read_text())
          assert poses['complete'] and len(poses['characters'])==7
          assert all(len(c['cases'])==14 for c in poses['characters'])
          PY_REVIEW
      - name: Obrazy i pomiary — bez prywatnych źródeł i APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camp-life-before-apk-${{ github.run_id }}
          path: |
            build/CampLifeReview/*.json
            build/CampLifeReview/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Stały podpis APK — bez wariantu debug
        env:
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > unity-city/braxhorn.keystore
          printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
      - name: Generowanie sceny i kompilacja tylko obozu
        id: unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozBuild.BuildAndroidReview
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true
      - name: Weryfikacja gotowego podpisu, pakietu i wersji APK
        id: apk_identity
        run: |
          set -euo pipefail
          test -x "$AAPT" && test -x "$SIGNER"
          # Unity's container writes this output as root; the runner owns release verification.
          sudo chown -R "$(id -u):$(id -g)" build/ObozAndroid
          VERSION=$(cat unity-city/braxhorn.versioncode)
          PREVIOUS=(--allow-first-install)
          if [ -f "$RUNNER_TEMP/previous/release-identity.json" ]; then PREVIOUS=(--previous "$RUNNER_TEMP/previous/release-identity.json"); fi
          python3 unity-tools/oboz/release_identity.py verify "${PREVIOUS[@]}" --version "$VERSION" --apk build/ObozAndroid/braxhorn-oboz.apk --aapt "$AAPT" --apksigner "$SIGNER" --output build/ObozAndroid/release-identity.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt=Path('build/ObozAndroid/release-identity.json')
          data=json.loads(receipt.read_text())
          data.update(sourceCommit=os.environ['GITHUB_SHA'], sourceRun=int(os.environ['GITHUB_RUN_ID']),
                      phoneTested=False, contentUpdatesReady=False)
          receipt.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Zachowaj zweryfikowany APK przed zapisem wydania
        id: apk_backup
        if: ${{ !cancelled() && steps.apk_identity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ObozAndroid/braxhorn-oboz.apk
            build/ObozAndroid/release-identity.json
            build/ObozAndroid/build-receipt.json
            build/ObozAndroid/scene-validation.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-272
          path: build/QualityReview/
          if-no-files-found: warn
      - name: Przygotuj istniejący APK także po błędzie kompilacji lub weryfikacji
        id: apk_rescue
        if: ${{ always() && steps.unity.outcome != 'skipped' && steps.unity.outcome != '' && (steps.apk_identity.outcome != 'success' || steps.apk_backup.outcome != 'success') }}
        continue-on-error: true
        env:
          UNITY_RESULT: ${{ steps.unity.outcome }}
          IDENTITY_RESULT: ${{ steps.apk_identity.outcome }}
          VERIFIED_BACKUP_RESULT: ${{ steps.apk_backup.outcome }}
        run: |
          set -euo pipefail
          if [ ! -f build/ObozAndroid/braxhorn-oboz.apk ]; then
            echo 'Nie powstał plik APK; dostępne pozostaną raporty błędu.'
            exit 0
          fi
          sudo chown -R "$(id -u):$(id -g)" build/ObozAndroid
          python3 - <<'PY_RESCUE'
          import hashlib, json, os, shutil
          from pathlib import Path
          source=Path('build/ObozAndroid/braxhorn-oboz.apk')
          folder=Path(os.environ['RUNNER_TEMP'])/'oboz-apk-rescue'
          folder.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, folder/source.name)
          digest=hashlib.sha256()
          with (folder/source.name).open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''): digest.update(block)
          report=dict(sourceCommit=os.environ['GITHUB_SHA'], sourceRun=int(os.environ['GITHUB_RUN_ID']),
                      apkSha256=digest.hexdigest(), sizeBytes=source.stat().st_size,
                      unityOutcome=os.environ['UNITY_RESULT'], identityOutcome=os.environ['IDENTITY_RESULT'],
                      verifiedBackupOutcome=os.environ['VERIFIED_BACKUP_RESULT'],
                      phoneTested=False, deliveryKind='diagnostic-apk-after-error',
                      note='Existing APK preserved after an error. Installation and runtime are not confirmed.')
          (folder/'apk-delivery-status.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('present=true\n')
          PY_RESCUE
      - name: Kopia APK po błędzie — do pobrania z jawnym statusem kontroli
        if: ${{ always() && steps.apk_rescue.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-apk-after-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oboz-apk-rescue/braxhorn-oboz.apk
            ${{ runner.temp }}/oboz-apk-rescue/apk-delivery-status.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Zapis niezmiennych plików APK do istniejącego draft release
        run: |
          python3 unity-tools/oboz/publish_apk.py \
            --folder build/ObozAndroid \
            --dialogue build/ObozAudio/camp-dialogue.zip \
            --world "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Zaszyfrowany zapis scen obozu
        id: world
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/world.py pack --archive "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Opcjonalny checkpoint po udostępnieniu APK
        if: ${{ steps.world.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 unity-tools/oboz/publish_apk.py --checkpoint-only \
            --folder build/ObozAndroid \
            --dialogue build/ObozAudio/camp-dialogue.zip \
            --world "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Usuń lokalne dane podpisu
        if: always()
        run: |
          rm -f unity-city/braxhorn.keystore unity-city/braxhorn.keystore.pass
          sed -i -E '/^[[:space:]]*(AndroidKeystorePass|AndroidKeyaliasPass):/d' unity-city/ProjectSettings/ProjectSettings.asset 2>/dev/null || true
      - name: Zapis pełnej zaszyfrowanej Library wraz z Bee
        id: save_cache
        if: ${{ !cancelled() && steps.unity.outcome != 'skipped' && steps.unity.outcome != '' }}
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/updates/unity_cache.py pack --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.save_cache.outputs.saved == 'true' }}
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Trwała kopia cache poza limitem Actions
        if: ${{ !cancelled() && steps.save_cache.outputs.saved == 'true' }}
        continue-on-error: true
        run: python3 unity-tools/updates/durable_cache.py upload --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Raport i logi z tego uruchomienia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ObozAndroid/*.json
            unity-city/Logs/
          if-no-files-found: ignore
          retention-days: 14
