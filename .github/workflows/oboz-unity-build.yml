name: Obóz — Unity 6 APK do testu

on:
  # Owner-requested start only; normal source commits do not build an APK.
  push:
    branches: [gpt/oboz, run/oboz-apk-20261105-0650]
    paths: [unity-tools/oboz/build-request.json, .github/workflows/oboz-unity-build.yml]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Dokładny 40-znakowy SHA do kontroli sceny; sprawdzany przed pobraniem zasobów"
        type: string
        required: false
        default: ""
      quality_review:
        description: "Na gałęzi obozu przebudowy: SAM TEST SCENY bez APK (true); false to zwykły tryb APK po osobnym poleceniu"
        type: boolean
        default: false
      first_install:
        description: Pierwszy APK obozu, bez wcześniejszego potwierdzonego podpisu
        type: boolean
        default: false
      content_action:
        description: "Obóz: preflight, eksport bazy lub aktualizacja z istniejącej bazy — BEZ APK"
        type: choice
        required: true
        options:
          - none
          - preflight
          - export-candidate
          - update-from-base
        default: none
      base_id:
        description: "Tylko update-from-base: oboz- plus 32 znaki z zatwierdzonego bazowego APK"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: oboz-android-review
  cancel-in-progress: false

jobs:
  android-oboz:
    if: github.ref == 'refs/heads/gpt/oboz' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-realny-kompaktowy-20261105') || (github.event_name == 'push' && github.ref == 'refs/heads/run/oboz-apk-20261105-0650') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105' && inputs.first_install != true && inputs.quality_review != true && (inputs.content_action == 'none' || inputs.content_action == ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Explicit manual signed update of Obóz APK #18; same com.braxhorn.oboz and key.
      # No first-install, no automatic source push trigger, no content-only ZIP.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitignore
            .github/workflows/
            tools/build_oboz_service_models.py
            unity-tools/claude/prywatne.py
            unity-city/Assets/
            unity-city/Packages/
            unity-city/ProjectSettings/
            unity-city/apk-warianty.txt
            unity-tools/updates/
            unity-tools/validation/
            unity-tools/oboz/
      - name: Jawne zlecenie buildu z gałęzi obozu
        id: request
        env:
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          FIRST_INSTALL: ${{ inputs.first_install }}
        run: python3 unity-tools/oboz/build_request.py
      # Fails before downloading Unity cache or importing models when owner
      # has not uploaded both original sources into the private DRAFT release.
      - name: Sprawdź prywatną dostawę modeli i byka przed Unity
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_release_assets.py preflight
      - name: Sprawdź prywatną paczkę oryginalnej siłowni 3D i opon PRZED Unity
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_extra_assets.py preflight
      - name: C# syntax and local scopes before Unity (CS0136 regression)
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
          python3 -m unittest discover -s unity-tools/oboz -p 'test_training_compile.py' -v
          python3 -m unittest discover -s unity-tools/oboz/tests -p 'test_*.py' -v
      - name: Sprawdź narzędzia Androida przed kompilacją
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$SDK/build-tools"
          AAPT=$(find "$SDK/build-tools" -type f -name aapt | sort -V | tail -1)
          SIGNER=$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$AAPT" && test -x "$AAPT"
          test -n "$SIGNER" && test -x "$SIGNER"
          "$AAPT" version
          "$SIGNER" version
          printf 'AAPT=%s\nSIGNER=%s\n' "$AAPT" "$SIGNER" >> "$GITHUB_ENV"
      - name: Sprawdzenie dostawy i sekretów przed importem Unity
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          LIC: ${{ secrets.UNITY_LICENSE }}
        run: |
          test -n "$KS" || { echo 'Brak stałego klucza podpisu APK'; exit 1; }
          test -n "$LIC" || { echo 'Brak licencji Unity'; exit 1; }
          python3 unity-tools/oboz/assets.py preflight
      - name: Poprzednia tożsamość APK i rosnący versionCode
        env:
          FIRST_INSTALL: ${{ steps.request.outputs.first_install }}
        run: |
          set -euo pipefail
          # Delivery uses the already existing draft. Fail before Unity if it is unavailable.
          DRAFT=$(gh release view oboz-review-latest --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          test "$DRAFT" = true || { echo 'Wydanie obozu musi pozostać draftem'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq 'oboz-review-latest' "$RUNNER_TEMP/release-tags.txt"; then
            gh release download oboz-review-latest --repo "$GITHUB_REPOSITORY" --pattern release-identity.json --dir "$RUNNER_TEMP/previous"
            python3 unity-tools/oboz/release_identity.py prepare --previous "$RUNNER_TEMP/previous/release-identity.json" --output unity-city/braxhorn.versioncode
          elif [ "$FIRST_INSTALL" = true ]; then
            python3 unity-tools/oboz/release_identity.py prepare --allow-first-install --output unity-city/braxhorn.versioncode
          else
            echo 'Brak poprzedniego APK obozu. Pierwsza instalacja wymaga jawnego first_install.'
            exit 1
          fi
      - name: Zweryfikuj poprzednie APK obozu bez sztywnego przypisania do #18
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        env:
          PREVIOUS: ${{ runner.temp }}/previous/release-identity.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          old=Path(os.environ["PREVIOUS"])
          if not old.is_file(): raise ValueError("Brak istniejącej tożsamości APK obozu — stop przed Unity")
          info=json.loads(old.read_text())
          if info.get("applicationId")!="com.braxhorn.oboz":
              raise ValueError("Niepoprawny identyfikator poprzedniego obozu")
          code=info.get("versionCode")
          if type(code) is not int or code<216024998:
              raise ValueError("Poprzedni APK obozu starszy niż zaakceptowana baza #18")
          certificate=info.get("signingCertificateSha256","")
          if not re.fullmatch(r"[0-9a-fA-F]{64}",certificate):
              raise ValueError("Brak niezmiennego certyfikatu podpisu bazowego APK")
          commit=info.get("sourceCommit","")
          if not re.fullmatch(r"[0-9a-fA-F]{40}",commit):
              raise ValueError("Nieprawidłowy SHA źródła poprzedniego APK")
          run=info.get("sourceRun")
          if type(run) is not int or run<=0:
              raise ValueError("Brak numeru oryginalnego runu poprzedniego APK")
          next_version=int(Path("unity-city/braxhorn.versioncode").read_text().strip())
          if next_version<=code:
              raise ValueError("Nowa wersja APK nie zwiększa versionCode")
          print("BRAXHORN_OBOZ_COMPATIBLE_BASE=PASS previousVersion="+str(code)+
                " newVersion="+str(next_version)+" source="+commit+
                " signedIdentity=present; APK signing match checked after compilation")
          PY
      - name: Odszyfrowanie wyłącznie zasobów obozu i kontrola SHA-256
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/assets.py restore
      - name: Oryginalny Blender 4.5 LTS z oficjalnym SHA256 — wymagany przez Grass Medium 4.4
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: |
          set -euo pipefail
          # Ubuntu 24.04 apt blender = 4.0.2. Owner Grass Medium originals have
          # BLENDER-v404 headers, i.e. Blender 4.4. Never open their real mesh
          # with an older forward-incompatible Blender and silently drop data.
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y zstd xz-utils libgl1 libxi6 libxrender1
          VERSION=4.5.15
          ARCHIVE="blender-${VERSION}-linux-x64.tar.xz"
          BASE="https://download.blender.org/release/Blender4.5"
          mkdir -p "$RUNNER_TEMP/oboz-blender"
          cd "$RUNNER_TEMP/oboz-blender"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
            --max-time 120 --output "blender-${VERSION}.sha256" "$BASE/blender-${VERSION}.sha256"
          python3 - <<'PY_SHA'
          from pathlib import Path
          import re
          filename="blender-4.5.15-linux-x64.tar.xz"
          records=Path("blender-4.5.15.sha256").read_text().splitlines()
          matches=[]
          for line in records:
              fields=line.split()
              if len(fields)>=2 and fields[-1].lstrip("*").split("/")[-1]==filename and re.fullmatch("[0-9a-fA-F]{64}",fields[0]):
                  matches.append(fields[0].lower())
          if len(matches)!=1:raise ValueError("Brak dokładnie jednej oficjalnej sumy SHA256 archiwum "+filename)
          if matches[0].lower()!="0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e":
              raise ValueError("Oficjalny Blender 4.5.15 SHA256 niezgodny ze sprawdzoną wersją; stop przed Unity")
          Path("blender-linux.sha256").write_text(matches[0]+"  "+filename+"\n")
          print("BRAXHORN_OBOZ_OFFICIAL_BLENDER_HASH_METADATA=PASS")
          PY_SHA
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
            --max-time 1200 --output "$ARCHIVE" "$BASE/$ARCHIVE"
          sha256sum --check blender-linux.sha256
          tar -xJf "$ARCHIVE"
          test -x "$PWD/blender-${VERSION}-linux-x64/blender"
          "$PWD/blender-${VERSION}-linux-x64/blender" --version | head -2
          echo "$PWD/blender-${VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Zweryfikowany import nowej prywatnej paczki 30 modeli i byka
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_release_assets.py restore
      - name: Eksport oryginalnych siatek Grass Medium 01/02 i szafki 4K — BEZ decymacji
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_blender_export.py
      - name: Przywróć prywatną siłownię 3D z atlasem 2K i opony właściciela
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/owner_extra_assets.py restore
      - name: Zabudowa obozu z desek i rzeczywistych wymiarów — bez atrap wyposażenia
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: |
          if ! blender --background --factory-startup --python tools/build_oboz_service_models.py -- --output unity-city/Assets/PlayableGenerated/Oboz/ServiceModels; then
            echo '::warning::OBÓZ: modele zabudowy nie zostały wygenerowane; brakujące obiekty trafią do raportu sceny'
          fi
      - name: Zweryfikowane materiały Poly Haven dla obozu
        run: python3 unity-tools/oboz/public_materials.py
      - name: Ciemna elewacja i białe kafelki murowanej łaźni — oryginalne Poly Haven 2K
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: python3 unity-tools/oboz/facility_public_materials.py
      - name: Kontrola prawdziwych modeli GLB, FBX i PBR przed Unity — bez APK
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/owner_geometry_preflight.py
      - name: Wskazane sosny i małe drzewa — autorskie LOD, bez LOD0 i APK
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/prepare_authorized_forest.py --invalidate-only
          ASSET_PYTHON="$(dirname "$(command -v blender)")/4.5/python/bin/python3.11"
          "$ASSET_PYTHON" -m ensurepip --upgrade
          # Exact existing tools/requirements-assets.txt versions; Blender
          # already supplies bpy. Source .blend files remain outside Assets.
          "$ASSET_PYTHON" -m pip install --disable-pip-version-check --no-deps \
            numpy==1.26.4 Pillow==13.0.0 pypng==0.20220715.0
          "$ASSET_PYTHON" unity-tools/oboz/prepare_authorized_forest.py \
            --blender "$(command -v blender)" \
            --work "$RUNNER_TEMP/oboz-authorized-forest" \
            --reports build/CampLifeReview
      - name: Spakuj PBR postaci (Monika 4K, pozostali 2K) — oryginały bez zmian
        if: github.ref != 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        # Packing is an optimization, not a compilation dependency. If this
        # step fails, the Unity authoring shader keeps original source maps.
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==12.0.0
          python3 -m unittest discover -s unity-tools/oboz -p 'test_pbr_pack.py' -v
          python3 unity-tools/oboz/pbr_pack.py
      # APK #18 restored the signed Idle/Walk/Run casual clips and owner's
      # Walk/Run/Jump; APK #19 skipped this step only on the rebuild branch.
      # CharacterManifest still references the original casual .anim files.
      # Restore verified originals on EVERY camp branch, never disable checking.
      - name: Przywroc animacje casual i Moniki (wymagane dla wszystkich 7 postaci)
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/motion_candidates.py
      - name: Sprawdz wszystkie klipy postaci PRZED uruchomieniem Unity
        run: |
          python3 - <<'PY_CLIPS'
          import json
          from pathlib import Path
          root=Path('unity-city')
          manifest=json.loads((root/'Assets/Editor/Oboz/CharacterManifest.json').read_text(encoding='utf-8'))
          missing=[]
          count=0
          for person in manifest['characters']:
              for clip in person.get('clips',[]):
                  rel=clip.get('path','')
                  p=root/rel if rel else root
                  count+=1
                  if not rel or not p.is_file() or p.stat().st_size==0:
                      missing.append(person['id']+':'+clip.get('name','?')+' -> '+rel)
          if missing:
              for item in missing:
                  print('::error::BRAXHORN_OBOZ_MISSING_ANIMATION '+item)
              raise SystemExit(1)
          print('BRAXHORN_OBOZ_ANIMATIONS_PREFLIGHT PASS characters='+str(len(manifest['characters']))+' clips='+str(count))
          PY_CLIPS
      - name: Oryginalny autobus osiedla — kopia do zatoki obozu
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/shared_bus.py
      - name: Te same zweryfikowane nagrania Pipera — bez ponownej generacji
        run: python3 unity-tools/oboz/restore_dialogue.py
      - name: Profil pamięci obozu
        id: profile
        run: python3 unity-tools/updates/unity_cache.py profile --zone oboz
      - name: Przywróć zaszyfrowaną Library obozu
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.profile.outputs.prefix }}
      - name: Trwała kopia Library przy braku wpisu w cache
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        run: python3 unity-tools/updates/durable_cache.py download --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Zgodna zaszyfrowana pamięć zakończonej próby obozu
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        run: |
          python3 - <<'PY_TEST_CACHE'
          import os,sys
          from pathlib import Path
          sys.path.insert(0,'unity-tools/updates')
          from unity_cache import profile
          from durable_cache import download,release_tag
          archive=Path(os.environ['RUNNER_TEMP'])/'oboz-library.tar.zst.enc'
          if not archive.exists():
              expected=profile(Path('unity-city'),'oboz','6000.0.58f2')
              tag=release_tag(expected,'refs/heads/codex/oboz-npc-life-20261104')
              download(os.environ['GITHUB_REPOSITORY'],tag,archive,expected)
          PY_TEST_CACHE
      - name: Sprawdź i odszyfruj cache
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          if [ -f "$RUNNER_TEMP/oboz-library.tar.zst.enc" ]; then
            if ! python3 unity-tools/updates/unity_cache.py restore --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"; then
              echo '::warning::Cache obozu odrzucony; nastąpi pełny import.'
            fi
          else
            echo 'BRAXHORN_PAMIEC_LIBRARY oboz=nie — pierwsze uruchomienie lub brak kopii'
          fi
      - name: Przywróć trwałe sceny i GUID poprzedniego obozu
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'unity-tools/oboz')
          from assets import digest
          previous=Path(os.environ['RUNNER_TEMP'])/'previous/release-identity.json'
          if not previous.exists():
              print('BRAXHORN_OBOZ_SCENA brak poprzedniego eksportu')
              sys.exit(0)
          data=json.loads(previous.read_text())
          if not data.get('worldSha256'):
              print('BRAXHORN_OBOZ_SCENA brak wcześniejszej kopii scen')
              sys.exit(0)
          tag=data['releaseTag']
          if tag!='oboz-review-latest' and not re.fullmatch(r'oboz-review-[0-9]+',tag): raise ValueError('Invalid prior release tag')
          folder=Path(os.environ['RUNNER_TEMP'])/'previous'
          asset=data.get('worldAssetName','oboz-world.tar.gz.enc')
          if not re.fullmatch(r'oboz-world(?:-[0-9]+-[0-9a-f]{7})?\.tar\.gz\.enc',asset): raise ValueError('Invalid world asset')
          subprocess.run(['gh','release','download',tag,'--repo',os.environ['GITHUB_REPOSITORY'],'--pattern',asset,'--dir',str(folder)],check=True)
          path=folder/asset
          if digest(path)!=data['worldSha256']: raise ValueError('World checksum mismatch')
          subprocess.run(['python3','unity-tools/oboz/world.py','restore','--archive',str(path)],check=True)
          PY
      - name: Rzeczywista scena, trasy i rotacja NPC bez APK
        id: life_review
        if: inputs.quality_review == true
        continue-on-error: true
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozCharacters.ReviewCampLife
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          enableGpu: true
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-202
          path: build/QualityReview/
          if-no-files-found: warn
      - name: Wynik ruchu, trafień, poleceń i pauzy
        if: inputs.quality_review == true
        continue-on-error: true
        run: |
          python3 - <<'PY_REVIEW'
          import json, os
          from pathlib import Path
          root=Path('build/CampLifeReview')
          nav=json.loads((root/'navigation-review.json').read_text())
          assert nav['complete'] and len(nav['routes'])==90 and all(p['complete'] for p in nav['routes'])
          assert nav['commit']==os.environ['GITHUB_SHA'] and not nav['phoneTested']
          r=json.loads((root/'camp-life-review.json').read_text())
          assert r['complete'] and r['playModeTested'] and not r['errors']
          assert not r['phoneTested'] and not r['appearanceApproved']
          assert r['commit']==os.environ['GITHUB_SHA'] and r['unity']=='6000.0.58f2'
          assert r['rounds']>=3 and r['orders']==2
          assert len(r['arenaRounds'])==3 and all(n>=1 for n in r['arenaRounds'])
          assert r['playerSparringStarted'] and r['playerSparringEnded'] and r['routineSuspendedForPlayer']
          assert len(r['playerSparringArenas'])==3 and all(r['playerSparringArenas'])
          assert r['bagStrikesDuringPlayerSparring']>=3
          assert r['bagStrikes']>=8 and r['sparringStrikes']>=6
          assert r['spokenLines']>=2 and r['contactSounds']==r['sparringStrikes']
          assert r['pauseDisplacement']<=.001 and r['pauseBagDegrees']<=.001
          assert len(r['frames'])>=500 and len(list(root.glob('*.png')))>=100
          print('Play Mode: trasy, rundy, trafienia, polecenia i pauza potwierdzone; wygląd wymaga oceny')
          poses=json.loads((root/'final-pose-review.json').read_text())
          assert poses['complete'] and len(poses['characters'])==7
          assert all(len(c['cases'])==14 for c in poses['characters'])
          PY_REVIEW
      - name: Obrazy i pomiary — bez prywatnych źródeł i APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: camp-life-before-apk-${{ github.run_id }}
          path: |
            build/CampLifeReview/*.json
            build/CampLifeReview/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Stały podpis APK — bez wariantu debug
        env:
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > unity-city/braxhorn.keystore
          printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
      - name: Generowanie sceny i kompilacja tylko obozu
        id: unity
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozBuild.BuildAndroidReview
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true
      - name: Weryfikacja gotowego podpisu, pakietu i wersji APK
        id: apk_identity
        run: |
          set -euo pipefail
          test -x "$AAPT" && test -x "$SIGNER"
          # Unity's container writes this output as root; the runner owns release verification.
          sudo chown -R "$(id -u):$(id -g)" build/ObozAndroid
          VERSION=$(cat unity-city/braxhorn.versioncode)
          PREVIOUS=(--allow-first-install)
          if [ -f "$RUNNER_TEMP/previous/release-identity.json" ]; then PREVIOUS=(--previous "$RUNNER_TEMP/previous/release-identity.json"); fi
          python3 unity-tools/oboz/release_identity.py verify "${PREVIOUS[@]}" --version "$VERSION" --apk build/ObozAndroid/braxhorn-oboz.apk --aapt "$AAPT" --apksigner "$SIGNER" --output build/ObozAndroid/release-identity.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          receipt=Path('build/ObozAndroid/release-identity.json')
          data=json.loads(receipt.read_text())
          data.update(sourceCommit=os.environ['GITHUB_SHA'], sourceRun=int(os.environ['GITHUB_RUN_ID']),
                      phoneTested=False, contentUpdatesReady=False)
          receipt.write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Zachowaj zweryfikowany APK przed zapisem wydania
        id: apk_backup
        if: ${{ !cancelled() && steps.apk_identity.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ObozAndroid/braxhorn-oboz.apk
            build/ObozAndroid/release-identity.json
            build/ObozAndroid/build-receipt.json
            build/ObozAndroid/scene-validation.json
            build/ObozAndroid/collider-review.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Raport jakości do ręcznej oceny (nie blokuje APK)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-review-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}-272
          path: |
            build/QualityReview/
            build/CampLifeReview/forest-*.json
            build/CampLifeReview/forest-*.log
            build/CampLifeReview/tree-lod-grounding.json
            build/CampLifeReview/authorized-tree-scene.json
            build/CampLifeReview/grass-grounding.json
          if-no-files-found: warn
      - name: Przygotuj istniejący APK także po błędzie kompilacji lub weryfikacji
        id: apk_rescue
        if: ${{ always() && steps.unity.outcome != 'skipped' && steps.unity.outcome != '' && (steps.apk_identity.outcome != 'success' || steps.apk_backup.outcome != 'success') }}
        continue-on-error: true
        env:
          UNITY_RESULT: ${{ steps.unity.outcome }}
          IDENTITY_RESULT: ${{ steps.apk_identity.outcome }}
          VERIFIED_BACKUP_RESULT: ${{ steps.apk_backup.outcome }}
        run: |
          set -euo pipefail
          if [ ! -f build/ObozAndroid/braxhorn-oboz.apk ]; then
            echo 'Nie powstał plik APK; dostępne pozostaną raporty błędu.'
            exit 0
          fi
          sudo chown -R "$(id -u):$(id -g)" build/ObozAndroid
          python3 - <<'PY_RESCUE'
          import hashlib, json, os, shutil
          from pathlib import Path
          source=Path('build/ObozAndroid/braxhorn-oboz.apk')
          folder=Path(os.environ['RUNNER_TEMP'])/'oboz-apk-rescue'
          folder.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, folder/source.name)
          digest=hashlib.sha256()
          with (folder/source.name).open('rb') as stream:
              for block in iter(lambda:stream.read(1024*1024),b''): digest.update(block)
          report=dict(sourceCommit=os.environ['GITHUB_SHA'], sourceRun=int(os.environ['GITHUB_RUN_ID']),
                      apkSha256=digest.hexdigest(), sizeBytes=source.stat().st_size,
                      unityOutcome=os.environ['UNITY_RESULT'], identityOutcome=os.environ['IDENTITY_RESULT'],
                      verifiedBackupOutcome=os.environ['VERIFIED_BACKUP_RESULT'],
                      phoneTested=False, deliveryKind='diagnostic-apk-after-error',
                      note='Existing APK preserved after an error. Installation and runtime are not confirmed.')
          (folder/'apk-delivery-status.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('present=true\n')
          PY_RESCUE
      - name: Kopia APK po błędzie — do pobrania z jawnym statusem kontroli
        if: ${{ always() && steps.apk_rescue.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-apk-after-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oboz-apk-rescue/braxhorn-oboz.apk
            ${{ runner.temp }}/oboz-apk-rescue/apk-delivery-status.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Zapis niezmiennych plików APK do istniejącego draft release
        # The signed and verified APK is already saved as a downloadable
        # workflow artifact; GitHub Release upload errors are not compile
        # errors and must not fail the job after the long Unity build.
        if: ${{ steps.apk_backup.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 unity-tools/oboz/publish_apk.py \
            --folder build/ObozAndroid \
            --dialogue build/ObozAudio/camp-dialogue.zip \
            --world "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Zaszyfrowany zapis scen obozu
        id: world
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/world.py pack --archive "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Opcjonalny checkpoint po udostępnieniu APK
        if: ${{ steps.world.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 unity-tools/oboz/publish_apk.py --checkpoint-only \
            --folder build/ObozAndroid \
            --dialogue build/ObozAudio/camp-dialogue.zip \
            --world "$RUNNER_TEMP/oboz-world.tar.gz.enc"
      - name: Usuń lokalne dane podpisu
        if: always()
        run: |
          rm -f unity-city/braxhorn.keystore unity-city/braxhorn.keystore.pass
          sed -i -E '/^[[:space:]]*(AndroidKeystorePass|AndroidKeyaliasPass):/d' unity-city/ProjectSettings/ProjectSettings.asset 2>/dev/null || true
      - name: Zapis pełnej zaszyfrowanej Library wraz z Bee
        id: save_cache
        if: ${{ !cancelled() && steps.unity.outcome != 'skipped' && steps.unity.outcome != '' }}
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/updates/unity_cache.py pack --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.save_cache.outputs.saved == 'true' }}
        continue-on-error: true
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Trwała kopia cache poza limitem Actions
        if: ${{ !cancelled() && steps.save_cache.outputs.saved == 'true' }}
        continue-on-error: true
        run: python3 unity-tools/updates/durable_cache.py upload --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Raport i logi z tego uruchomienia
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ObozAndroid/*.json
            build/CampLifeReview/navigation-review.json
            build/QualityReview/*.json
            unity-city/Logs/
          if-no-files-found: ignore
          retention-days: 14

  oboz-scene-only:
    name: "OBÓZ TRENINGOWY — pełna scena Unity 6 bez APK"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105' && inputs.quality_review == true && (inputs.content_action == 'none' || inputs.content_action == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pobierz wyłącznie źródła obozu z dokładnego SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitignore
            .github/workflows/
            tools/
            unity-city/Assets/
            unity-city/Packages/
            unity-city/ProjectSettings/
            unity-city/apk-warianty.txt
            unity-tools/claude/prywatne.py
            unity-tools/updates/
            unity-tools/validation/
            unity-tools/oboz/
      - name: Sprawdź oryginalne zasoby, bez kompilacji APK
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/oboz-przebudowa-pbr-20261105"
          python3 - <<'PY_REVISION'
          import os,re,subprocess
          expected=os.environ.get('EXPECTED_SHA','')
          actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}',expected):
              raise SystemExit('OBÓZ: tryb sceny wymaga dokładnego expected_sha')
          if actual!=expected or os.environ['GITHUB_SHA']!=expected:
              raise SystemExit('OBÓZ: SHA gałęzi zmienił się; scena nie zostanie uruchomiona')
          print('OBÓZ TRENINGOWY — dokładna rewizja sceny: '+actual)
          PY_REVISION
          python3 unity-tools/oboz/assets.py preflight
          python3 unity-tools/oboz/owner_release_assets.py preflight
          python3 unity-tools/oboz/owner_extra_assets.py preflight
          python3 -m unittest discover -s unity-tools/oboz/tests -p 'test_*.py' -q
      - name: Odszyfruj i zweryfikuj tylko oryginalne źródła obozu
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/assets.py restore
      - name: Oryginalny Blender 4.5 LTS z oficjalnym SHA256 — wymagany przez Grass Medium 4.4
        if: github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
        run: |
          set -euo pipefail
          # Ubuntu 24.04 apt blender = 4.0.2. Owner Grass Medium originals have
          # BLENDER-v404 headers, i.e. Blender 4.4. Never open their real mesh
          # with an older forward-incompatible Blender and silently drop data.
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y zstd xz-utils libgl1 libxi6 libxrender1
          VERSION=4.5.15
          ARCHIVE="blender-${VERSION}-linux-x64.tar.xz"
          BASE="https://download.blender.org/release/Blender4.5"
          mkdir -p "$RUNNER_TEMP/oboz-blender"
          cd "$RUNNER_TEMP/oboz-blender"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
            --max-time 120 --output "blender-${VERSION}.sha256" "$BASE/blender-${VERSION}.sha256"
          python3 - <<'PY_SHA'
          from pathlib import Path
          import re
          filename="blender-4.5.15-linux-x64.tar.xz"
          records=Path("blender-4.5.15.sha256").read_text().splitlines()
          matches=[]
          for line in records:
              fields=line.split()
              if len(fields)>=2 and fields[-1].lstrip("*").split("/")[-1]==filename and re.fullmatch("[0-9a-fA-F]{64}",fields[0]):
                  matches.append(fields[0].lower())
          if len(matches)!=1:raise ValueError("Brak dokładnie jednej oficjalnej sumy SHA256 archiwum "+filename)
          if matches[0].lower()!="0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e":
              raise ValueError("Oficjalny Blender 4.5.15 SHA256 niezgodny ze sprawdzoną wersją; stop przed Unity")
          Path("blender-linux.sha256").write_text(matches[0]+"  "+filename+"\n")
          print("BRAXHORN_OBOZ_OFFICIAL_BLENDER_HASH_METADATA=PASS")
          PY_SHA
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
            --max-time 1200 --output "$ARCHIVE" "$BASE/$ARCHIVE"
          sha256sum --check blender-linux.sha256
          tar -xJf "$ARCHIVE"
          test -x "$PWD/blender-${VERSION}-linux-x64/blender"
          "$PWD/blender-${VERSION}-linux-x64/blender" --version | head -2
          echo "$PWD/blender-${VERSION}-linux-x64" >> "$GITHUB_PATH"
      - name: Oryginalne GLB, roślinność, kuchnia i siłownia
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/owner_release_assets.py restore
          python3 unity-tools/oboz/owner_blender_export.py
          python3 unity-tools/oboz/owner_extra_assets.py restore
          if ! blender --background --factory-startup --python tools/build_oboz_service_models.py -- --output unity-city/Assets/PlayableGenerated/Oboz/ServiceModels; then
            echo '::warning::OBÓZ: modele zabudowy nie zostały wygenerowane; brakujące obiekty trafią do raportu sceny'
          fi
          python3 unity-tools/oboz/public_materials.py
          python3 unity-tools/oboz/facility_public_materials.py
          python3 unity-tools/oboz/motion_candidates.py
          python3 unity-tools/oboz/shared_bus.py
          python3 unity-tools/oboz/restore_dialogue.py
          python3 unity-tools/oboz/owner_geometry_preflight.py
      - name: Wskazane sosny i małe drzewa — autorskie LOD, bez LOD0 i APK
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/prepare_authorized_forest.py --invalidate-only
          ASSET_PYTHON="$(dirname "$(command -v blender)")/4.5/python/bin/python3.11"
          "$ASSET_PYTHON" -m ensurepip --upgrade
          # Exact existing tools/requirements-assets.txt versions; Blender
          # already supplies bpy. Source .blend files remain outside Assets.
          "$ASSET_PYTHON" -m pip install --disable-pip-version-check --no-deps \
            numpy==1.26.4 Pillow==13.0.0 pypng==0.20220715.0
          "$ASSET_PYTHON" unity-tools/oboz/prepare_authorized_forest.py \
            --blender "$(command -v blender)" \
            --work "$RUNNER_TEMP/oboz-authorized-forest" \
            --reports build/CampLifeReview
      - name: Zweryfikuj C# przed Unity
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Profil zaszyfrowanego cache Unity obozu
        id: profile
        run: python3 unity-tools/updates/unity_cache.py profile --zone oboz
      - name: Odczytaj cache obozu, jeśli istnieje
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.profile.outputs.prefix }}
      - name: Odczytaj zgodną trwałą kopię importów obozu, gdy Actions nie ma wpisu
        if: ${{ steps.cache.outputs.cache-matched-key == '' }}
        continue-on-error: true
        run: python3 unity-tools/updates/durable_cache.py download --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Odszyfruj zgodne cache, jeśli występuje
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          if [ -f "$RUNNER_TEMP/oboz-library.tar.zst.enc" ]; then
            python3 unity-tools/updates/unity_cache.py restore --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
          fi
      - name: Unity 6 — wygeneruj i sprawdź scenę BEZ BuildPlayer
        id: scene
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozSceneAudit.GenerateWithoutApk
          # Synchronous generation returns normally; keep -quit or the editor
          # waits until the four-hour timeout after writing a valid report.
          manualExit: false
          versioning: None
          allowDirtyBuild: true
      - name: Raport pełnej sceny, bez APK — jakość tylko ostrzega
        if: steps.scene.outcome == 'success'
        run: |
          set -euo pipefail
          test -s audit/oboz-scena.json
          test -s audit/oboz-scena.md
          test -s audit/oboz-diagnostyka.json
          test ! -e build/ObozAndroid/braxhorn-oboz.apk
          python3 - <<'PY_SCENE'
          import json,os
          from pathlib import Path
          r=json.loads(Path("audit/oboz-scena.json").read_text(encoding="utf-8"))
          assert r['revision']==os.environ['GITHUB_SHA']
          assert r['unitySceneInspected'] and not r['apkBuilt'] and not r['phoneVerified']
          counts={k:r[k] for k in ('renderers','levitating','embedded','missingGroundRay','expectedMounted')}
          diagnostics=json.loads(Path('audit/oboz-diagnostyka.json').read_text(encoding='utf-8'))
          print("OBÓZ TRENINGOWY — scene-only:", counts)
          print('Ostrzeżenia generatora:',diagnostics['warningCount'],'; błędy:',diagnostics['errorCount'])
          for k in ('levitating','embedded','missingGroundRay'):
              if counts[k]:print("::warning::OBÓZ SCENA %s=%s (pełna lista w JSON)"%(k,counts[k]))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write("# OBÓZ TRENINGOWY — SCENA, bez APK\n")
              f.write("SHA: "+r["revision"]+"\n\n")
              f.write("Kontrola Unity: "+str(counts)+"\n\n")
              f.write('Ostrzeżenia generatora: '+str(diagnostics['warningCount'])+'; błędy: '+str(diagnostics['errorCount'])+'\n\n')
              f.write("APK=NOT_BUILT; PHONE=NOT_TESTED; OWNER_APPROVAL=PENDING\n")
          PY_SCENE
      - name: Zapisz zaszyfrowane importy po przebiegu sceny
        id: save_scene_cache
        if: ${{ !cancelled() && steps.scene.outcome == 'success' }}
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/updates/unity_cache.py pack --zone oboz --archive "$RUNNER_TEMP/oboz-library.tar.zst.enc"
      - name: Zachowaj nowy wpis pamięci sceny obozu
        if: ${{ !cancelled() && steps.save_scene_cache.outputs.saved == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ${{ runner.temp }}/oboz-library.tar.zst.enc
            ${{ runner.temp }}/oboz-library.tar.zst.enc.json
          key: ${{ steps.profile.outputs.prefix }}${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Tylko tekstowe dowody kontroli obozu — bez zdjęć i APK
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-scena-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit/oboz-scena.json
            audit/oboz-scena.md
            audit/oboz-wejscia-kolizje.json
            audit/oboz-regresje-jednostek.json
            audit/oboz-krok-postaci.json
            audit/oboz-diagnostyka.json
            build/QualityReview/*.json
            unity-city/Logs/
            build/CampLifeReview/navigation-review.json
            build/CampLifeReview/forest-*.json
            build/CampLifeReview/forest-*.log
            build/CampLifeReview/tree-lod-grounding.json
            build/CampLifeReview/authorized-tree-scene.json
            build/CampLifeReview/grass-grounding.json
          if-no-files-found: warn
          retention-days: 14

  oboz-content-only:
    name: "Obóz — kontrola i baza Addressables, bez APK"
    # This workflow already exists on the repository's default branch, so
    # manual dispatch can select the owner remodel branch without merging.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105' && (inputs.content_action == 'preflight' || inputs.content_action == 'export-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Source checkout — immutable owner remodel branch only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitignore
            .github/workflows/
            tools/
            unity-tools/claude/prywatne.py
            unity-city/Assets/
            unity-city/Packages/
            unity-city/ProjectSettings/
            unity-city/apk-warianty.txt
            unity-tools/oboz/
            unity-tools/updates/
            unity-tools/validation/
      - name: Verify owner-delivered models before expensive Unity work
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/oboz-przebudowa-pbr-20261105"
          test -n "$KLUCZ" || { echo "::error::Brak klucza szyfrowania dostawy"; exit 1; }
          python3 unity-tools/oboz/owner_release_assets.py preflight
          python3 unity-tools/oboz/assets.py preflight
          python3 -m unittest discover -s unity-tools/oboz/tests -p 'test_*.py' -v
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
          python3 -m py_compile unity-tools/oboz/owner_assets_intake.py unity-tools/oboz/owner_release_assets.py unity-tools/oboz/content_candidate.py
      - name: Stop here for requested quick preflight
        if: inputs.content_action == 'preflight'
        run: |
          echo "BRAXHORN_OBOZ_PREFLIGHT=PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Unity nie uruchomione, APK nie budowano; zawartość z release nie została jeszcze odszyfrowana." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify Unity source scripts and prevent accidental standalone Android build
        if: inputs.content_action == 'export-candidate'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
          test -f unity-city/Assets/Editor/Oboz/BraxObozContentBase.cs
          test -f unity-city/Assets/Updates/BraxContent.cs
          test -f unity-city/Assets/Editor/Updates/BraxContentBuild.cs
          test ! -e unity-city/BraxContentBuild/base/manifest.json
          test ! -e unity-city/Assets/Resources/BraxContentBase.json
      - name: Restore only encrypted private camp sources and verify original content SHA256
        if: inputs.content_action == 'export-candidate'
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          python3 unity-tools/oboz/assets.py restore
          python3 unity-tools/oboz/owner_release_assets.py restore
          python3 unity-tools/oboz/public_materials.py
          python3 unity-tools/oboz/shared_bus.py
          python3 unity-tools/oboz/restore_dialogue.py
      - name: Przywroc animacje casual i Moniki (wymagane dla wszystkich 7 postaci)
        if: inputs.content_action == 'export-candidate'
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/oboz/motion_candidates.py
      - name: Sprawdz wszystkie klipy postaci PRZED uruchomieniem Unity
        if: inputs.content_action == 'export-candidate'
        run: |
          python3 - <<'PY_CLIPS'
          import json
          from pathlib import Path
          root=Path('unity-city')
          manifest=json.loads((root/'Assets/Editor/Oboz/CharacterManifest.json').read_text(encoding='utf-8'))
          missing=[]
          count=0
          for person in manifest['characters']:
              for clip in person.get('clips',[]):
                  rel=clip.get('path','')
                  p=root/rel if rel else root
                  count+=1
                  if not rel or not p.is_file() or p.stat().st_size==0:
                      missing.append(person['id']+':'+clip.get('name','?')+' -> '+rel)
          if missing:
              for item in missing:
                  print('::error::BRAXHORN_OBOZ_MISSING_ANIMATION '+item)
              raise SystemExit(1)
          print('BRAXHORN_OBOZ_ANIMATIONS_PREFLIGHT PASS characters='+str(len(manifest['characters']))+' clips='+str(count))
          PY_CLIPS
      - name: Check Unity license and free runner space before importing assets
        if: inputs.content_action == 'export-candidate'
        env:
          LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          test -n "$LICENSE" || { echo "::error::Brak licencji Unity"; exit 1; }
          df -h .
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h .
      - name: Compile actual Android SAF import picker; still no APK
        if: inputs.content_action == 'export-candidate'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash -v "$PWD:/project" \
            unityci/editor:ubuntu-6000.0.58f2-android-3 \
            /project/unity-tools/oboz/build_content_picker.sh
          test -s unity-city/Assets/Plugins/Android/BraxContentPicker.jar
      - name: Unity 6 — build only the immutable Obóz Addressables baseline, NOT Android APK
        id: unity
        if: inputs.content_action == 'export-candidate'
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozContentBase.ExportInCI
          manualExit: true
          versioning: None
          allowDirtyBuild: true
      - name: Check generated catalog, state and scene GUID; encrypt baseline candidate
        if: inputs.content_action == 'export-candidate' && steps.unity.outcome == 'success'
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" unity-city/BraxContentBuild unity-city/Assets/PlayableGenerated/Oboz unity-city/Assets/Resources unity-city/Assets/StreamingAssets/BraxContent unity-city/Assets/AddressableAssetsData
          python3 unity-tools/oboz/content_candidate.py validate
          python3 unity-tools/oboz/content_candidate.py seal --output "$RUNNER_TEMP/oboz-content-candidate.tar.zst.enc"
          test ! -f build/ObozAndroid/braxhorn-oboz.apk
          echo "BRAXHORN_OBOZ_CONTENT export=encrypted-candidate APK=NOT_BUILT phone=NOT_TESTED" >> "$GITHUB_STEP_SUMMARY"
      - name: Save only encrypted source candidate, never plaintext private models
        if: inputs.content_action == 'export-candidate' && steps.unity.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-content-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oboz-content-candidate.tar.zst.enc
            ${{ runner.temp }}/oboz-content-candidate.tar.zst.enc.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Non-sensitive content validation receipt for second reviewer
        if: always() && inputs.content_action == 'export-candidate'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oboz-content-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: unity-city/BraxContentBuild/content-candidate-review.json
          if-no-files-found: ignore
          retention-days: 14

  oboz-content-update:
    name: "Obóz — aktualizacja istniejącej bazy bez APK"
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105' && inputs.content_action == 'update-from-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Existing branch source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/
            unity-tools/updates/
            unity-tools/oboz/
      - name: No base = no update; require immutable released base and explicit scene-only patch
        env:
          BASE_ID: ${{ inputs.base_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          base=os.environ.get("BASE_ID", "")
          assert re.fullmatch(r"oboz-[a-f0-9]{32}",base), "No verified owner-approved oboz baseline ID"
          p=Path("unity-city/content-patch.json")
          assert p.is_file() and p.stat().st_size>10, "No explicit scene patch: never rebuild a full game"
          print("BRAXHORN_OBOZ_PATCH_SOURCE base=" + base)
          PY
          test ! -f unity-city/content-mode.txt || test "$(cat unity-city/content-mode.txt)" != "baseline"
      - name: Restore EXACT encrypted signed-base source and Addressables content state
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          BASE_ID: ${{ inputs.base_id }}
        run: |
          set -euo pipefail
          test -n "$KLUCZ" || { echo "::error::Brak szyfrowania bazy"; exit 1; }
          python3 unity-tools/updates/content_snapshot.py restore-base --base "$BASE_ID"
          test -s unity-city/BraxContentBuild/base/addressables_content_state.bin
          test -s unity-city/BraxContentBuild/base/scene-guids.txt
      - name: Verify no C# / package mutation on a content-only update
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
          python3 -m unittest discover -s unity-tools/updates -p 'test_content_snapshot.py' -v
          test ! -f build/ObozAndroid/braxhorn-oboz.apk
      - name: Unity 6 — update previous Addressables content state, never BuildPlayer
        id: unity_update
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozContentBase.UpdateInCI
          manualExit: true
          versioning: None
          allowDirtyBuild: true
      - name: Confirm only one changed-content archive and stage it in private DRAFT
        if: steps.unity_update.outcome == 'success'
        env:
          BASE_ID: ${{ inputs.base_id }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" unity-city/BraxContentBuild
          python3 - <<'PY'
          from pathlib import Path
          import json,os,zipfile
          paths=list(Path("unity-city/BraxContentBuild").glob("*.braxupdate.zip"))
          assert len(paths)==1 and 0<paths[0].stat().st_size<2*1024**3, "Need one small content update, not an APK"
          with zipfile.ZipFile(paths[0]) as z:
              assert z.testzip() is None and "manifest.json" in z.namelist()
              m=json.loads(z.read("manifest.json"))
              assert m["zone"]=="oboz" and m["baseId"]==os.environ["BASE_ID"]
              assert m["firstScene"]=="BraxhornObozReview"
          print("BRAXHORN_CONTENT_ONLY VERIFIED",paths[0].name,paths[0].stat().st_size)
          PY
          python3 unity-tools/updates/content_snapshot.py publish-update --base "$BASE_ID"
          test ! -f build/ObozAndroid/braxhorn-oboz.apk
          echo "BRAXHORN_OBOZ_CONTENT=private-draft-only APK=NOT_BUILT phone=NOT_TESTED" >> "$GITHUB_STEP_SUMMARY"
