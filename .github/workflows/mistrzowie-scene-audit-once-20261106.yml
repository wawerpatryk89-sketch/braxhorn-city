name: "Miasto Mistrzów — JEDEN test scen Unity bez Android APK"
run-name: "A1/T11 — realne sceny Unity, bez APK i kontroli kolizji tras"
on:
  push:
    branches:
      - gpt/miasto-mistrzow-kasyno-t11-20261105
    paths:
      - .github/workflows/mistrzowie-scene-audit-once-20261106.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: champions-t11-scene-audit-once
  cancel-in-progress: false

jobs:
  signed-source-preflight:
    name: Confirm current branch source and no APK path
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuild.cs
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsSourceReadiness.cs
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsCasinoPbr2K.cs
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsCasinoT11.cs
            unity-city/Packages/manifest.json
      - name: Check actual pre-Unity scene smoke, leave physics colliders unchanged
        run: |
          set -euo pipefail
          grep -Fq 'ValidateScenes() => BuildInternal(false,true,true);' unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuild.cs
          grep -Fq 'BraxChampionsSourceReadiness.VerifyBeforeScene();' unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuild.cs
          grep -Fq 'BraxChampionsCasinoPbr2K.VerifyOriginalSourceMaps();' unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuild.cs
          grep -Fq 'com.unity.meshopt.decompress' unity-city/Packages/manifest.json
          grep -Fq 'com.unity.cloud.ktx' unity-city/Packages/manifest.json
          echo 'SCENE-ONLY preflight PASS, physical colliders preserved' >> "$GITHUB_STEP_SUMMARY"

  real-champions-scenes:
    needs: signed-source-preflight
    uses: ./.github/workflows/mistrzowie-apk.yml
    with:
      etap: sceny
      kontrola_tras: false
      zdjecia: false
      recovery_run: ''
      base_id: ''
      commit: gpt/miasto-mistrzow-kasyno-t11-20261105
      arena_assets_tag: champions-a1-20261105
    secrets: inherit
