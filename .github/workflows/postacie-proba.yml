name: Pokoj prob postaci (bez APK, bez rejonu)

# OSOBNY POKOJ PROB (wlasciciel 16.11, 08:47-08:48: "osobny pokoj na testy dla postaci i tyle.
# I tam bedziemy testowac"; "nie mozesz tego zrobic tak, zeby to w kolejce nie stalo").
#
# Wlasna grupa concurrency — NIGDY nie czeka za buildem rejonu (ten ma grupe claude-region-<ref>).
# Nie generuje rejonu, nie buduje APK, nie dotyka wydan. Sparse checkout, build na Linuxa,
# uruchomienie bezglowe pod xvfb, gotowy MP4 w artefakcie.
'on':
  workflow_dispatch:
    inputs:
      postacie:
        description: 'MAX 5 postaci po przecinku. Puste = pierwsza piatka (patryk + czterej nowi)'
        type: string
        default: ''
      tryb:
        description: 'apk = LEKKI APK na telefon | solo, rozmowa, walka, stres = bramki na liczbach + film'
        type: choice
        options:
        - apk
        - solo
        - rozmowa
        - walka
        - stres
        default: apk
      klatek:
        description: 'Klatek na etap (36 = 1,5 s przy 24 kl./s)'
        type: string
        default: '36'

permissions:
  contents: write   # pobranie prywatnego szkicu wydania z paczka obsady

concurrency:
  group: postacie-proba-${{ github.ref }}-${{ inputs.tryb }}
  cancel-in-progress: true

jobs:
  pokoj:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        sparse-checkout: |
          unity-city/Assets
          unity-city/Packages
          unity-city/ProjectSettings
          unity-tools/claude
        persist-credentials: false

    # SZYBKIE TESTY (wlasciciel 16.11, 09:03): postac raz przerobiona przez Blendera zostaje
    # w pamieci podrecznej; kolejny przebieg bierze ja gotowa i pomija Blendera.
    - name: Pamiec podreczna przerobionych postaci
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: unity-city/Assets/Source/ObsadaOsiedla
        key: postacie-przerobione-v2-${{ hashFiles('unity-tools/claude/osiedle_ruch.py','unity-tools/claude/osiedle_twarz.py','unity-tools/claude/osiedle_odstep.py','unity-tools/claude/pobierz_obsade.py') }}-${{ github.run_id }}
        restore-keys: |
          postacie-przerobione-v2-${{ hashFiles('unity-tools/claude/osiedle_ruch.py','unity-tools/claude/osiedle_twarz.py','unity-tools/claude/osiedle_odstep.py','unity-tools/claude/pobierz_obsade.py') }}-

    - name: Pamiec podreczna Library Unity
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: unity-city/Library
        key: pokoj-prob-library-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ github.run_id }}
        restore-keys: |
          pokoj-prob-library-v2-${{ hashFiles('unity-city/Packages/manifest.json') }}-

    - name: Blender i FFmpeg
      run: |
        bash unity-tools/claude/blender_ci.sh
        command -v ffmpeg >/dev/null || { sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg; }

    - name: Przygotuj wskazane postacie z zatwierdzonej paczki
      env:
        GH_TOKEN: ${{ github.token }}
        BRAX_POSTACIE: ${{ inputs.postacie }}
        BRAX_TRYB: ${{ inputs.tryb }}
      run: |
        python3 unity-tools/claude/pokoj-prob/przygotuj.py
        # Zlecenie zapisuje sam prep — z ROZWIAZANA lista postaci (slowo "wszystkie" Unity nic nie mowi).
        echo "zlecenie pokoju:"; cat unity-city/pokoj-prob.txt

    - name: Wlasny klucz podpisu (ten sam co gra; APK pokoju ma OSOBNY identyfikator)
      if: inputs.tryb == 'apk'
      env:
        KS: ${{ secrets.BRAXHORN_KEYSTORE }}
        KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
      run: |
        cd unity-city
        if [ -n "${KS:-}" ] && [ -n "${KP:-}" ]; then
          echo "$KS" | base64 -d > braxhorn.keystore && printf '%s' "$KP" > braxhorn.keystore.pass
          echo "klucz podpisu: OK"
        else echo "brak klucza — APK podpisane kluczem debug"; fi

    - name: Zbuduj APK pokoju prob
      if: inputs.tryb == 'apk'
      uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        projectPath: unity-city
        unityVersion: 6000.0.58f2
        targetPlatform: Android
        androidExportType: androidPackage
        buildMethod: BraxPokojProbBuild.ZbudujApk
        allowDirtyBuild: true
        versioning: None

    - name: Wgraj APK pokoju
      if: inputs.tryb == 'apk'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pokoj-apk-${{ github.run_id }}
        path: build/Android/braxhorn-pokoj.apk
        if-no-files-found: error
        retention-days: 14

    - name: Zbuduj pokoj prob
      if: inputs.tryb != 'apk'
      uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        BRAX_POSTACIE: ${{ inputs.postacie }}
        BRAX_TRYB: ${{ inputs.tryb }}
      with:
        projectPath: unity-city
        unityVersion: 6000.0.58f2
        targetPlatform: StandaloneLinux64
        buildMethod: BraxPokojProbBuild.Zbuduj
        allowDirtyBuild: true
        versioning: None

    # TYLKO LICZBY, BEZ FILMU. Serwer nie ma karty graficznej (w logu gry: "Renderer: llvmpipe"),
    # a zapis kazdej klatki (ReadPixels + JPEG) jest tam tak drogi, ze proba stresu nie doszla do
    # konca w 900 s i zapisala JEDNA klatke (run 43865869702, kod 124 = ubita przez timeout).
    # Bramki licza sie szybko, bo nie czytaja bufora. FILM bierzemy z APK na telefonie, gdzie jest GPU.
    - name: Przelicz bramki kazdej postaci (bez filmu — serwer bez GPU)
      if: inputs.tryb != 'apk'
      env:
        LIBGL_ALWAYS_SOFTWARE: '1'
        BRAX_BEZ_KLATEK: '1'
        BRAX_POSTACIE: ${{ inputs.postacie }}
        BRAX_TRYB: ${{ inputs.tryb }}
      run: |
        set -euo pipefail
        export BRAX_PROBA_KLATKI="$RUNNER_TEMP/klatki"
        # Unity buduje w kontenerze jako root — runner nie moze zmienic praw cudzemu plikowi
        sudo chown -R "$(id -u):$(id -g)" build
        chmod +x build/pokoj/PokojProb.x86_64
        sudo apt-get -qq update
        sudo apt-get -qq install -y xvfb xauth ffmpeg libgl1-mesa-dri pulseaudio pulseaudio-utils
        pulseaudio --start --exit-idle-time=-1
        pactl load-module module-null-sink sink_name=brax_pokoj
        pactl set-default-sink brax_pokoj
        set +e
        timeout 900 xvfb-run -a -s '-screen 0 540x810x24' \
          build/pokoj/PokojProb.x86_64 -force-glcore \
          -screen-width 540 -screen-height 810 -screen-fullscreen 0 \
          -logFile "$RUNNER_TEMP/pokoj.log"
        kod=$?
        set -e
        echo "--- wynik proby ---"
        grep -E 'BRAX_POSTAC |BRAX_ROZMOWA |BRAX_CIOS |BRAX_POKOJ|BRAX_PROBA_POSTACI_KONIEC|BRAX_PROBA_PARY_KONIEC' "$RUNNER_TEMP/pokoj.log" || true
        klatek=$(ls "$BRAX_PROBA_KLATKI"/*.jpg 2>/dev/null | wc -l)
        echo "zapisanych klatek: $klatek (0 = tryb tylko liczby, tak ma byc)"
        if [ -f "$BRAX_PROBA_KLATKI/wynik.txt" ]; then
          echo "--- bramki ---"; cat "$BRAX_PROBA_KLATKI/wynik.txt"
        else
          echo "::error::gra nie zapisala wynik.txt — ostatnie 80 linii logu gry:"
          tail -80 "$RUNNER_TEMP/pokoj.log" || true
          exit 1
        fi
        if [ "$klatek" -gt 0 ]; then
          ffmpeg -hide_banner -loglevel error -framerate 24 \
            -i "$BRAX_PROBA_KLATKI/%05d.jpg" -c:v libx264 -pix_fmt yuv420p \
            -movflags +faststart Pokoj_prob_postaci.mp4
        fi
        echo "kod gry: $kod (1 = ktoras postac nie przeszla, bramki i tak sa wyzej)"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always() && inputs.tryb != 'apk'
      with:
        name: pokoj-prob-${{ github.run_id }}
        path: |
          Pokoj_prob_postaci.mp4
          ${{ runner.temp }}/klatki/wynik.txt
        if-no-files-found: warn
        retention-days: 7
