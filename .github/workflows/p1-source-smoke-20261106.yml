name: P1 BASEN + SPA - source/import smoke (no Unity/APK)

# Runs on this narrow workflow-file change only. No APK/Unity minutes.
# Rerun after fixing the CI-identified water-test NameError.
on:
  push:
    branches:
      - gpt/miasto-mistrzow-basen-p1-20261105
    paths:
      - .github/workflows/p1-source-smoke-20261106.yml
  workflow_dispatch:

# Draft GitHub Releases require the repository-scoped workflow token to have write permission.
# The job remains read-only in practice and never publishes/replaces assets.
permissions:
  contents: write

concurrency:
  group: p1-smoke-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-p1:
    if: github.repository == 'wawerpatryk89-sketch/braxhorn-city'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout only P1 source/test paths
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/mistrzowie-apk.yml
            .github/workflows/p1-source-smoke-20261106.yml
            unity-tools/mistrzowie/test_pool_p1_*.py
            unity-tools/mistrzowie/prepare_pool_p1_slide.py
            unity-tools/mistrzowie/prepare_pool_p1_textures_2k.py
            unity-tools/mistrzowie/import_pool_p1_owner_assets.py
            unity-tools/mistrzowie/verify_pool_p1_model_geometry.py
            unity-tools/validation/check_csharp_scopes.py
            unity-tools/validation/requirements.txt
            unity-tools/mistrzowie/unpack_a1_t11_nested_release.py
            unity-tools/mistrzowie/import_champion_assets.py
            unity-tools/mistrzowie/import_selected_a1_t11.py
            unity-tools/mistrzowie/legacy_foundation.py
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsPoolP1*.cs
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsBuildings.cs
            unity-city/Assets/Editor/Mistrzowie/BraxChampionsCitySignsTextureImport.cs
            unity-city/Assets/BraxGymPlayer.cs
            unity-city/Assets/Claude/Runtime/BraxSwimmingZone.cs
            unity-city/Assets/Mistrzowie/BraxChampionsPoolSwimVolume.cs
            unity-city/Assets/Mistrzowie/BraxChampionsPoolWater.shader
            unity-city/Assets/Source/Mistrzowie/PoolP1/plot.json
      - name: P1 source-contract unit tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_pool_p1_*.py' -v
          python3 -m py_compile unity-tools/mistrzowie/import_pool_p1_owner_assets.py unity-tools/mistrzowie/prepare_pool_p1_slide.py
          echo "P1_STATIC_CONTRACTS_PASS - no Unity Editor, no APK"
      - name: C# source syntax and local-variable scope audit (P1 only)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q -r unity-tools/validation/requirements.txt
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets/Editor/Mistrzowie
          echo "P1_CSHARP_SYNTAX_SCOPE_PASS; Unity type/API compilation still required"
      - name: Read owner private draft Release and verify ZIP archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          asset_name="P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          asset_id="$(printf '%s' "$release_json" | jq -r \
            --arg tag "p1-basen-spa-20261106" --arg file "$asset_name" \
            '[.[] | select(.tag_name==$tag) | .assets[]? | select(.name==$file) | .id] | first // empty')"
          test -n "$asset_id" || { echo "::error::Expected P1 private draft source release missing";exit 1; }
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/$asset_name"
          python3 unity-tools/mistrzowie/import_pool_p1_owner_assets.py "$RUNNER_TEMP/$asset_name" --dry-run
          python3 unity-tools/mistrzowie/verify_pool_p1_model_geometry.py "$RUNNER_TEMP/$asset_name"
          echo "P1_ORIGINAL_OWNER_ZIP_SHA256_GUIDS_CRC_PASS - no import side effects"
      - name: Diagnose shared A1/T11 original release assets (metadata only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          printf '%s' "$release_json" | jq -r \
            '.[] | select(.tag_name=="champions-a1-20261105") |
               "A1_T11_RELEASE id=\(.id) draft=\(.draft) assets=\([.assets[].name]|join(","))"'
          source_zip="BRAXHORN_MISTRZOWIE_A1_T11_ORIGINALY_DO_BUILD.zip"
          asset_id="$(printf '%s' "$release_json" | jq -r \
            --arg name "$source_zip" '[.[] | .assets[]? | select(.name==$name) | .id] | first // empty')"
          if [ -z "$asset_id" ]; then
            echo "A1_T11_SOURCE_ARCHIVE_NOT_IN_RELEASE; build preflight needs original owner archive"
            exit 0
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/$source_zip"
          python3 - "$RUNNER_TEMP/$source_zip" <<'PYSOURCE'
          import sys,hashlib,zipfile
          p=sys.argv[1]; raw=open(p,'rb').read()
          actual=hashlib.sha256(raw).hexdigest()
          print('A1_T11_SOURCE_ZIP_SHA256',actual,'size',len(raw))
          if actual!='43ea47f02a1f2e9e4f707bb75d16ec0a3fe79ec02762929ca591e317defa1088':
              raise SystemExit('A1_T11 original ZIP changed from user approved source')
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              print('A1_T11_SOURCE_ENTRIES',len(names),'badCRC',z.testzip())
              for n in names:
                  if n.lower().endswith(('.jpg','.png','.meta','.json','.zip')):
                      print('A1_T11_ENTRY',n,'bytes',z.getinfo(n).file_size)
          PYSOURCE
          python3 unity-tools/mistrzowie/unpack_a1_t11_nested_release.py \
            "$RUNNER_TEMP/$source_zip" "$RUNNER_TEMP" --dry-run
          echo "A1_T11_ORIGINAL_NESTED_SOURCE_HASHES_PASS"
          # Real, local-only source installation into ephemeral checkout,
          # exactly as the production build will do. No Unity Editor/APK.
          python3 unity-tools/mistrzowie/unpack_a1_t11_nested_release.py \
            "$RUNNER_TEMP/$source_zip" "$RUNNER_TEMP"
          python3 unity-tools/mistrzowie/import_champion_assets.py \
            "$RUNNER_TEMP/ARENA_A1_DO_GITHUB_POBIERZ_PONOWNIE.zip" --dry-run
          python3 unity-tools/mistrzowie/import_champion_assets.py \
            "$RUNNER_TEMP/ARENA_A1_DO_GITHUB_POBIERZ_PONOWNIE.zip"
          python3 unity-tools/mistrzowie/import_selected_a1_t11.py \
            "$RUNNER_TEMP/ARENA_A1_KASYNO_T11_ORYGINALY_Z_GABLOTA.zip" --dry-run
          python3 unity-tools/mistrzowie/import_selected_a1_t11.py \
            "$RUNNER_TEMP/ARENA_A1_KASYNO_T11_ORYGINALY_Z_GABLOTA.zip"
          python3 unity-tools/mistrzowie/import_pool_p1_owner_assets.py \
            "$RUNNER_TEMP/P1_BASEN_SPA_ORIGINALNE_WYPOSAZENIE_20261106.zip"
          test -s unity-city/Assets/Source/Mistrzowie/CitySigns/01_GLOWNE/C1_KASYNO_KASYNO_WAWER.png
          test -s unity-city/Assets/Source/Mistrzowie/CitySigns/01_GLOWNE/P1_BASEN_BASEN_MIEJSKI.png
          test -s unity-city/Assets/Source/Mistrzowie/PoolP1/OwnerEquipment/hot-tub-original-exterior-model.glb
          echo "A1_T11_AND_P1_REAL_SOURCE_INSTALL_PASS no Unity/APK execution"

      - name: Report source-only scope
        if: always()
        shell: bash
        run: |
          printf '### P1 source/import preflight\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Branch: %s\n\nCommit: %s\n\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'This is lightweight source + asset validation. No Unity compilation, PlayMode, Android test or APK was executed.\n' >> "$GITHUB_STEP_SUMMARY"
