name: Cancel mistaken Obóz auto-APK 42332210392

on:
  push:
    branches: [codex/oboz-przebudowa-pbr-20261105]
    paths: [.github/workflows/cancel-mistaken-oboz-auto-20261107.yml]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel only the mistakenly created auto-APK watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/42332210392/cancel"
          echo "CANCEL_REQUESTED run=42332210392"
