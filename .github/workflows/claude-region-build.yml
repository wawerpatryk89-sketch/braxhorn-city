name: Miasto Mistrzow - exploration APK or editable region
on:
  workflow_dispatch:
    inputs:
      rejon:
        description: 'Ta gałąź: mistrzowie; pozostałe rejony nie są tu budowane'
        type: string
        default: mistrzowie
      wariant:
        description: 'apk = zwiedzanie na Androidzie; region = edytowalna scena i bundles'
        type: choice
        options: [apk, region]
        default: apk
      pamiec:
        description: 'Zgodność formularza istniejącego workflow; pierwszy eksport jest pełny'
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: mistrzowie-apk
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Verify explicitly selected region
        env:
          REGION: ${{ inputs.rejon }}
        run: test "$REGION" = mistrzowie
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            unity-city/Assets
            unity-city/Packages
            unity-city/ProjectSettings
            unity-city/Prywatne/miasto_palmy.tar.gz.enc
            unity-city/Prywatne/miasto_silownia_metro.tar.gz.enc
            unity-city/Prywatne/import-patryk-20261103
            unity-city/Prywatne/import-patryk-animations-20261104
            unity-city/Prywatne/ruchy_brax.tar.gz.enc
            unity-city/Prywatne/ruchy_wlasciciela.tar.gz.enc
            unity-tools/mistrzowie
            unity-tools/validation
            unity-tools/claude/prywatne.py
            unity-tools/claude/import_patryk_transfer.py
            unity-tools/claude/import_patryk_animations.py
            unity-tools/claude/tekstury_b5.py
      - name: C# syntax and local scopes before Unity (CS0136 regression)
        run: |
          python3 -m pip install --disable-pip-version-check -r unity-tools/validation/requirements.txt
          python3 -m unittest discover -s unity-tools/validation -p 'test_*.py' -v
          python3 unity-tools/validation/check_csharp_scopes.py unity-city/Assets
      - name: Prepare runner disk and 12 GiB Unity swap
        run: |
          # Keep the host Android SDK: APK certificate/identity verification needs it.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean
          sudo docker image prune --all --force
          sudo fallocate -l 12G /swapfile-mistrzowie
          sudo chmod 600 /swapfile-mistrzowie
          sudo mkswap /swapfile-mistrzowie
          sudo swapon /swapfile-mistrzowie
          df -h /
          free -h
      - name: Cache original public PBR source maps
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: unity-city/Assets/Source/Mistrzowie/Textures
          key: mistrzowie-pbr-4k-${{ hashFiles('unity-tools/mistrzowie/prepare_assets.py', 'unity-tools/mistrzowie/verified_textures.json') }}
      - name: Geometry and source preparation
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 -m pip install numpy==2.2.6 shapely==2.1.2 pillow==11.3.0 matplotlib==3.10.7
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf
          python3 -m unittest discover -s unity-tools/mistrzowie -p 'test_*.py' -v
          python3 unity-tools/mistrzowie/prepare_assets.py
          python3 unity-tools/mistrzowie/restore_private.py
          python3 unity-tools/mistrzowie/restore_player.py
          python3 unity-tools/mistrzowie/prepare_signage.py
          python3 unity-tools/mistrzowie/build_infrastructure.py
          python3 unity-tools/mistrzowie/prepare_landscape.py
          python3 unity-tools/mistrzowie/validate_contract.py
          python3 unity-tools/mistrzowie/build_exteriors.py
          python3 unity-tools/mistrzowie/audit_layout.py
          python3 unity-tools/mistrzowie/build_signs.py
          python3 unity-tools/mistrzowie/prepare_arena.py
      - name: Restore isolated encrypted Champions Library
        id: library
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-6000.0.58f2-v1-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            champions-library-android-6000.0.58f2-v1-${{ hashFiles('unity-city/Packages/manifest.json') }}-
      - name: Restore imported assets and source GUIDs
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: bash unity-tools/mistrzowie/library_cache.sh restore unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
      - name: Remove restored archive and report remaining space
        run: |
          rm -f "$RUNNER_TEMP/champions-library.tar.zst.enc"
          df -h /
      - name: Prepare the existing signing key for the exploration APK
        if: inputs.wariant != 'region'
        env:
          KS: ${{ secrets.BRAXHORN_KEYSTORE_B64 }}
          KP: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          test -n "$KS" && test -n "$KP"
          umask 077
          printf '%s' "$KS" | base64 --decode > unity-city/braxhorn.keystore
          printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
          python3 unity-tools/mistrzowie/apk_version.py > unity-city/braxhorn.versioncode
      - name: Unity - generate region and build the selected output
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: ${{ inputs.wariant == 'region' && 'BraxChampionsBuild.Build' || 'BraxChampionsBuild.BuildAndroid' }}
          androidExportType: androidPackage
          versioning: None
          allowDirtyBuild: true
      - name: Validate APK identity and existing certificate; stage immutable output
        id: apk_stage
        if: always() && !cancelled() && inputs.wariant != 'region' && hashFiles('build/Android/braxhorn-mistrzowie.gotowe') != ''
        run: python3 unity-tools/mistrzowie/apk_delivery.py stage
      - name: Immediately save APK as Actions artifact
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        id: apk_artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-apk-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: mistrzowie-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Independently save APK as a unique test release
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        id: apk_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          python3 - <<'PYNOTES'
          import json, pathlib
          m = json.loads(pathlib.Path('mistrzowie-apk/manifest.json').read_text())
          pathlib.Path('mistrzowie-apk/release-notes.txt').write_text(
              'Miasto Mistrzów — zwiedzanie Patrykiem, sterowanie z gry.\n\n'
              + 'Commit: ' + m['commit'] + '\nSHA-256 APK: ' + m['sha256']
              + '\nTest wizualny i sterowanie na urządzeniu: jeszcze niepotwierdzone.\n')
          PYNOTES
          gh release create "$tag" mistrzowie-apk/*.apk mistrzowie-apk/manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Miasto Mistrzów — APK ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" --notes-file mistrzowie-apk/release-notes.txt
      - name: Confirm at least one real APK delivery before optional reports
        id: apk_delivery
        if: always() && !cancelled() && steps.apk_stage.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_ARTIFACT_ID: ${{ steps.apk_artifact.outputs.artifact-id }}
          APK_ARTIFACT_URL: ${{ steps.apk_artifact.outputs.artifact-url }}
        run: |
          export APK_RELEASE_TAG="mistrzowie-apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:7}"
          python3 unity-tools/mistrzowie/apk_delivery.py verify
      - name: Encrypt region with existing repository key
        if: inputs.wariant == 'region'
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/mistrzowie/package_output.py
      - name: Save encrypted editable scene and Android bundles
        if: inputs.wariant == 'region'
        id: delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-region-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: mistrzowie-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Verify delivered encrypted region in GitHub API
        if: inputs.wariant == 'region'
        env:
          GH_TOKEN: ${{ github.token }}
          REGION_ARTIFACT_ID: ${{ steps.delivery.outputs.artifact-id }}
          REGION_ARTIFACT_URL: ${{ steps.delivery.outputs.artifact-url }}
        run: python3 unity-tools/mistrzowie/verify_delivery.py
      - name: Pack encrypted import cache after confirmed APK delivery
        id: library_pack
        if: success() && steps.apk_delivery.outcome == 'success'
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          sudo swapoff /swapfile-mistrzowie || true
          sudo rm -f /swapfile-mistrzowie
          sudo docker image prune --all --force
          sudo chown -R "$(id -u):$(id -g)" unity-city/Library
          bash unity-tools/mistrzowie/library_cache.sh save unity-city "$RUNNER_TEMP/champions-library.tar.zst.enc"
      - name: Save isolated encrypted Champions Library
        if: success() && steps.library_pack.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/champions-library.tar.zst.enc
          key: champions-library-android-6000.0.58f2-v1-${{ hashFiles('unity-city/Packages/manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            mistrzowie-evidence/*.json
            unity-city/Assets/Source/Mistrzowie/source-materials.json
            unity-city/Logs/
          if-no-files-found: warn
          retention-days: 30
