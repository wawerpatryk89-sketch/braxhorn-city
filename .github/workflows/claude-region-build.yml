name: Miasto Mistrzow - metro and first building exteriors
on:
  workflow_dispatch:
    inputs:
      rejon:
        description: 'Ta gałąź: mistrzowie; pozostałe rejony nie są tu budowane'
        type: string
        default: mistrzowie
      pamiec:
        description: 'Zgodność formularza istniejącego workflow; pierwszy eksport jest pełny'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: mistrzowie-foundation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Verify explicitly selected region
        env:
          REGION: ${{ inputs.rejon }}
        run: test "$REGION" = mistrzowie
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            unity-city/Assets
            unity-city/Packages
            unity-city/ProjectSettings
            unity-city/Prywatne/miasto_palmy.tar.gz.enc
            unity-city/Prywatne/miasto_silownia_metro.tar.gz.enc
            unity-city/Prywatne/import-patryk-20261103
            unity-city/Prywatne/ruchy_brax.tar.gz.enc
            unity-city/Prywatne/ruchy_wlasciciela.tar.gz.enc
            unity-tools/mistrzowie
            unity-tools/claude/prywatne.py
            unity-tools/claude/import_patryk_transfer.py
            unity-tools/claude/tekstury_b5.py
      - name: Cache original public PBR source maps
        continue-on-error: true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: unity-city/Assets/Source/Mistrzowie/Textures
          key: mistrzowie-pbr-4k-${{ hashFiles('unity-tools/mistrzowie/prepare_assets.py', 'unity-tools/mistrzowie/verified_textures.json') }}
      - name: Geometry and source preparation
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          python3 -m pip install numpy==2.2.6 shapely==2.1.2 pillow==11.3.0 matplotlib==3.10.7
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf
          python3 unity-tools/mistrzowie/test_surface_geometry.py
          python3 unity-tools/mistrzowie/test_restore_player.py
          python3 unity-tools/mistrzowie/prepare_assets.py
          python3 unity-tools/mistrzowie/restore_private.py
          python3 unity-tools/mistrzowie/restore_player.py
          python3 unity-tools/mistrzowie/prepare_signage.py
          python3 unity-tools/mistrzowie/build_infrastructure.py
          python3 unity-tools/mistrzowie/validate_contract.py
          python3 unity-tools/mistrzowie/build_exteriors.py
          python3 unity-tools/mistrzowie/build_signs.py
          python3 unity-tools/mistrzowie/prepare_arena.py
      - name: Unity - build and validate additive region
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxChampionsBuild.Build
          versioning: None
          allowDirtyBuild: true
      - name: Encrypt region with existing repository key
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: python3 unity-tools/mistrzowie/package_output.py
      - name: Save encrypted editable scene and Android bundles
        id: delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-region-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: mistrzowie-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Verify delivered encrypted region in GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REGION_ARTIFACT_ID: ${{ steps.delivery.outputs.artifact-id }}
          REGION_ARTIFACT_URL: ${{ steps.delivery.outputs.artifact-url }}
        run: python3 unity-tools/mistrzowie/verify_delivery.py
      - name: Save validation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mistrzowie-validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            mistrzowie-evidence/*.json
            unity-city/Assets/Source/Mistrzowie/source-materials.json
            unity-city/Logs/
          if-no-files-found: warn
          retention-days: 30
