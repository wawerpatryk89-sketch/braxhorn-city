        umask 077
        printf '%s' "$KS" | base64 -d > unity-city/braxhorn.keystore
        printf '%s' "$KP" > unity-city/braxhorn.keystore.pass
        cert=$(keytool -exportcert -alias braxhorn -keystore unity-city/braxhorn.keystore -storepass:env KP -rfc | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')
        [ "$cert" = f3829d496e1bf4890ec64af78170c7e8b8696d1e49d4122df2b4fc1c80bd5ffe ] || { echo '::error::Certyfikat rozni sie od wersji 58. Aktualizacja zainstalowanej aplikacji bylaby odrzucona.'; exit 1; }
