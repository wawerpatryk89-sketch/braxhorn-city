name: Obóz BRAXHORN - aktualizacja zawartości BEZ APK
on:
  workflow_dispatch:
    inputs:
      base_id:
        description: 'Istniejący i zatwierdzony oboz-<32 hex> z bazowego BRAXHORN CITY'
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: oboz-content-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  content-update:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/oboz-przebudowa-pbr-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout only the established BRAXHORN content branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            unity-city
            unity-tools/updates
            unity-tools/oboz
      - name: Verify immutable Obóz baseline and zone-scoped edits BEFORE Unity
        env:
          BASE_ID: ${{ inputs.base_id }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          base=os.environ['BASE_ID']
          if not re.fullmatch(r'oboz-[0-9a-f]{32}',base):
              raise SystemExit('Invalid oboz base id; never load city/estate baseline')
          patch=Path('unity-city/content-patch.json')
          if not patch.is_file():
              raise SystemExit('No approved scene patch; refusing an empty update')
          obj=json.loads(patch.read_text(encoding='utf-8'))
          edits=obj.get('edits')
          if not isinstance(edits,list) or not edits:
              raise SystemExit('Scene patch must have explicit edits')
          for edit in edits:
              if not isinstance(edit,dict) or edit.get('scene') != 'Assets/PlayableGenerated/Oboz/BraxhornObozReview.unity':
                  raise SystemExit('Cross-zone edit rejected')
          print('OBOZ_CONTENT_SCOPE=PASS, scenes=1, edits='+str(len(edits)))
          PY
      - name: Restore immutable and encrypted baseline, scenes, metadata and Addressables state
        env:
          GH_TOKEN: ${{ github.token }}
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
          BASE_ID: ${{ inputs.base_id }}
        run: python3 unity-tools/updates/content_snapshot.py restore-base --base "$BASE_ID"
      - name: Prepare Android Unity runner
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Cache profile for isolated Obóz import
        id: cache-profile
        run: python3 unity-tools/updates/unity_cache.py profile --project unity-city --zone oboz --unity 6000.0.58f2
      - name: Recover imported Unity Library (optional)
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/library-android.tar.zst.enc
          key: ${{ steps.cache-profile.outputs.prefix }}content-${{ github.run_id }}
          restore-keys: ${{ steps.cache-profile.outputs.prefix }}
      - name: Restore exact compatible cache when present (optional)
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.BRAXHORN_KEYSTORE_PASS }}
        run: |
          if [ -f "$RUNNER_TEMP/library-android.tar.zst.enc" ]; then
            python3 unity-tools/updates/unity_cache.py restore --zone oboz --archive "$RUNNER_TEMP/library-android.tar.zst.enc" --unity 6000.0.58f2
          fi
      - name: Build only changed Addressables content; NEVER call BuildPlayer
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity-city
          unityVersion: 6000.0.58f2
          targetPlatform: Android
          buildMethod: BraxObozContentBase.UpdateInCI
          manualExit: true
          versioning: None
          allowDirtyBuild: true
      - name: Publish verified content update to authenticated draft, not public CDN
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_ID: ${{ inputs.base_id }}
        run: python3 unity-tools/updates/content_snapshot.py publish-update --base "$BASE_ID"
